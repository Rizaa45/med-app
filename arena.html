// ═══════════════════════════════════════════════════════════════
//  QUESTION NORMALIZER
//  Transforms ANY JSON question type → uniform game format
// ═══════════════════════════════════════════════════════════════
const Normalizer = {
    normalize(q) {
        const base = {
            id: q.q_id,
            topic: q.topic || 'allgemein',
            difficulty: q.difficulty || 1,
            explanation: q.explanation || q.source_hint || '',
            raw: q,
        };
        try {
            switch(q.type) {
                case 'richtig_falsch':          return this.normRF(q, base);
                case 'nennen_liste':            return this.normList(q, base);
                case 'freitext_box':            return this.normText(q, base);
                case 'tabelle_2spalten':
                case 'tabelle_3spalten':
                case 'tabelle_vergleich':        return this.normTable(q, base);
                case 'zuordnung':               return this.normZuordnung(q, base);
                case 'ergaenzen_liste':          return this.normErgaenzen(q, base);
                case 'definition_plus_beispiele':return this.normDefinition(q, base);
                case 'ankreuzen_begruenden':     return this.normAnkreuzen(q, base);
                default:                        return this.normFallback(q, base);
            }
        } catch(e) { return null; }
    },

    clean(text) {
        return (text||'').replace(/\*\*(.*?)\*\*/g, '$1').trim();
    },

    normRF(q, base) {
        const stmts = q.statements || q.data?.statements || [];
        if (stmts.length > 0) {
            const s = stmts[Math.floor(Math.random() * stmts.length)];
            return {...base, type:'tf', display: s.text || 'Aussage',
                answer: s.answer || 'richtig', keywords:[s.answer||'richtig'],
                correctFull: `${s.answer}: ${s.text}`};
        }
        return {...base, type:'tf', display: q.statement || 'Aussage',
            answer: q.answer || 'richtig', keywords:[q.answer||'richtig'],
            correctFull: `${q.answer}: ${q.statement}`};
    },

    normList(q, base) {
        const correct = q.correct_answers || q.data?.correct_answers || [];
        const allValid = q.all_valid_answers || q.data?.all_valid_answers || correct;
        const count = q.count || q.data?.count || correct.length || 3;
        return {...base, type:'list', display: this.clean(q.instruction) || 'Nennen Sie die Antworten.',
            answer: correct.join(', '), keywords: allValid.length ? allValid : correct,
            count: Math.min(count, 6), correctFull: correct.join(' · ')};
    },

    normText(q, base) {
        const data = q.data || {};
        const kw = data.keywords || [];
        const ca = data.correct_answer || kw.join(', ');
        return {...base, type:'text', display: this.clean(q.instruction) || 'Erläutern Sie.',
            answer: ca, keywords: kw, correctFull: ca};
    },

    normTable(q, base) {
        const table = q.data?.table;
        const pairs = [];
        const keywords = [];
        if (table?.rows) {
            table.rows.forEach(row => {
                let label = '';
                row.cells.forEach(cell => {
                    if (cell.type === 'text' || cell.type === 'static') {
                        label = cell.content || cell.value || '';
                    } else if (cell.type === 'input' || cell.type === 'textarea') {
                        const ans = cell.correct_answer || '';
                        const kw = cell.keywords || [];
                        if (ans) { keywords.push(ans); if (label) pairs.push({left:label, right:ans}); }
                        keywords.push(...kw);
                    }
                });
            });
        }
        const cf = pairs.map(p=>`${p.left}: ${p.right}`).join(' · ') || keywords.join(', ');
        return {...base, type: pairs.length >= 3 ? 'connect' : 'text',
            display: this.clean(q.instruction) || 'Füllen Sie aus.',
            answer: cf, keywords, pairs, correctFull: cf};
    },

    normZuordnung(q, base) {
        const data = q.data || {};
        const legend = data.legend || {};
        const stmts = data.statements || [];
        const pairs = stmts.map(s => ({
            left: (s.text||'').length > 55 ? s.text.substring(0,52)+'...' : s.text,
            right: `${s.answer}: ${legend[s.answer]||s.answer}`
        }));
        return {...base, type: pairs.length >= 3 ? 'connect' : 'text',
            display: this.clean(q.instruction) || 'Ordnen Sie zu.',
            answer: stmts.map(s=>`${s.text} → ${s.answer}`).join('; '),
            keywords: Object.values(legend), pairs,
            correctFull: stmts.map(s=>`${legend[s.answer]||s.answer}: ${s.text}`).join(' · ')};
    },

    normErgaenzen(q, base) {
        const data = q.data || {};
        const missing = data.missing_items || [];
        const allValid = data.all_valid_missing || missing;
        return {...base, type:'list', display: this.clean(q.instruction) || 'Ergänzen Sie.',
            answer: missing.join(', '), keywords: allValid.length ? allValid : missing,
            count: missing.length || 3, correctFull: missing.join(' · '),
            givenItems: data.given_items || []};
    },

    normDefinition(q, base) {
        const data = q.data || {};
        const defC = data.definition_correct || '';
        const defKW = data.definition_keywords || [];
        const examples = data.correct_examples || data.all_valid_examples || [];
        const allKW = [...defKW, ...examples];
        const cf = defC + (examples.length ? ' | Beispiele: ' + examples.join(', ') : '');
        return {...base, type:'text', display: this.clean(q.instruction) || 'Definieren Sie.',
            answer: cf, keywords: allKW.length ? allKW : [defC], correctFull: cf};
    },

    normAnkreuzen(q, base) {
        const opts = q.data?.options || [];
        const correctOpts = opts.filter(o=>o.correct).map(o=>o.label);
        if (correctOpts.length > 0) {
            const pick = correctOpts[Math.floor(Math.random()*correctOpts.length)];
            return {...base, type:'tf', display: pick, answer:'richtig',
                keywords:['richtig'], correctFull: 'Korrekte Aussagen: ' + correctOpts.join(', ')};
        }
        return this.normFallback(q, base);
    },

    normFallback(q, base) {
        const display = this.clean(q.instruction || q.statement || '');
        return {...base, type:'text', display: display || 'Frage',
            answer: q.explanation || '', keywords: [],
            correctFull: q.explanation || 'Siehe Lernmaterial'};
    },

    prepareRound(rawQuestions, count, mode) {
        const normalized = [];
        const seen = new Set();

        for (const q of shuffle(rawQuestions)) {
            if (!q.q_id || q.fallabhaengig) continue;
            const n = this.normalize(q);
            if (!n) continue;
            if (!n.display || n.display.length < 5) continue;

            const key = n.display.substring(0, 40).toLowerCase();
            if (seen.has(key)) continue;
            seen.add(key);

            if (mode === 'connect' && n.type !== 'connect') continue;
            if (mode === 'connect' && (!n.pairs || n.pairs.length < 3)) continue;

            if (!n.answer && !n.correctFull && (!n.keywords || n.keywords.length === 0)) continue;

            normalized.push(n);
        }
        return normalized.slice(0, count);
    },

    prepareRoundForTopics(rawQuestions, count, topics) {
        const filtered = rawQuestions.filter(q => topics.includes(q.topic));
        if (filtered.length >= 5) return this.prepareRound(filtered, count, 'recall');
        return this.prepareRound(rawQuestions, count, 'recall');
    }
};

// ═══════════════════════════════════════════════════════════════
//  UTILITIES
// ═══════════════════════════════════════════════════════════════
function save() {
    localStorage.setItem('arena_xp', S.xp);
    localStorage.setItem('arena_ds', S.dailyStreak);
    localStorage.setItem('arena_mastery', JSON.stringify(S.mastery));
    const today = new Date().toISOString().slice(0,10);
    const last = localStorage.getItem('arena_last');
    if (last !== today) {
        const yesterday = new Date(Date.now()-86400000).toISOString().slice(0,10);
        S.dailyStreak = (last === yesterday) ? S.dailyStreak + 1 : 1;
        localStorage.setItem('arena_last', today);
        localStorage.setItem('arena_ds', S.dailyStreak);
    }
}

function getRank(pct) {
    for (let i=RANKS.length-1;i>=0;i--) if(pct>=RANKS[i].min) return RANKS[i];
    return RANKS[0];
}

function getModuleMastery(mid) {
    const t=S.mastery[`module_${mid}`]||{};
    const v=Object.values(t);
    return v.length ? Math.round(v.reduce((a,b)=>a+b,0)/v.length) : 0;
}

function getLevel() { return Math.floor(S.xp/500)+1; }

function getComboMult() {
    return S.combo>=10?3:S.combo>=7?2.5:S.combo>=5?2:S.combo>=3?1.5:1;
}

function shuffle(arr) {
    const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a;
}

function matchKW(text,kw) {
    if(!text||!kw)return false;
    const u=text.toLowerCase().trim(),k=kw.toLowerCase().trim();
    if(u.includes(k))return true;
    if(k.length>=4&&u.includes(k.substring(0,Math.min(k.length,5))))return true;
    return false;
}

function esc(s) { return (s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function resetGame() {
    S.qi=0;S.score=0;S.total=0;S.combo=0;S.maxCombo=0;S.sessionXP=0;S.answers=[];
    S.summaries=[];S.learnTopics=[];S.learnSummaryIdx=0;
    clearInterval(S.sprintTimer);
}

function updateMastery(topic, correct) {
    const mk=`module_${S.module.id}`;
    if(!S.mastery[mk])S.mastery[mk]={};
    const old=S.mastery[mk][topic]||0;
    S.mastery[mk][topic]=Math.round(old*0.7+(correct?100:0)*0.3);
}

// ═══════════════════════════════════════════════════════════════
//  SCREEN: HOME
// ═══════════════════════════════════════════════════════════════
function renderHome() {
    S.screen='home';
    const level=getLevel();
    const weaknesses=JSON.parse(localStorage.getItem('slm_exam_weaknesses')||'[]');
    const hasW=weaknesses.length>0;
    const avgM=Math.round(MODULES.reduce((s,m)=>s+getModuleMastery(m.id),0)/MODULES.length);
    const oRank=getRank(avgM);

    app.innerHTML=`
    <div class="enter">
        <div class="flex items-center justify-between mb-6">
            <a href="index.html" class="text-slate-500 hover:text-violet-400 transition-colors text-sm font-bold">
                <i class="fas fa-arrow-left mr-1.5"></i>Dashboard
            </a>
            <div class="flex items-center gap-2">
                <div class="glass rounded-lg px-2.5 py-1.5 flex items-center gap-1.5 text-xs">
                    <span>🔥</span><span class="text-orange-400 font-extrabold t-num">${S.dailyStreak}</span>
                </div>
                <div class="glass rounded-lg px-2.5 py-1.5 flex items-center gap-1.5 text-xs">
                    <span class="text-violet-400 font-extrabold t-num">${S.xp.toLocaleString()}</span>
                    <span class="text-slate-600 font-bold">XP</span>
                </div>
                <div class="glass rounded-lg px-2.5 py-1.5 text-xs font-bold text-indigo-400">Lv.${level}</div>
            </div>
        </div>

        <div class="text-center mb-8">
            <div class="text-4xl mb-2 rank-glow" style="color:${oRank.color}">${oRank.emoji}</div>
            <h1 class="text-2xl sm:text-3xl font-black tracking-tight">SLM Arena</h1>
            <p class="text-slate-500 text-sm mt-1">Gesamt: <span class="font-bold" style="color:${oRank.color}">${avgM}% · ${oRank.label}</span></p>
        </div>

        ${hasW?`
        <div class="glass rounded-2xl p-4 sm:p-5 mb-6 border-red-500/20 enter" style="animation-delay:.1s">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-red-500/10 text-red-400 rounded-xl flex items-center justify-center pulse-ring shrink-0">
                    <i class="fas fa-crosshairs text-lg"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="text-sm font-bold text-white">Klausur-Schwächen</div>
                    <div class="text-[11px] text-red-400 truncate">${(weaknesses[weaknesses.length-1].weakTopics||[]).slice(0,3).map(t=>t.replace(/_/g,' ')).join(', ')}</div>
                </div>
                <button onclick="startWeakness()" class="bg-red-600 hover:bg-red-500 text-white px-4 py-2 rounded-xl text-xs font-bold transition-colors shrink-0">
                    <i class="fas fa-crosshairs mr-1"></i>Go
                </button>
            </div>
        </div>`:''}

        <h2 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-3 pl-1">Modul wählen</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 mb-6">
            ${MODULES.map((m,i)=>{
                const pct=getModuleMastery(m.id);
                const rank=getRank(pct);
                return`
                <div onclick="selectModule(${m.id})" class="glass rounded-2xl p-4 cursor-pointer hover:border-white/10 transition-all enter" style="animation-delay:${.05+i*.03}s">
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 rounded-xl flex items-center justify-center shrink-0" style="background:${m.color}15;color:${m.color}">
                            <i class="fas ${m.icon} text-sm"></i>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="text-xs font-bold text-white truncate">${m.name}</div>
                            <div class="flex items-center gap-1.5 mt-1">
                                <div class="flex-1 bg-white/5 rounded-full h-1 overflow-hidden">
                                    <div class="h-full rounded-full" style="width:${pct}%;background:${m.color}"></div>
                                </div>
                                <span class="text-[9px] font-bold t-num" style="color:${rank.color}">${rank.emoji}${pct}%</span>
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join('')}
        </div>
    </div>`;
}

// ═══════════════════════════════════════════════════════════════
//  SCREEN: MODULE → MODE PICKER
// ═══════════════════════════════════════════════════════════════
function selectModule(id) {
    S.module=MODULES.find(m=>m.id===id);
    const pct=getModuleMastery(id);
    const rank=getRank(pct);
    const topics=S.mastery[`module_${id}`]||{};
    const hasSummaries=S.module.summaryCount>0;

    app.innerHTML=`
    <div class="enter">
        <button onclick="renderHome()" class="text-slate-500 hover:text-violet-400 text-sm font-bold mb-5 inline-flex items-center gap-1.5 transition-colors">
            <i class="fas fa-arrow-left text-xs"></i>Zurück
        </button>

        <div class="glass rounded-2xl p-5 mb-5">
            <div class="flex items-center gap-4 mb-3">
                <div class="w-12 h-12 rounded-2xl flex items-center justify-center text-xl" style="background:${S.module.color}15;color:${S.module.color}">
                    <i class="fas ${S.module.icon}"></i>
                </div>
                <div class="flex-1">
                    <h2 class="text-lg font-extrabold">Modul ${id}</h2>
                    <p class="text-sm text-slate-400">${S.module.name}</p>
                </div>
                <div class="text-center">
                    <div class="text-2xl rank-glow" style="color:${rank.color}">${rank.emoji}</div>
                    <div class="text-[9px] font-bold" style="color:${rank.color}">${rank.label}</div>
                </div>
            </div>
            <div class="bg-white/5 rounded-full h-2 overflow-hidden">
                <div class="h-full rounded-full" style="width:${pct}%;background:${S.module.color}"></div>
            </div>
            ${Object.keys(topics).length?`
            <div class="mt-3 flex flex-wrap gap-1.5">
                ${Object.entries(topics).sort((a,b)=>a[1]-b[1]).slice(0,8).map(([t,v])=>{
                    const c=v>=70?'#22c55e':v>=40?'#eab308':'#ef4444';
                    return`<span class="text-[9px] font-bold px-2 py-0.5 rounded" style="background:${c}15;color:${c}">${t.replace(/_/g,' ')} ${v}%</span>`;
                }).join('')}
            </div>`:''}
        </div>

        <h3 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-3 pl-1">Trainingsmodus</h3>

//  LOAD QUESTION BANK
// ═══════════════════════════════════════════════════════════════
async function loadBank() {
    const r=await fetch(`data/question-banks/module${S.module.id}_questions.json`);
    if(!r.ok) throw new Error(`Fragenbank für Modul ${S.module.id} nicht gefunden`);
    S.rawBank=await r.json();
    if(!S.rawBank.length) throw new Error('Fragenbank ist leer');
}

// ═══════════════════════════════════════════════════════════════
//  LOAD SUMMARIES — works for ALL modules
// ═══════════════════════════════════════════════════════════════
async function loadSummaries() {
    S.summaries=[];
    const maxUnits=S.module.summaryCount||15;

    // Try loading each unit file — different modules have different counts
    const promises=[];
    for(let i=1;i<=maxUnits;i++){
        promises.push(
            fetch(`data/module${S.module.id}summariesunit${i}.json`)
                .then(r=>r.ok?r.json():null)
                .catch(()=>null)
        );
    }

    const results=await Promise.all(promises);
    results.forEach((data,idx)=>{
        if(!data) return;
        if(Array.isArray(data)){
            data.forEach(item=>{
                if(item && (item.topic || item.content)){
                    S.summaries.push({
                        topic: item.topic || `Thema ${idx+1}`,
                        content: item.content || '',
                        tags: item.tags || [],
                        unit: idx+1
                    });
                }
            });
        }
    });

    return S.summaries.length;
}

// ═══════════════════════════════════════════════════════════════
//  START MODES
// ═══════════════════════════════════════════════════════════════
async function startMode(mode) {
    S.mode=mode;
    resetGame();
    showLoading('Wird vorbereitet...');

    try {
        await loadBank();

        if(mode==='learn'){
            const summaryCount=await loadSummaries();
            if(summaryCount===0){
                // Fallback: no summaries → switch to recall
                S.mode='recall';
                S.normalizedQuestions=Normalizer.prepareRound(S.rawBank,S.roundSize,'recall');
                S.total=S.normalizedQuestions.length;
                if(!S.total) throw new Error('Keine Fragen');
                renderGame();
                return;
            }
            renderLearnPicker();
            return;
        }

        S.normalizedQuestions=Normalizer.prepareRound(S.rawBank,S.roundSize,mode);
        S.total=S.normalizedQuestions.length;
        if(!S.total) throw new Error('Keine passenden Fragen für diesen Modus');

        if(mode==='connect') renderConnectGame();
        else renderGame();
    } catch(e) {
        showError(e.message);
    }
}

async function startWeakness() {
    const w=JSON.parse(localStorage.getItem('slm_exam_weaknesses')||'[]');
    if(!w.length) return renderHome();
    const latest=w[w.length-1];
    S.module=MODULES.find(m=>m.id===latest.module)||MODULES[0];
    S.mode='weakness';
    resetGame();
    showLoading('Schwächen laden...');
    try{
        await loadBank();
        let pool=S.rawBank.filter(q=>q.q_id&&!q.fallabhaengig);
        if(latest.weakTopics?.length){
            const wp=pool.filter(q=>latest.weakTopics.includes(q.topic));
            if(wp.length>=3) pool=wp;
        }
        S.normalizedQuestions=Normalizer.prepareRound(pool,S.roundSize,'recall');
        S.total=S.normalizedQuestions.length;
        if(!S.total) throw new Error('Keine schwachen Fragen gefunden');
        renderGame();
    }catch(e){ showError(e.message); }
}

async function startLearnQuiz() {
    showLoading('Quiz wird aus gelesenen Themen erstellt...');

    // Try to filter questions by topics the user just read
    const uniqueTopics=[...new Set(S.learnTopics)];

    if(S.rawBank.length===0){
        try{ await loadBank(); }catch(e){ showError(e.message); return; }
    }

    // Try topic-filtered first, fall back to all questions
    S.normalizedQuestions=Normalizer.prepareRoundForTopics(S.rawBank, S.roundSize, uniqueTopics);
    S.total=S.normalizedQuestions.length;

    if(S.total===0){
        // Complete fallback
        S.normalizedQuestions=Normalizer.prepareRound(S.rawBank, S.roundSize, 'recall');
        S.total=S.normalizedQuestions.length;
    }

    if(S.total===0){ showError('Keine Fragen verfügbar'); return; }

    S.mode='recall'; // quiz phase uses recall mechanics
    renderGame();
}

        </div>
        <div class="glass rounded-2xl p-4 mb-4 border-emerald-500/15">
            <div class="text-[9px] font-bold text-emerald-400 uppercase tracking-widest mb-1"><i class="fas fa-link mr-1"></i>Paare verbinden</div>
            <p class="text-sm text-white font-bold">${esc(q.display)}</p>
        </div>
        <div class="grid grid-cols-2 gap-2.5">
            <div class="space-y-2">
                ${lItems.map(it=>`
                <div onclick="cClick('l',${it.idx})" id="cl-${it.idx}" class="glass rounded-xl p-3 text-xs font-bold text-white cursor-pointer hover:border-emerald-500/30 transition-all leading-snug">${esc(it.text)}</div>`).join('')}
            </div>
            <div class="space-y-2">
                ${rItems.map(it=>`
                <div onclick="cClick('r',${it.idx})" id="cr-${it.idx}" class="glass rounded-xl p-3 text-xs font-bold text-slate-400 cursor-pointer hover:border-emerald-500/30 transition-all leading-snug">${esc(it.text)}</div>`).join('')}
            </div>
        </div>
        <div id="fb" class="mt-3"></div>
    </div>`;
}

function cClick(side,idx) {
    if(S.connectMatched.has(idx)) return;
    if(S.connectSelected===null){
        S.connectSelected={side,idx};
        const el=$(`c${side}-${idx}`);
        if(el)el.style.borderColor='rgba(16,185,129,.5)';
    }else{
        const prev=S.connectSelected;
        S.connectSelected=null;
        if(prev.side===side){
            const pel=$(`c${prev.side}-${prev.idx}`);if(pel)pel.style.borderColor='';
            S.connectSelected={side,idx};const el=$(`c${side}-${idx}`);if(el)el.style.borderColor='rgba(16,185,129,.5)';
            return;
        }
        const lIdx=prev.side==='l'?prev.idx:idx;
        const rIdx=prev.side==='r'?prev.idx:idx;
        const lEl=$(`cl-${lIdx}`),rEl=$(`cr-${rIdx}`);
        if(lIdx===rIdx){
            S.connectMatched.add(lIdx);
            if(lEl){lEl.style.background='rgba(16,185,129,.12)';lEl.style.borderColor='rgba(16,185,129,.3)';lEl.style.pointerEvents='none';}
            if(rEl){rEl.style.background='rgba(16,185,129,.12)';rEl.style.borderColor='rgba(16,185,129,.3)';rEl.style.pointerEvents='none';}
            if(S.connectMatched.size>=S.connectPairs.length){
                S.score++;S.combo++;S.maxCombo=Math.max(S.maxCombo,S.combo);
                const earned=Math.round(25*getComboMult());
                S.xp+=earned;S.sessionXP+=earned;
                S.answers.push({correct:true,earned,topic:S.normalizedQuestions[S.qi].topic});
                updateMastery(S.normalizedQuestions[S.qi].topic,true);save();
                setTimeout(()=>{S.qi++;renderConnectGame();},500);
            }
        }else{
            S.combo=0;
            if(lEl){lEl.classList.add('shake');lEl.style.borderColor='rgba(239,68,68,.5)';}
            if(rEl){rEl.classList.add('shake');rEl.style.borderColor='rgba(239,68,68,.5)';}
            const pel=$(`c${prev.side}-${prev.idx}`);if(pel)pel.style.borderColor='';
            setTimeout(()=>{
                if(lEl){lEl.classList.remove('shake');lEl.style.borderColor='';}
                if(rEl){rEl.classList.remove('shake');rEl.style.borderColor='';}
            },400);
        }
    }
}

// ═══════════════════════════════════════════════════════════════
//  ANSWER SUBMISSION
// ═══════════════════════════════════════════════════════════════
function submitTF(val) {
    clearInterval(S.sprintTimer);
    const q=S.normalizedQuestions[S.qi];
    showFeedback(val.toLowerCase()===(q.answer||'').toLowerCase());
}

function submitText() {
    clearInterval(S.sprintTimer);
    const q=S.normalizedQuestions[S.qi];
    const text=$('ai-text')?.value?.trim()||'';
    if(!text) return;
    const kw=q.keywords||[];
    if(!kw.length){showFeedback(text.length>5);return;}
    let matched=0;
    kw.forEach(k=>{if(matchKW(text,k))matched++;});
    showFeedback(matched/kw.length>=0.35);
}

function submitList(count) {
    clearInterval(S.sprintTimer);
    const q=S.normalizedQuestions[S.qi];
    const kw=q.keywords||[];
    let matched=0;
    const used=new Set();
    for(let i=0;i<count;i++){
        const val=$(`ai-${i}`)?.value?.trim()||'';
        if(!val)continue;
        const m=kw.find((k,ki)=>!used.has(ki)&&matchKW(val,k));
        if(m){matched++;used.add(kw.indexOf(m));}
    }
    showFeedback(matched>=Math.max(1,Math.ceil(count*0.35)));
}

// ═══════════════════════════════════════════════════════════════
//  FEEDBACK
// ═══════════════════════════════════════════════════════════════
function showFeedback(correct) {
    clearInterval(S.sprintTimer);
    const q=S.normalizedQuestions[S.qi];
    if(correct){S.combo++;S.score++;}else{S.combo=0;}
    S.maxCombo=Math.max(S.maxCombo,S.combo);
    const baseXP=correct?(q.difficulty===3?30:q.difficulty===2?20:15):2;
    const mult=getComboMult();
    const earned=Math.round(baseXP*mult);
    S.xp+=earned;S.sessionXP+=earned;
    S.answers.push({correct,earned,topic:q.topic});
    updateMastery(q.topic,correct);save();

    const wrap=$('gw');
    if(wrap&&correct){
        const fl=document.createElement('div');
        fl.className='float-up text-violet-400 font-extrabold text-sm';
        fl.textContent=`+${earned} XP`;
        fl.style.right='16px';fl.style.top='16px';
        wrap.appendChild(fl);
    }

    const aa=$('aa');if(aa){aa.style.opacity='.3';aa.style.pointerEvents='none';}
    const fb=$('fb');

    fb.innerHTML=`
    <div class="glass rounded-2xl p-4 sm:p-5 ${correct?'border-green-500/20':'border-red-500/20'} enter mt-3">
        <div class="flex items-center gap-3 mb-3">
            <div class="w-9 h-9 rounded-xl flex items-center justify-center shrink-0 ${correct?'bg-green-500/10 text-green-400':'bg-red-500/10 text-red-400'} pop">
                <i class="fas ${correct?'fa-check':'fa-times'}"></i>
            </div>
            <div>
                <div class="font-bold text-sm ${correct?'text-green-400':'text-red-400'}">${correct?'Richtig!':'Nicht ganz'}</div>
                <div class="text-[10px] text-slate-500">+${earned} XP${S.combo>=3?` · 🔥×${mult.toFixed(1)}`:''}</div>
            </div>
        </div>
        <div class="bg-white/5 rounded-lg p-3">
            <div class="text-[9px] font-bold text-slate-500 uppercase tracking-widest mb-1">Richtige Antwort</div>
            <p class="text-sm text-slate-300 leading-relaxed">${esc(q.correctFull||q.answer)}</p>
        </div>
        ${q.explanation?`<p class="text-[11px] text-slate-500 mt-2 italic leading-relaxed">${esc(q.explanation)}</p>`:''}
    </div>
    <button onclick="S.qi++;${S.mode==='connect'?'renderConnectGame()':'renderGame()'}" class="w-full bg-violet-600 hover:bg-violet-500 text-white py-3 rounded-xl font-bold text-sm mt-3 transition-colors active:scale-95">
        ${S.qi+1>=S.total?'<i class="fas fa-flag-checkered mr-2"></i>Ergebnis':'<i class="fas fa-arrow-right mr-2"></i>Weiter'}
    </button>`;

    if(!correct&&wrap) wrap.classList.add('shake');
}

// ═══════════════════════════════════════════════════════════════
//  RESULTS SCREEN
// ═══════════════════════════════════════════════════════════════
function renderResults() {
    clearInterval(S.sprintTimer);
    const pct=S.total>0?Math.round((S.score/S.total)*100):0;
    const modM=getModuleMastery(S.module?.id||1);
    const rank=getRank(modM);

    const ts={};
    S.answers.forEach(a=>{
        if(!ts[a.topic])ts[a.topic]={c:0,t:0,xp:0};
        ts[a.topic].t++;ts[a.topic].xp+=a.earned;
        if(a.correct)ts[a.topic].c++;
    });

    app.innerHTML=`
    <div class="enter">
        <div class="text-center mb-6 pt-4">
            <div class="text-5xl mb-3 pop">${pct>=80?'🏆':pct>=50?'💪':'📚'}</div>
            <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight">Training abgeschlossen</h1>
            <p class="text-slate-500 text-sm mt-1">Modul ${S.module?.id} · ${S.module?.name}</p>
        </div>

        <div class="grid grid-cols-3 gap-2.5 mb-5">
            <div class="glass rounded-2xl p-4 text-center">
                <div class="text-xl sm:text-2xl font-extrabold text-white t-num">${pct}%</div>
                <div class="text-[8px] text-slate-500 font-bold uppercase tracking-widest mt-0.5">${S.score}/${S.total}</div>
            </div>
            <div class="glass rounded-2xl p-4 text-center">
                <div class="text-xl sm:text-2xl font-extrabold text-violet-400 t-num">+${S.sessionXP}</div>
                <div class="text-[8px] text-slate-500 font-bold uppercase tracking-widest mt-0.5">XP</div>
            </div>
            <div class="glass rounded-2xl p-4 text-center">
                <div class="text-xl sm:text-2xl font-extrabold text-orange-400 t-num">${S.maxCombo}×</div>
                <div class="text-[8px] text-slate-500 font-bold uppercase tracking-widest mt-0.5">Combo</div>
            </div>
        </div>

        <div class="glass rounded-2xl p-5 mb-5 text-center">
            <div class="text-3xl rank-glow mb-1" style="color:${rank.color}">${rank.emoji}</div>
            <div class="text-sm font-bold" style="color:${rank.color}">${rank.label}</div>
            <div class="text-[11px] text-slate-500 mt-1">Modul ${S.module?.id} Mastery: ${modM}%</div>
            <div class="w-full bg-white/5 rounded-full h-2 mt-3 overflow-hidden max-w-[200px] mx-auto">
                <div class="h-full rounded-full" style="width:${modM}%;background:${rank.color}"></div>
            </div>
        </div>

        ${Object.keys(ts).length?`
        <div class="glass rounded-2xl p-5 mb-5">
            <h3 class="text-[9px] font-bold text-slate-500 uppercase tracking-widest mb-3">Themen-Detail</h3>
            ${Object.entries(ts).sort((a,b)=>(a[1].c/a[1].t)-(b[1].c/b[1].t)).map(([t,s])=>{
                const tp=Math.round((s.c/s.t)*100);
                const tc=tp>=70?'#22c55e':tp>=40?'#eab308':'#ef4444';
                const tm=S.mastery[`module_${S.module.id}`]?.[t]||0;
                const tr=getRank(tm);
                return`
                <div class="flex items-center gap-2 mb-2.5">
                    <span class="text-xs" style="color:${tr.color}">${tr.emoji}</span>
                    <span class="text-[11px] font-bold text-slate-400 flex-1 truncate">${t.replace(/_/g,' ')}</span>
                    <span class="text-[10px] font-bold t-num" style="color:${tc}">${s.c}/${s.t}</span>
                    <span class="text-[9px] font-bold text-slate-600 t-num w-8 text-right">${tm}%</span>
                </div>`;
            }).join('')}
        </div>`:''}

        <div class="grid grid-cols-2 gap-2.5">
            <button onclick="resetGame();startMode('${S.mode==='weakness'?'recall':S.mode}')"
                class="glass rounded-xl py-3 font-bold text-sm text-violet-400 hover:bg-violet-500/10 transition-all active:scale-95">
                <i class="fas fa-redo mr-1.5"></i>Nochmal
            </button>
            <button onclick="renderHome()" class="glass rounded-xl py-3 font-bold text-sm text-slate-400 hover:bg-white/5 transition-all active:scale-95">
                <i class="fas fa-home mr-1.5"></i>Home
            </button>
        </div>
    </div>`;
    save();
}

// ═══════════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════════
renderHome();
</script>
