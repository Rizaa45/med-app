<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLM Arena</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #070a10; }
        .glass { background:rgba(15,23,42,.5); backdrop-filter:blur(16px); border:1px solid rgba(255,255,255,.06); }
        .t-num { font-variant-numeric: tabular-nums; }
        @keyframes enter { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
        .enter { animation: enter .4s ease both; }
        @keyframes pulse-ring { 0%{box-shadow:0 0 0 0 rgba(139,92,246,.4)} 70%{box-shadow:0 0 0 10px rgba(139,92,246,0)} 100%{box-shadow:0 0 0 0 rgba(139,92,246,0)} }
        .pulse-ring { animation: pulse-ring 2s infinite; }
        @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
        .float { animation: float 3s ease-in-out infinite; }
        @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }
        .shake { animation: shake .3s ease; }
        @keyframes confetti { 0%{opacity:1;transform:translateY(0) rotate(0deg)} 100%{opacity:0;transform:translateY(-60px) rotate(360deg)} }
        .xp-float { animation: confetti .8s ease-out forwards; position:absolute; pointer-events:none; }
        ::-webkit-scrollbar { width:5px; }
        ::-webkit-scrollbar-thumb { background:rgba(255,255,255,.08); border-radius:99px; }
        .rank-glow { text-shadow: 0 0 20px currentColor; }
    </style>
</head>
<body class="text-white min-h-screen">
<div id="app" class="max-w-3xl mx-auto px-4 sm:px-6 py-6 sm:py-10 pb-20 relative"></div>

<script>
// ═══════════════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════════════
const MODULES = [
    {id:1, name:'Kommunikation & Biografie', icon:'fa-comments', color:'#6366f1'},
    {id:2, name:'Medizinisches Kernwissen', icon:'fa-stethoscope', color:'#3b82f6'},
    {id:3, name:'Krankheitslehre', icon:'fa-viruses', color:'#06b6d4'},
    {id:4, name:'Schwangerschaft & Geburt', icon:'fa-baby', color:'#14b8a6'},
    {id:5, name:'Prä-/Postoperative Pflege', icon:'fa-suitcase-medical', color:'#10b981'},
    {id:6, name:'Notfall & Reanimation', icon:'fa-heart-pulse', color:'#ef4444'},
    {id:7, name:'Ambulante Pflege', icon:'fa-house-medical', color:'#a855f7'},
    {id:8, name:'Innere Medizin', icon:'fa-lungs', color:'#0ea5e9'},
    {id:9, name:'Neuro-Rehabilitation', icon:'fa-brain', color:'#f59e0b'},
];

const MODES = [
    {id:'recall', name:'Recall', icon:'fa-brain', color:'#f97316', desc:'Standard-Quiz mit sofortigem Feedback'},
    {id:'absorb', name:'Absorb', icon:'fa-eye', color:'#6366f1', desc:'Antwort lesen → verstecken → aus Gedächtnis schreiben'},
    {id:'sprint', name:'Sprint', icon:'fa-bolt', color:'#ef4444', desc:'30 Sekunden pro Frage — unter Zeitdruck'},
    {id:'connect', name:'Connect', icon:'fa-link', color:'#10b981', desc:'Begriffe mit Definitionen verbinden'},
    {id:'weakness', name:'Weakness Destroyer', icon:'fa-crosshairs', color:'#dc2626', desc:'Nur deine schwächsten Themen'},
];

const RANKS = [
    {min:0,  label:'Needs Training', emoji:'❌', color:'#ef4444'},
    {min:20, label:'Basics', emoji:'📕', color:'#f97316'},
    {min:40, label:'Okay', emoji:'📗', color:'#eab308'},
    {min:60, label:'Good', emoji:'⭐', color:'#22c55e'},
    {min:80, label:'Very Good', emoji:'🌟', color:'#10b981'},
    {min:95, label:'Master', emoji:'👑', color:'#f59e0b'},
];

// ═══════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════
let S = {
    screen: 'home', // home | game | results
    xp: parseInt(localStorage.getItem('arena_xp')||'0'),
    streak: 0,
    dailyStreak: parseInt(localStorage.getItem('arena_ds')||'0'),
    mastery: JSON.parse(localStorage.getItem('arena_mastery')||'{}'),
    // Game state
    module: null,
    mode: null,
    bank: [],
    questions: [],
    qi: 0,       // question index
    score: 0,
    total: 0,
    combo: 0,
    maxCombo: 0,
    sessionXP: 0,
    answers: [],  // {correct, earned, topic}
    sprintTimer: null,
    sprintLeft: 30,
    roundSize: 10,
};

const $ = id => document.getElementById(id);
const app = document.getElementById('app');

function save() {
    localStorage.setItem('arena_xp', S.xp);
    localStorage.setItem('arena_ds', S.dailyStreak);
    localStorage.setItem('arena_mastery', JSON.stringify(S.mastery));
    // Update daily streak
    const today = new Date().toISOString().slice(0,10);
    const last = localStorage.getItem('arena_last');
    if (last !== today) {
        const yesterday = new Date(Date.now()-86400000).toISOString().slice(0,10);
        S.dailyStreak = (last === yesterday) ? S.dailyStreak + 1 : 1;
        localStorage.setItem('arena_last', today);
        localStorage.setItem('arena_ds', S.dailyStreak);
    }
}

function getRank(pct) {
    for (let i = RANKS.length-1; i >= 0; i--) if (pct >= RANKS[i].min) return RANKS[i];
    return RANKS[0];
}

function getModuleMastery(moduleId) {
    const key = `module_${moduleId}`;
    const topics = S.mastery[key] || {};
    const vals = Object.values(topics);
    if (!vals.length) return 0;
    return Math.round(vals.reduce((a,b)=>a+b,0) / vals.length);
}

function getLevel() { return Math.floor(S.xp / 500) + 1; }
function getComboMultiplier() {
    return S.combo >= 10 ? 3 : S.combo >= 7 ? 2.5 : S.combo >= 5 ? 2 : S.combo >= 3 ? 1.5 : 1;
}

function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
    return a;
}

function matchKW(text, keyword) {
    if (!text || !keyword) return false;
    const u = text.toLowerCase().trim(), k = keyword.toLowerCase().trim();
    if (u.includes(k)) return true;
    if (k.length >= 4 && u.includes(k.substring(0, Math.min(k.length, 5)))) return true;
    return false;
}

// ═══════════════════════════════════════════════
//  RENDER: HOME
// ═══════════════════════════════════════════════
function renderHome() {
    const level = getLevel();
    const weaknesses = JSON.parse(localStorage.getItem('slm_exam_weaknesses')||'[]');
    const hasWeakness = weaknesses.length > 0;

    let html = `
    <div class="enter">
        <!-- Header -->
        <div class="flex items-center justify-between mb-8">
            <a href="index.html" class="text-slate-500 hover:text-violet-400 transition-colors">
                <i class="fas fa-arrow-left mr-2"></i><span class="text-sm font-bold">Dashboard</span>
            </a>
            <div class="flex items-center gap-3">
                <div class="glass rounded-xl px-3 py-1.5 flex items-center gap-2">
                    <span class="text-lg">🔥</span>
                    <span class="text-orange-400 font-extrabold t-num">${S.dailyStreak}</span>
                </div>
                <div class="glass rounded-xl px-3 py-1.5 flex items-center gap-2">
                    <span class="text-violet-400 font-extrabold t-num">${S.xp.toLocaleString()}</span>
                    <span class="text-[9px] text-slate-500 font-bold">XP</span>
                </div>
            </div>
        </div>

        <!-- Title -->
        <div class="text-center mb-8">
            <div class="text-4xl mb-2 float">🧠</div>
            <h1 class="text-2xl sm:text-3xl font-black tracking-tight">SLM Arena</h1>
            <p class="text-slate-500 text-sm mt-1">Level ${level} · Wähle ein Modul zum Trainieren</p>
        </div>

        <!-- Module Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-8">
            ${MODULES.map(m => {
                const pct = getModuleMastery(m.id);
                const rank = getRank(pct);
                return `
                <div onclick="selectModule(${m.id})" class="glass rounded-2xl p-5 cursor-pointer hover:border-white/10 transition-all group">
                    <div class="flex items-center gap-3 mb-3">
                        <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background:${m.color}20; color:${m.color}">
                            <i class="fas ${m.icon}"></i>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">Modul ${m.id}</div>
                            <div class="text-sm font-bold text-white truncate">${m.name}</div>
                        </div>
                        <div class="text-right">
                            <div class="text-lg rank-glow" style="color:${rank.color}">${rank.emoji}</div>
                            <div class="text-[9px] font-bold" style="color:${rank.color}">${rank.label}</div>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="flex-1 bg-white/5 rounded-full h-1.5 overflow-hidden">
                            <div class="h-full rounded-full transition-all" style="width:${pct}%; background:${m.color}"></div>
                        </div>
                        <span class="text-[10px] font-bold text-slate-500 t-num">${pct}%</span>
                    </div>
                </div>`;
            }).join('')}
        </div>

        ${hasWeakness ? `
        <div class="glass rounded-2xl p-5 mb-6 border-red-500/20">
            <div class="flex items-center gap-3 mb-3">
                <div class="w-10 h-10 bg-red-500/10 text-red-400 rounded-xl flex items-center justify-center pulse-ring">
                    <i class="fas fa-crosshairs"></i>
                </div>
                <div>
                    <div class="text-sm font-bold text-white">Schwächen aus Klausuren erkannt</div>
                    <div class="text-xs text-red-400">${weaknesses[weaknesses.length-1].weakTopics?.length || 0} schwache Themen</div>
                </div>
            </div>
            <button onclick="startWeaknessMode()" class="w-full bg-red-600 hover:bg-red-500 text-white py-2.5 rounded-xl font-bold text-sm transition-colors">
                <i class="fas fa-crosshairs mr-2"></i>Weakness Destroyer starten
            </button>
        </div>` : ''}
    </div>`;

    app.innerHTML = html;
}

// ═══════════════════════════════════════════════
//  SELECT MODULE → SHOW MODES
// ═══════════════════════════════════════════════
function selectModule(id) {
    S.module = MODULES.find(m => m.id === id);
    const pct = getModuleMastery(id);
    const rank = getRank(pct);

    let html = `
    <div class="enter">
        <button onclick="renderHome()" class="text-slate-500 hover:text-violet-400 text-sm font-bold mb-6 inline-flex items-center gap-2 transition-colors">
            <i class="fas fa-arrow-left"></i> Zurück
        </button>

        <div class="glass rounded-2xl p-6 mb-6">
            <div class="flex items-center gap-4 mb-4">
                <div class="w-14 h-14 rounded-2xl flex items-center justify-center text-2xl" style="background:${S.module.color}20; color:${S.module.color}">
                    <i class="fas ${S.module.icon}"></i>
                </div>
                <div>
                    <h2 class="text-xl font-extrabold">Modul ${id}: ${S.module.name}</h2>
                    <div class="flex items-center gap-2 mt-1">
                        <span class="text-lg">${rank.emoji}</span>
                        <span class="text-sm font-bold" style="color:${rank.color}">${rank.label}</span>
                        <span class="text-xs text-slate-500 t-num">(${pct}%)</span>
                    </div>
                </div>
            </div>
            <div class="bg-white/5 rounded-full h-2 overflow-hidden">
                <div class="h-full rounded-full" style="width:${pct}%; background:${S.module.color}"></div>
            </div>
        </div>

        <h3 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-3 pl-1">Trainingsmodus wählen</h3>
        <div class="space-y-3 mb-6">
            ${MODES.filter(m => m.id !== 'weakness').map(m => `
            <button onclick="startMode('${m.id}')" class="w-full glass rounded-2xl p-5 text-left hover:border-white/10 transition-all group">
                <div class="flex items-center gap-4">
                    <div class="w-11 h-11 rounded-xl flex items-center justify-center" style="background:${m.color}20; color:${m.color}">
                        <i class="fas ${m.icon} text-lg"></i>
                    </div>
                    <div class="flex-1">
                        <div class="font-bold text-white text-sm">${m.name}</div>
                        <div class="text-[11px] text-slate-500">${m.desc}</div>
                    </div>
                    <i class="fas fa-chevron-right text-slate-600 group-hover:text-white transition-colors"></i>
                </div>
            </button>`).join('')}
        </div>

        <div class="glass rounded-2xl p-5 mb-4">
            <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest block mb-2">Fragen pro Runde</label>
            <div class="flex gap-2">
                ${[5,10,15,20].map(n => `
                <button onclick="S.roundSize=${n};document.querySelectorAll('.round-btn').forEach(b=>b.className='round-btn glass rounded-lg px-4 py-2 text-sm font-bold text-slate-400 transition-all');this.className='round-btn bg-violet-600 rounded-lg px-4 py-2 text-sm font-bold text-white transition-all'"
                    class="round-btn ${S.roundSize===n?'bg-violet-600 text-white':'glass text-slate-400'} rounded-lg px-4 py-2 text-sm font-bold transition-all">${n}</button>
                `).join('')}
            </div>
        </div>
    </div>`;

    app.innerHTML = html;
}

// ═══════════════════════════════════════════════
//  START GAME
// ═══════════════════════════════════════════════
async function startMode(mode) {
    S.mode = mode;
    S.qi = 0; S.score = 0; S.total = 0; S.combo = 0; S.maxCombo = 0; S.sessionXP = 0; S.answers = [];

    app.innerHTML = `<div class="text-center py-20"><i class="fas fa-spinner fa-spin text-violet-400 text-2xl mb-4"></i><p class="text-slate-500 font-medium">Fragen laden...</p></div>`;

    try {
        const r = await fetch(`data/question-banks/module${S.module.id}_questions.json`);
        if (!r.ok) throw new Error('not found');
        S.bank = await r.json();
        const questions = S.bank.filter(q => q.q_id && !q.fallabhaengig);
        S.questions = shuffle(questions).slice(0, S.roundSize);
        S.total = S.questions.length;
        if (!S.total) throw new Error('no questions');
        renderGame();
    } catch(e) {
        app.innerHTML = `
        <div class="text-center py-20 enter">
            <div class="text-5xl mb-4">😔</div>
            <h2 class="text-xl font-bold mb-2">Keine Fragen verfügbar</h2>
            <p class="text-slate-500 text-sm mb-6">Für Modul ${S.module.id} gibt es noch keine Fragenbank.</p>
            <button onclick="renderHome()" class="bg-violet-600 hover:bg-violet-500 text-white px-6 py-3 rounded-xl font-bold text-sm transition-colors">
                <i class="fas fa-arrow-left mr-2"></i>Zurück
            </button>
        </div>`;
    }
}

async function startWeaknessMode() {
    const w = JSON.parse(localStorage.getItem('slm_exam_weaknesses')||'[]');
    if (!w.length) return renderHome();
    const latest = w[w.length-1];
    S.module = MODULES.find(m => m.id === latest.module) || MODULES[0];
    S.mode = 'weakness';
    S.qi = 0; S.score = 0; S.total = 0; S.combo = 0; S.maxCombo = 0; S.sessionXP = 0; S.answers = [];

    try {
        const r = await fetch(`data/question-banks/module${S.module.id}_questions.json`);
        S.bank = await r.json();
        let pool = S.bank.filter(q => q.q_id && !q.fallabhaengig);
        // Prioritize weak topics and wrong questions
        if (latest.weakTopics?.length) {
            const weakPool = pool.filter(q => latest.weakTopics.includes(q.topic));
            if (weakPool.length >= 5) pool = weakPool;
        }
        S.questions = shuffle(pool).slice(0, S.roundSize);
        S.total = S.questions.length;
        renderGame();
    } catch(e) { renderHome(); }
}

// ═══════════════════════════════════════════════
//  RENDER: GAME
// ═══════════════════════════════════════════════
function renderGame() {
    if (S.qi >= S.total) return renderResults();
    const q = S.questions[S.qi];
    const mult = getComboMultiplier();
    const progress = Math.round(((S.qi) / S.total) * 100);
    const modeInfo = MODES.find(m => m.id === S.mode);

    let html = `
    <div class="enter" id="game-card">
        <!-- Top bar -->
        <div class="flex items-center justify-between mb-4">
            <button onclick="renderResults()" class="text-slate-500 hover:text-red-400 text-xs font-bold transition-colors">
                <i class="fas fa-times mr-1"></i>Beenden
            </button>
            <div class="flex items-center gap-3">
                <span class="text-xs font-bold text-slate-500 t-num">${S.qi+1}/${S.total}</span>
                ${S.combo >= 3 ? `<span class="text-xs font-bold text-orange-400">🔥 ×${mult}</span>` : ''}
                <span class="text-xs font-bold text-violet-400 t-num">+${S.sessionXP} XP</span>
            </div>
        </div>

        <!-- Progress -->
        <div class="w-full bg-white/5 rounded-full h-1.5 mb-6 overflow-hidden">
            <div class="h-full rounded-full bg-violet-500 transition-all duration-300" style="width:${progress}%"></div>
        </div>

        <!-- Topic badge -->
        <div class="flex items-center gap-2 mb-3">
            <span class="text-[9px] font-bold uppercase tracking-widest px-2 py-0.5 rounded" style="background:${S.module.color}15; color:${S.module.color}">${(q.topic||'').replace(/_/g,' ')}</span>
            <span class="text-[9px] font-bold text-slate-600 uppercase tracking-widest">${modeInfo?.name || S.mode}</span>
        </div>

        <!-- Question -->
        <div class="glass rounded-2xl p-5 sm:p-6 mb-4">
            ${renderQuestion(q)}
        </div>

        <!-- Sprint timer -->
        ${S.mode === 'sprint' ? `
        <div class="flex items-center gap-2 mb-4">
            <div class="flex-1 bg-white/5 rounded-full h-2 overflow-hidden">
                <div id="sprint-bar" class="h-full rounded-full bg-red-500 transition-all" style="width:100%"></div>
            </div>
            <span id="sprint-time" class="text-xs font-bold text-red-400 t-num">30s</span>
        </div>` : ''}

        <!-- Answer area -->
        <div id="answer-area">${renderAnswerInput(q)}</div>
        <div id="feedback-area"></div>
    </div>`;

    app.innerHTML = html;

    if (S.mode === 'sprint') startSprintTimer();
    if (S.mode === 'absorb') startAbsorbMode(q);
}

function renderQuestion(q) {
    const inst = (q.instruction || q.statement || '').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    if (q.type === 'richtig_falsch') {
        const s = q.statements || [{text: q.statement}];
        return `<p class="text-sm font-medium text-slate-300 mb-3">${inst || 'Richtig oder falsch?'}</p>
            <p class="text-white font-bold text-base leading-relaxed">${s[0]?.text || q.statement}</p>`;
    }
    return `<p class="text-white font-bold text-base leading-relaxed">${inst}</p>`;
}

function renderAnswerInput(q) {
    if (S.mode === 'absorb') return ''; // handled separately

    if (q.type === 'richtig_falsch') {
        return `
        <div class="grid grid-cols-2 gap-3">
            <button onclick="checkAnswer('richtig')" class="glass rounded-xl py-4 font-bold text-sm hover:bg-green-500/10 hover:border-green-500/30 transition-all">
                <i class="fas fa-check text-green-400 mr-2"></i>Richtig
            </button>
            <button onclick="checkAnswer('falsch')" class="glass rounded-xl py-4 font-bold text-sm hover:bg-red-500/10 hover:border-red-500/30 transition-all">
                <i class="fas fa-times text-red-400 mr-2"></i>Falsch
            </button>
        </div>`;
    }

    if (q.type === 'nennen_liste' || q.type === 'ergaenzen_liste') {
        const count = q.count || q.data?.count || q.data?.missing_items?.length || 3;
        let inputs = '';
        for (let i = 0; i < Math.min(count, 4); i++) {
            inputs += `<input id="ans-${i}" type="text" class="w-full glass rounded-xl px-4 py-3 text-sm font-medium text-white placeholder-slate-600 outline-none focus:border-violet-500/50 transition-colors mb-2" placeholder="Antwort ${i+1}">`;
        }
        return inputs + `<button onclick="checkListAnswer(${count})" class="w-full bg-violet-600 hover:bg-violet-500 text-white py-3 rounded-xl font-bold text-sm mt-2 transition-colors"><i class="fas fa-check mr-2"></i>Prüfen</button>`;
    }

    // Default: text input
    return `
    <input id="ans-text" type="text" class="w-full glass rounded-xl px-4 py-3 text-sm font-medium text-white placeholder-slate-600 outline-none focus:border-violet-500/50 transition-colors mb-3" placeholder="Deine Antwort..." onkeydown="if(event.key==='Enter')checkTextAnswer()">
    <button onclick="checkTextAnswer()" class="w-full bg-violet-600 hover:bg-violet-500 text-white py-3 rounded-xl font-bold text-sm transition-colors"><i class="fas fa-check mr-2"></i>Prüfen</button>`;
}

// ═══════════════════════════════════════════════
//  ABSORB MODE
// ═══════════════════════════════════════════════
function startAbsorbMode(q) {
    const correct = getCorrectAnswer(q);
    const area = $('answer-area');
    area.innerHTML = `
    <div class="glass rounded-2xl p-5 mb-3 border-indigo-500/20">
        <div class="text-[9px] font-bold text-indigo-400 uppercase tracking-widest mb-2"><i class="fas fa-eye mr-1"></i>Merke dir die Antwort</div>
        <p class="text-white font-medium text-sm leading-relaxed">${correct}</p>
    </div>
    <div class="text-center text-xs text-slate-500 font-bold"><span id="absorb-timer">5</span>s verbleibend</div>`;

    let t = 5;
    const iv = setInterval(() => {
        t--;
        const el = $('absorb-timer');
        if (el) el.textContent = t;
        if (t <= 0) {
            clearInterval(iv);
            area.innerHTML = `
            <input id="ans-text" type="text" class="w-full glass rounded-xl px-4 py-3 text-sm font-medium text-white placeholder-slate-600 outline-none focus:border-violet-500/50 transition-colors mb-3" placeholder="Was war die Antwort?" autofocus>
            <button onclick="checkTextAnswer()" class="w-full bg-violet-600 hover:bg-violet-500 text-white py-3 rounded-xl font-bold text-sm transition-colors"><i class="fas fa-check mr-2"></i>Prüfen</button>`;
            $('ans-text')?.focus();
        }
    }, 1000);
}

// ═══════════════════════════════════════════════
//  SPRINT TIMER
// ═══════════════════════════════════════════════
function startSprintTimer() {
    S.sprintLeft = 30;
    clearInterval(S.sprintTimer);
    S.sprintTimer = setInterval(() => {
        S.sprintLeft--;
        const bar = $('sprint-bar');
        const time = $('sprint-time');
        if (bar) bar.style.width = (S.sprintLeft/30*100) + '%';
        if (time) time.textContent = S.sprintLeft + 's';
        if (S.sprintLeft <= 0) { clearInterval(S.sprintTimer); showFeedback(false, null); }
    }, 1000);
}

// ═══════════════════════════════════════════════
//  CHECK ANSWERS
// ═══════════════════════════════════════════════
function getCorrectAnswer(q) {
    if (q.type === 'richtig_falsch') {
        const s = q.statements || [{answer: q.answer}];
        return s[0]?.answer || q.answer || '';
    }
    if (q.type === 'freitext_box') return q.data?.correct_answer || q.data?.keywords?.join(', ') || '';
    if (q.type === 'nennen_liste') return (q.correct_answers || q.data?.correct_answers || []).join(', ');
    if (q.type === 'definition_plus_beispiele') return q.data?.definition_correct || '';
    if (q.type === 'zuordnung') return (q.data?.statements||[]).map(s => `${s.answer}: ${s.text}`).join('; ');
    if (q.type === 'ergaenzen_liste') return (q.data?.missing_items || []).join(', ');
    return q.explanation || q.data?.correct_answer || '';
}

function checkAnswer(val) {
    const q = S.questions[S.qi];
    const correct = (q.statements?.[0]?.answer || q.answer || '').toLowerCase();
    showFeedback(val.toLowerCase() === correct, val);
}

function checkTextAnswer() {
    const q = S.questions[S.qi];
    const text = $('ans-text')?.value?.trim() || '';
    if (!text) return;
    const keywords = q.data?.keywords || q.data?.definition_keywords || q.all_valid_answers || q.correct_answers || q.data?.correct_answers || [];
    let matched = 0;
    keywords.forEach(k => { if (matchKW(text, k)) matched++; });
    const isCorrect = keywords.length > 0 ? (matched / keywords.length) >= 0.4 : text.length > 3;
    showFeedback(isCorrect, text);
}

function checkListAnswer(count) {
    const q = S.questions[S.qi];
    const valid = q.all_valid_answers || q.data?.all_valid_answers || q.correct_answers || q.data?.correct_answers || q.data?.all_valid_missing || q.data?.missing_items || [];
    let matched = 0;
    for (let i = 0; i < count; i++) {
        const val = $(`ans-${i}`)?.value?.trim() || '';
        if (val && valid.some(v => matchKW(val, v))) matched++;
    }
    showFeedback(matched >= Math.ceil(count * 0.4), `${matched}/${count}`);
}

// ═══════════════════════════════════════════════
//  FEEDBACK
// ═══════════════════════════════════════════════
function showFeedback(correct, userAnswer) {
    clearInterval(S.sprintTimer);
    const q = S.questions[S.qi];
    const correctAnswer = getCorrectAnswer(q);
    const topic = q.topic || 'sonstige';

    // Update combo
    if (correct) { S.combo++; S.score++; } else { S.combo = 0; }
    S.maxCombo = Math.max(S.maxCombo, S.combo);

    // Calculate XP
    const baseXP = correct ? (q.difficulty === 3 ? 30 : q.difficulty === 2 ? 20 : 15) : 2;
    const mult = getComboMultiplier();
    const earned = Math.round(baseXP * mult);
    S.xp += earned;
    S.sessionXP += earned;

    // Update mastery (exponential moving average)
    const mKey = `module_${S.module.id}`;
    if (!S.mastery[mKey]) S.mastery[mKey] = {};
    const old = S.mastery[mKey][topic] || 0;
    S.mastery[mKey][topic] = Math.round(old * 0.7 + (correct ? 100 : 0) * 0.3);

    S.answers.push({ correct, earned, topic });
    save();

    // Show XP float
    const card = $('game-card');
    if (card && correct) {
        const float = document.createElement('div');
        float.className = 'xp-float text-violet-400 font-extrabold text-lg';
        float.textContent = `+${earned} XP`;
        float.style.right = '20px'; float.style.top = '20px';
        card.appendChild(float);
    }

    const fb = $('feedback-area');
    const ansArea = $('answer-area');
    if (ansArea) ansArea.style.display = 'none';

    fb.innerHTML = `
    <div class="glass rounded-2xl p-5 mb-3 ${correct ? 'border-green-500/20' : 'border-red-500/20'} enter">
        <div class="flex items-center gap-3 mb-3">
            <div class="w-10 h-10 rounded-xl flex items-center justify-center ${correct ? 'bg-green-500/10 text-green-400' : 'bg-red-500/10 text-red-400'}">
                <i class="fas ${correct ? 'fa-check' : 'fa-times'} text-lg"></i>
            </div>
            <div>
                <div class="font-bold text-sm ${correct ? 'text-green-400' : 'text-red-400'}">${correct ? 'Richtig!' : 'Falsch'}</div>
                <div class="text-xs text-slate-500">+${earned} XP${S.combo >= 3 ? ` (×${mult} Combo)` : ''}</div>
            </div>
        </div>
        <div class="bg-white/5 rounded-lg p-3">
            <div class="text-[9px] font-bold text-slate-500 uppercase tracking-widest mb-1">Richtige Antwort</div>
            <p class="text-sm text-slate-300 leading-relaxed">${correctAnswer}</p>
        </div>
        ${q.explanation ? `<p class="text-xs text-slate-500 mt-2 italic">${q.explanation}</p>` : ''}
    </div>
    <button onclick="S.qi++;renderGame()" class="w-full bg-violet-600 hover:bg-violet-500 text-white py-3 rounded-xl font-bold text-sm transition-colors">
        ${S.qi + 1 >= S.total ? '<i class="fas fa-flag-checkered mr-2"></i>Ergebnis' : '<i class="fas fa-arrow-right mr-2"></i>Weiter'}
    </button>`;

    if (!correct) $('game-card')?.classList.add('shake');
}

// ═══════════════════════════════════════════════
//  RENDER: RESULTS
// ═══════════════════════════════════════════════
function renderResults() {
    clearInterval(S.sprintTimer);
    const pct = S.total > 0 ? Math.round((S.score / S.total) * 100) : 0;
    const moduleMastery = getModuleMastery(S.module?.id || 1);
    const rank = getRank(moduleMastery);
    const modeInfo = MODES.find(m => m.id === S.mode);

    // Topic breakdown
    const topicStats = {};
    S.answers.forEach(a => {
        if (!topicStats[a.topic]) topicStats[a.topic] = {correct:0, total:0};
        topicStats[a.topic].total++;
        if (a.correct) topicStats[a.topic].correct++;
    });

    let html = `
    <div class="enter">
        <div class="text-center mb-8 pt-4">
            <div class="text-5xl mb-3">${pct >= 80 ? '🏆' : pct >= 50 ? '💪' : '📚'}</div>
            <h1 class="text-2xl font-extrabold tracking-tight">Training abgeschlossen</h1>
            <p class="text-slate-500 text-sm mt-1">${modeInfo?.name || ''} · Modul ${S.module?.id}</p>
        </div>

        <div class="grid grid-cols-3 gap-3 mb-6">
            <div class="glass rounded-2xl p-4 text-center">
                <div class="text-2xl font-extrabold text-white t-num">${pct}%</div>
                <div class="text-[9px] text-slate-500 font-bold uppercase tracking-widest mt-1">${S.score}/${S.total}</div>
            </div>
            <div class="glass rounded-2xl p-4 text-center">
                <div class="text-2xl font-extrabold text-violet-400 t-num">+${S.sessionXP}</div>
                <div class="text-[9px] text-slate-500 font-bold uppercase tracking-widest mt-1">XP</div>
            </div>
            <div class="glass rounded-2xl p-4 text-center">
                <div class="text-2xl font-extrabold text-orange-400 t-num">${S.maxCombo}×</div>
                <div class="text-[9px] text-slate-500 font-bold uppercase tracking-widest mt-1">Max Combo</div>
            </div>
        </div>

        <!-- Mastery rank -->
        <div class="glass rounded-2xl p-5 mb-6 text-center">
            <div class="text-3xl rank-glow mb-1" style="color:${rank.color}">${rank.emoji}</div>
            <div class="text-sm font-bold" style="color:${rank.color}">${rank.label}</div>
            <div class="text-xs text-slate-500 mt-1">Modul ${S.module?.id} Mastery: ${moduleMastery}%</div>
            <div class="w-full bg-white/5 rounded-full h-2 mt-3 overflow-hidden max-w-xs mx-auto">
                <div class="h-full rounded-full" style="width:${moduleMastery}%; background:${rank.color}"></div>
            </div>
        </div>

        <!-- Topic breakdown -->
        ${Object.keys(topicStats).length ? `
        <div class="glass rounded-2xl p-5 mb-6">
            <h3 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-3">Themen-Detail</h3>
            ${Object.entries(topicStats).map(([t, s]) => {
                const tp = Math.round((s.correct/s.total)*100);
                const tc = tp >= 70 ? '#22c55e' : tp >= 40 ? '#eab308' : '#ef4444';
                return `<div class="flex items-center gap-3 mb-2">
                    <span class="text-xs font-bold text-slate-400 flex-1 truncate">${t.replace(/_/g,' ')}</span>
                    <span class="text-xs font-bold t-num" style="color:${tc}">${s.correct}/${s.total}</span>
                </div>`;
            }).join('')}
        </div>` : ''}

        <div class="grid grid-cols-2 gap-3">
            <button onclick="S.qi=0;S.score=0;S.combo=0;S.maxCombo=0;S.sessionXP=0;S.answers=[];S.questions=shuffle(S.questions);renderGame()" class="glass rounded-xl py-3 font-bold text-sm text-violet-400 hover:bg-violet-500/10 transition-all">
                <i class="fas fa-redo mr-2"></i>Nochmal
            </button>
            <button onclick="renderHome()" class="glass rounded-xl py-3 font-bold text-sm text-slate-400 hover:bg-white/5 transition-all">
                <i class="fas fa-home mr-2"></i>Home
            </button>
        </div>
    </div>`;

    app.innerHTML = html;
    save();
}
