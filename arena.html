const MOD9_SUFFIXES = {1:'.json', 2:'.json.', 3:'.json.', 4:'.json.', 5:'.json.', 6:'.json.'};

const MODES = [
    {id:'learn',   name:'Learn & Quiz',      icon:'fa-book-open',  color:'#8b5cf6',desc:'Zusammenfassung lesen → dann Quiz'},
    {id:'recall',  name:'Recall',            icon:'fa-brain',      color:'#f97316',desc:'Standard-Quiz mit Feedback'},
    {id:'absorb',  name:'Absorb',            icon:'fa-eye',        color:'#6366f1',desc:'Antwort merken → wiedergeben'},
    {id:'sprint',  name:'Sprint',            icon:'fa-bolt',       color:'#ef4444',desc:'30 Sekunden pro Frage'},
    {id:'connect', name:'Connect',           icon:'fa-link',       color:'#10b981',desc:'Begriffe verbinden'},

];

const RANKS = [
    {min:0, label:'Needs Training',emoji:'❌',color:'#ef4444'},
    {min:20,label:'Basics',        emoji:'📕',color:'#f97316'},
    {min:40,label:'Okay',          emoji:'📗',color:'#eab308'},
    {min:60,label:'Good',          emoji:'⭐',color:'#22c55e'},
    {min:80,label:'Very Good',     emoji:'🌟',color:'#10b981'},

//  STATE

let S = {
    xp:parseInt(localStorage.getItem('arena_xp')||'0'),
    dailyStreak:parseInt(localStorage.getItem('arena_ds')||'0'),
    mastery:JSON.parse(localStorage.getItem('arena_mastery')||'{}'),
    module:null, mode:null, rawBank:[], normalizedQuestions:[],

    combo:0, maxCombo:0, sessionXP:0, answers:[],
    sprintTimer:null, sprintLeft:30, roundSize:10,

// ═══════════════════════════════════════════════════════════════
//  NORMALIZER
// ═══════════════════════════════════════════════════════════════
const N={
    clean(t){return(t||'').replace(/\*\*(.*?)\*\*/g,'$1').trim()},

    normalize(q){
        const b={id:q.q_id,topic:q.topic||'allgemein',difficulty:q.difficulty||1,explanation:q.explanation||q.source_hint||'',raw:q};
        try{
            switch(q.type){
                case'richtig_falsch':return this.nRF(q,b);
                case'nennen_liste':return this.nList(q,b);
                case'freitext_box':return this.nText(q,b);
                case'tabelle_2spalten':case'tabelle_3spalten':case'tabelle_vergleich':return this.nTab(q,b);
                case'zuordnung':return this.nZu(q,b);
                case'ergaenzen_liste':return this.nErg(q,b);
                case'definition_plus_beispiele':return this.nDef(q,b);
                case'ankreuzen_begruenden':return this.nAnk(q,b);
                default:return this.nFB(q,b);
            }
        }catch(e){return null}
    },

    nRF(q,b){
        const st=q.statements||q.data?.statements||[];
        if(st.length){const s=st[Math.floor(Math.random()*st.length)];return{...b,type:'tf',display:s.text||'?',answer:s.answer||'richtig',keywords:[s.answer||'richtig'],correctFull:`${s.answer}: ${s.text}`}}
        return{...b,type:'tf',display:q.statement||'?',answer:q.answer||'richtig',keywords:[q.answer||'richtig'],correctFull:`${q.answer}: ${q.statement}`}
    },

    nList(q,b){
        const c=q.correct_answers||q.data?.correct_answers||[];
        const a=q.all_valid_answers||q.data?.all_valid_answers||c;
        const n=q.count||q.data?.count||c.length||3;
        return{...b,type:'list',display:this.clean(q.instruction)||'Nennen Sie.',answer:c.join(', '),keywords:a.length?a:c,count:Math.min(n,6),correctFull:c.join(' · ')}
    },

    nText(q,b){
        const d=q.data||{};const kw=d.keywords||[];const ca=d.correct_answer||kw.join(', ');
        return{...b,type:'text',display:this.clean(q.instruction)||'Erläutern Sie.',answer:ca,keywords:kw,correctFull:ca}
    },

    nTab(q,b){
        const t=q.data?.table;const pairs=[];const kw=[];
        if(t?.rows)t.rows.forEach(r=>{let l='';r.cells.forEach(c=>{if(c.type==='text'||c.type==='static')l=c.content||c.value||'';else if(c.type==='input'||c.type==='textarea'){const a=c.correct_answer||'';if(a){kw.push(a);if(l)pairs.push({left:l,right:a})}kw.push(...(c.keywords||[]))}})});
        const cf=pairs.map(p=>`${p.left}: ${p.right}`).join(' · ')||kw.join(', ');
        return{...b,type:pairs.length>=3?'connect':'text',display:this.clean(q.instruction)||'Füllen Sie aus.',answer:cf,keywords:kw,pairs,correctFull:cf}
    },

    nZu(q,b){
        const d=q.data||{};const lg=d.legend||{};const st=d.statements||[];
        const pairs=st.map(s=>({left:(s.text||'').length>55?s.text.substring(0,52)+'...':s.text,right:`${s.answer}: ${lg[s.answer]||s.answer}`}));
        return{...b,type:pairs.length>=3?'connect':'text',display:this.clean(q.instruction)||'Ordnen Sie zu.',answer:st.map(s=>`${s.text}→${s.answer}`).join('; '),keywords:Object.values(lg),pairs,correctFull:st.map(s=>`${lg[s.answer]||s.answer}: ${s.text}`).join(' · ')}
    },

    nErg(q,b){
        const d=q.data||{};const m=d.missing_items||[];const a=d.all_valid_missing||m;
        return{...b,type:'list',display:this.clean(q.instruction)||'Ergänzen Sie.',answer:m.join(', '),keywords:a.length?a:m,count:m.length||3,correctFull:m.join(' · '),givenItems:d.given_items||[]}
    },

    nDef(q,b){
        const d=q.data||{};const dc=d.definition_correct||'';const dk=d.definition_keywords||[];
        const ex=d.correct_examples||d.all_valid_examples||[];const ak=[...dk,...ex];
        const cf=dc+(ex.length?' | Beispiele: '+ex.join(', '):'');
        return{...b,type:'text',display:this.clean(q.instruction)||'Definieren Sie.',answer:cf,keywords:ak.length?ak:[dc],correctFull:cf}
    },

    nAnk(q,b){
        const opts=q.data?.options||[];const co=opts.filter(o=>o.correct).map(o=>o.label);
        if(co.length){const p=co[Math.floor(Math.random()*co.length)];return{...b,type:'tf',display:p,answer:'richtig',keywords:['richtig'],correctFull:'Korrekt: '+co.join(', ')}}
        return this.nFB(q,b)
    },

    nFB(q,b){
        return{...b,type:'text',display:this.clean(q.instruction||q.statement||'')||'Frage',answer:q.explanation||'',keywords:[],correctFull:q.explanation||'Siehe Lernmaterial'}
    },

    prepare(raw,count,mode){
        const out=[];const seen=new Set();
        for(const q of shuffle(raw)){
            if(!q.q_id||q.fallabhaengig)continue;
            const n=this.normalize(q);if(!n||!n.display||n.display.length<5)continue;
            const k=n.display.substring(0,40).toLowerCase();if(seen.has(k))continue;seen.add(k);
            if(mode==='connect'&&(n.type!=='connect'||!n.pairs||n.pairs.length<3))continue;
            if(!n.answer&&!n.correctFull&&(!n.keywords||!n.keywords.length))continue;
            out.push(n);
        }
        return out.slice(0,count)
    },

    prepareForTopics(raw,count,topics){
        const f=raw.filter(q=>topics.some(t=>q.topic&&q.topic.toLowerCase().includes(t.toLowerCase())));
        if(f.length>=5)return this.prepare(f,count,'recall');
        return this.prepare(raw,count,'recall')
    }
};

// ═══════════════════════════════════════════════════════════════
//  UTILITIES
// ═══════════════════════════════════════════════════════════════
function save(){
    localStorage.setItem('arena_xp',S.xp);localStorage.setItem('arena_ds',S.dailyStreak);
    localStorage.setItem('arena_mastery',JSON.stringify(S.mastery));
    const today=new Date().toISOString().slice(0,10);const last=localStorage.getItem('arena_last');
    if(last!==today){const y=new Date(Date.now()-864e5).toISOString().slice(0,10);S.dailyStreak=(last===y)?S.dailyStreak+1:1;localStorage.setItem('arena_last',today);localStorage.setItem('arena_ds',S.dailyStreak)}
}
function getRank(p){for(let i=RANKS.length-1;i>=0;i--)if(p>=RANKS[i].min)return RANKS[i];return RANKS[0]}
function getModM(mid){const t=S.mastery[`module_${mid}`]||{};const v=Object.values(t);return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):0}
function getLevel(){return Math.floor(S.xp/500)+1}
function getCM(){return S.combo>=10?3:S.combo>=7?2.5:S.combo>=5?2:S.combo>=3?1.5:1}
function shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r}
function matchKW(t,k){if(!t||!k)return false;const u=t.toLowerCase().trim(),w=k.toLowerCase().trim();if(u.includes(w))return true;if(w.length>=4&&u.includes(w.substring(0,Math.min(w.length,5))))return true;return false}
function esc(s){return(s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function resetGame(){S.qi=0;S.score=0;S.total=0;S.combo=0;S.maxCombo=0;S.sessionXP=0;S.answers=[];S.summaries=[];S.learnTopics=[];S.learnSummaryIdx=0;clearInterval(S.sprintTimer)}
function updateM(topic,correct){const mk=`module_${S.module.id}`;if(!S.mastery[mk])S.mastery[mk]={};const o=S.mastery[mk][topic]||0;S.mastery[mk][topic]=Math.round(o*.7+(correct?100:0)*.3)}

// ═══════════════════════════════════════════════════════════════
//  LOAD SUMMARIES — handles all modules including quirky filenames
// ═══════════════════════════════════════════════════════════════
async function loadSummaries(){
    S.summaries=[];
    const mod=S.module;
    const units=mod.units||[];
    if(!units.length)return 0;

    const fetches=units.map(u=>{
        // Build file paths — try multiple variants for robustness
        const paths=[
            `data/module${mod.id}summariesunit${u}.json`,
        ];
        // Module 9 units 2-6 have trailing dot in filename
        if(mod.id===9&&u>=2){
            paths.unshift(`data/module${mod.id}summariesunit${u}.json.`);
        }

        return tryFetchMultiple(paths);
    });

    const results=await Promise.all(fetches);

    results.forEach((data,idx)=>{
        if(!data)return;
        const arr=Array.isArray(data)?data:[data];
        arr.forEach(item=>{
            if(item&&(item.topic||item.content)){
                S.summaries.push({
                    topic:item.topic||`Thema ${units[idx]}`,
                    content:item.content||'',
                    tags:item.tags||[],
                    unit:units[idx]
                });
            }
        });
    });

    return S.summaries.length;
}

async function tryFetchMultiple(paths){
    for(const path of paths){
        try{
            const r=await fetch(path);
            if(r.ok){
                const text=await r.text();
                try{return JSON.parse(text)}catch(e){/* bad json */}
            }
        }catch(e){/* network error */}
    }
    return null;
}

// ═══════════════════════════════════════════════════════════════
//  LOAD QUESTION BANK
// ═══════════════════════════════════════════════════════════════
async function loadBank(){
    const r=await fetch(`data/question-banks/module${S.module.id}_questions.json`);
    if(!r.ok)throw new Error(`Fragenbank Modul ${S.module.id} nicht gefunden`);
    S.rawBank=await r.json();
    if(!S.rawBank.length)throw new Error('Fragenbank ist leer');
}

                <div class="glass rounded-lg px-2.5 py-1.5 text-xs font-bold text-indigo-400">Lv.${level}</div>
            </div>
        </div>
        <div class="text-center mb-8">

            <h1 class="text-2xl sm:text-3xl font-black tracking-tight">SLM Arena</h1>
            <p class="text-slate-500 text-sm mt-1">Gesamt: <span class="font-bold" style="color:${oR.color}">${avgM}% · ${oR.label}</span></p>
        </div>
        ${hasW?`<div class="glass rounded-2xl p-4 sm:p-5 mb-6 border-red-500/20 enter" style="animation-delay:.1s"><div class="flex items-center gap-3"><div class="w-10 h-10 bg-red-500/10 text-red-400 rounded-xl flex items-center justify-center pulse-ring shrink-0"><i class="fas fa-crosshairs text-lg"></i></div><div class="flex-1 min-w-0"><div class="text-sm font-bold text-white">Klausur-Schwächen</div><div class="text-[11px] text-red-400 truncate">${(w[w.length-1].weakTopics||[]).slice(0,3).map(t=>t.replace(/_/g,' ')).join(', ')}</div></div><button onclick="startWeakness()" class="bg-red-600 hover:bg-red-500 text-white px-4 py-2 rounded-xl text-xs font-bold transition-colors shrink-0"><i class="fas fa-crosshairs mr-1"></i>Go</button></div></div>`:''}

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 mb-6">
            ${MODULES.map((m,i)=>{const p=getModM(m.id);const r=getRank(p);const hasSummaries=m.units.length>0;return`
                <div onclick="selectModule(${m.id})" class="glass rounded-2xl p-4 cursor-pointer hover:border-white/10 transition-all enter" style="animation-delay:${.05+i*.03}s">
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 rounded-xl flex items-center justify-center shrink-0" style="background:${m.color}15;color:${m.color}"><i class="fas ${m.icon} text-sm"></i></div>

                                <span class="text-[9px] font-bold t-num" style="color:${r.color}">${r.emoji}${p}%</span>

}

// ═══ MODULE SELECTED ═══
function selectModule(id){
    S.module=MODULES.find(m=>m.id===id);const p=getModM(id);const r=getRank(p);const topics=S.mastery[`module_${id}`]||{};
    const hasSummaries=S.module.units.length>0;

    app.innerHTML=`<div class="enter">
        <button onclick="renderHome()" class="text-slate-500 hover:text-violet-400 text-sm font-bold mb-5 inline-flex items-center gap-1.5 transition-colors"><i class="fas fa-arrow-left text-xs"></i>Zurück</button>
        <div class="glass rounded-2xl p-5 mb-5">
            <div class="flex items-center gap-4 mb-3">
                <div class="w-12 h-12 rounded-2xl flex items-center justify-center text-xl" style="background:${S.module.color}15;color:${S.module.color}"><i class="fas ${S.module.icon}"></i></div>

async function startMode(mode){
    S.mode=mode;resetGame();showLoading('Wird vorbereitet...');
    try{
        if(mode==='learn'){
            const count=await loadSummaries();
            if(count===0){S.mode='recall';await loadBank();S.normalizedQuestions=N.prepare(S.rawBank,S.roundSize,'recall');S.total=S.normalizedQuestions.length;if(!S.total)throw new Error('Keine Fragen');renderGame();return}
            renderLearnPicker();return;
        }
        await loadBank();
        S.normalizedQuestions=N.prepare(S.rawBank,S.roundSize,mode);S.total=S.normalizedQuestions.length;
        if(!S.total)throw new Error('Keine passenden Fragen');
        if(mode==='connect')renderConnectGame();else renderGame();
    }catch(e){showError(e.message)}
}

async function startWeakness(){
    const w=JSON.parse(localStorage.getItem('slm_exam_weaknesses')||'[]');if(!w.length)return renderHome();
    const latest=w[w.length-1];S.module=MODULES.find(m=>m.id===latest.module)||MODULES[0];S.mode='weakness';resetGame();showLoading('Schwächen laden...');
    try{await loadBank();let pool=S.rawBank.filter(q=>q.q_id&&!q.fallabhaengig);
        if(latest.weakTopics?.length){const wp=pool.filter(q=>latest.weakTopics.includes(q.topic));if(wp.length>=3)pool=wp}
        S.normalizedQuestions=N.prepare(pool,S.roundSize,'recall');S.total=S.normalizedQuestions.length;if(!S.total)throw new Error('Keine schwachen Fragen');renderGame()
    }catch(e){showError(e.message)}
}

async function startLearnQuiz(){
    showLoading('Quiz wird erstellt...');
    const uniqueTopics=[...new Set(S.learnTopics)];
    if(!S.rawBank.length){try{await loadBank()}catch(e){showError(e.message);return}}
    S.normalizedQuestions=N.prepareForTopics(S.rawBank,S.roundSize,uniqueTopics);
    S.total=S.normalizedQuestions.length;
    if(!S.total){S.normalizedQuestions=N.prepare(S.rawBank,S.roundSize,'recall');S.total=S.normalizedQuestions.length}
    if(!S.total){showError('Keine Fragen verfügbar');return}
    S.mode='recall';renderGame();
}

            ${q.givenItems?.length?`<div class="mt-3 space-y-1"><div class="text-[9px] font-bold text-slate-500 uppercase tracking-widest">Gegeben:</div>${q.givenItems.map(g=>`<div class="text-xs text-slate-400 flex items-center gap-1.5"><i class="fas fa-check text-slate-600 text-[8px]"></i>${esc(g)}</div>`).join('')}</div>`:''}

function answerUI(q){
    if(q.type==='tf')return`<div class="grid grid-cols-2 gap-3"><button onclick="subTF('richtig')" class="glass rounded-xl py-4 font-bold text-sm hover:bg-green-500/10 hover:border-green-500/30 transition-all active:scale-95"><i class="fas fa-check text-green-400 mr-2"></i>Richtig</button><button onclick="subTF('falsch')" class="glass rounded-xl py-4 font-bold text-sm hover:bg-red-500/10 hover:border-red-500/30 transition-all active:scale-95"><i class="fas fa-times text-red-400 mr-2"></i>Falsch</button></div>`;
    if(q.type==='list'){const c=Math.min(q.count||3,5);let h='';for(let i=0;i<c;i++)h+=`<input id="ai-${i}" type="text" class="w-full glass rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-600 outline-none focus:border-violet-500/50 transition-colors mb-2" placeholder="${i+1}." onkeydown="if(event.key==='Enter'){const n=$('ai-${i+1}');if(n)n.focus();else subList(${c})}">`;return h+`<button onclick="subList(${c})" class="w-full bg-violet-600 hover:bg-violet-500 text-white py-3 rounded-xl font-bold text-sm mt-1 transition-colors active:scale-95"><i class="fas fa-check mr-2"></i>Prüfen</button>`}
    return`<div class="flex gap-2 mb-2"><button onclick="togglePen(false)" id="m-t" class="flex-1 glass rounded-lg py-2 text-xs font-bold text-white bg-violet-600 transition-all">⌨️ Tippen</button><button onclick="togglePen(true)" id="m-p" class="flex-1 glass rounded-lg py-2 text-xs font-bold text-slate-500 transition-all">✏️ Stift</button></div><div id="t-i"><textarea id="ai-text" class="w-full glass rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 outline-none focus:border-violet-500/50 transition-colors resize-none" rows="3" placeholder="Deine Antwort..."></textarea></div><div id="p-i" class="hidden"><div id="pc"></div></div><button onclick="subText()" class="w-full bg-violet-600 hover:bg-violet-500 text-white py-3 rounded-xl font-bold text-sm mt-2 transition-colors active:scale-95"><i class="fas fa-check mr-2"></i>Prüfen</button>`;
}

function togglePen(pen){
    const tD=$('t-i'),pD=$('p-i'),tB=$('m-t'),pB=$('m-p');if(!tD||!pD)return;
    if(pen){tD.classList.add('hidden');pD.classList.remove('hidden');tB.className='flex-1 glass rounded-lg py-2 text-xs font-bold text-slate-500 transition-all';pB.className='flex-1 glass rounded-lg py-2 text-xs font-bold text-white bg-violet-600 transition-all';const c=$('pc');if(c&&!c.hasChildNodes())c.appendChild(CanvasInput.create('arena-pen',600,150))}
    else{tD.classList.remove('hidden');pD.classList.add('hidden');tB.className='flex-1 glass rounded-lg py-2 text-xs font-bold text-white bg-violet-600 transition-all';pB.className='flex-1 glass rounded-lg py-2 text-xs font-bold text-slate-500 transition-all'}
}

function startAbsorb(q){const aa=$('aa');aa.innerHTML=`<div class="glass rounded-2xl p-5 mb-3 border-indigo-500/20"><div class="text-[9px] font-bold text-indigo-400 uppercase tracking-widest mb-2"><i class="fas fa-eye mr-1"></i>Merke dir das</div><p class="text-white font-medium text-sm leading-relaxed">${esc(q.correctFull||q.answer)}</p></div><div class="text-center text-xs text-slate-500 font-bold"><span id="at">5</span>s</div>`;let t=5;const iv=setInterval(()=>{t--;const el=$('at');if(el)el.textContent=t;if(t<=0){clearInterval(iv);aa.innerHTML=answerUI(q);$('ai-text')?.focus()}},1000)}

function startSprint(){S.sprintLeft=30;clearInterval(S.sprintTimer);S.sprintTimer=setInterval(()=>{S.sprintLeft--;const b=$('sp-bar'),t=$('sp-time');if(b)b.style.width=(S.sprintLeft/30*100)+'%';if(t)t.textContent=S.sprintLeft;if(S.sprintLeft<=5&&b)b.style.background='#ef4444';if(S.sprintLeft<=0){clearInterval(S.sprintTimer);feedback(false)}},1000)}

// ═══ CONNECT ═══
function renderConnectGame(){
    if(S.qi>=S.total)return renderResults();const q=S.normalizedQuestions[S.qi];const pairs=(q.pairs||[]).slice(0,5);if(pairs.length<2){S.qi++;return renderConnectGame()}
    S.connectPairs=pairs;S.connectSelected=null;S.connectMatched=new Set();
    const lI=shuffle(pairs.map((p,i)=>({text:p.left,idx:i})));const rI=shuffle(pairs.map((p,i)=>({text:p.right,idx:i})));const prog=Math.round((S.qi/S.total)*100);
    app.innerHTML=`<div class="enter" id="gw"><div class="flex items-center justify-between mb-3"><button onclick="renderResults()" class="text-slate-600 hover:text-red-400 text-xs font-bold"><i class="fas fa-times mr-1"></i>Ende</button><div class="flex items-center gap-2"><span class="text-[10px] font-bold text-slate-600 t-num">${S.qi+1}/${S.total}</span><span class="text-[10px] font-bold text-violet-400 t-num">+${S.sessionXP}</span></div></div>
    <div class="w-full bg-white/5 rounded-full h-1 mb-4 overflow-hidden"><div class="h-full bg-emerald-500 rounded-full" style="width:${prog}%"></div></div>
    <div class="glass rounded-2xl p-4 mb-4 border-emerald-500/15"><div class="text-[9px] font-bold text-emerald-400 uppercase tracking-widest mb-1"><i class="fas fa-link mr-1"></i>Paare verbinden</div><p class="text-sm text-white font-bold">${esc(q.display)}</p></div>
    <div class="grid grid-cols-2 gap-2.5"><div class="space-y-2">${lI.map(it=>`<div onclick="cC('l',${it.idx})" id="cl-${it.idx}" class="glass rounded-xl p-3 text-xs font-bold text-white cursor-pointer hover:border-emerald-500/30 transition-all leading-snug">${esc(it.text)}</div>`).join('')}</div><div class="space-y-2">${rI.map(it=>`<div onclick="cC('r',${it.idx})" id="cr-${it.idx}" class="glass rounded-xl p-3 text-xs font-bold text-slate-400 cursor-pointer hover:border-emerald-500/30 transition-all leading-snug">${esc(it.text)}</div>`).join('')}</div></div>
    <div id="fb" class="mt-3"></div></div>`;
}

function cC(side,idx){
    if(S.connectMatched.has(idx))return;
    if(!S.connectSelected){S.connectSelected={side,idx};const el=$(`c${side}-${idx}`);if(el)el.style.borderColor='rgba(16,185,129,.5)';return}
    const prev=S.connectSelected;S.connectSelected=null;
    if(prev.side===side){const pe=$(`c${prev.side}-${prev.idx}`);if(pe)pe.style.borderColor='';S.connectSelected={side,idx};const el=$(`c${side}-${idx}`);if(el)el.style.borderColor='rgba(16,185,129,.5)';return}
    const lI=prev.side==='l'?prev.idx:idx,rI=prev.side==='r'?prev.idx:idx;const lE=$(`cl-${lI}`),rE=$(`cr-${rI}`);
    if(lI===rI){S.connectMatched.add(lI);if(lE){lE.style.background='rgba(16,185,129,.12)';lE.style.borderColor='rgba(16,185,129,.3)';lE.style.pointerEvents='none'}if(rE){rE.style.background='rgba(16,185,129,.12)';rE.style.borderColor='rgba(16,185,129,.3)';rE.style.pointerEvents='none'}
        if(S.connectMatched.size>=S.connectPairs.length){S.score++;S.combo++;S.maxCombo=Math.max(S.maxCombo,S.combo);const e=Math.round(25*getCM());S.xp+=e;S.sessionXP+=e;S.answers.push({correct:true,earned:e,topic:S.normalizedQuestions[S.qi].topic});updateM(S.normalizedQuestions[S.qi].topic,true);save();setTimeout(()=>{S.qi++;renderConnectGame()},500)}
    }else{S.combo=0;if(lE){lE.classList.add('shake');lE.style.borderColor='rgba(239,68,68,.5)'}if(rE){rE.classList.add('shake');rE.style.borderColor='rgba(239,68,68,.5)'}const pe=$(`c${prev.side}-${prev.idx}`);if(pe)pe.style.borderColor='';setTimeout(()=>{if(lE){lE.classList.remove('shake');lE.style.borderColor=''}if(rE){rE.classList.remove('shake');rE.style.borderColor=''}},400)}
}

// ═══ SUBMISSIONS ═══
function subTF(v){clearInterval(S.sprintTimer);const q=S.normalizedQuestions[S.qi];feedback(v.toLowerCase()===(q.answer||'').toLowerCase())}
function subText(){clearInterval(S.sprintTimer);const q=S.normalizedQuestions[S.qi];const t=$('ai-text')?.value?.trim()||'';if(!t)return;const kw=q.keywords||[];if(!kw.length){feedback(t.length>5);return}let m=0;kw.forEach(k=>{if(matchKW(t,k))m++});feedback(m/kw.length>=.35)}
function subList(c){clearInterval(S.sprintTimer);const q=S.normalizedQuestions[S.qi];const kw=q.keywords||[];let m=0;const u=new Set();for(let i=0;i<c;i++){const v=$(`ai-${i}`)?.value?.trim()||'';if(!v)continue;const f=kw.find((k,ki)=>!u.has(ki)&&matchKW(v,k));if(f){m++;u.add(kw.indexOf(f))}}feedback(m>=Math.max(1,Math.ceil(c*.35)))}

// ═══ FEEDBACK ═══
function feedback(correct){
    clearInterval(S.sprintTimer);const q=S.normalizedQuestions[S.qi];
    if(correct){S.combo++;S.score++}else S.combo=0;S.maxCombo=Math.max(S.maxCombo,S.combo);
    const bXP=correct?(q.difficulty===3?30:q.difficulty===2?20:15):2;const mult=getCM();const earned=Math.round(bXP*mult);
    S.xp+=earned;S.sessionXP+=earned;S.answers.push({correct,earned,topic:q.topic});updateM(q.topic,correct);save();
    const w=$('gw');if(w&&correct){const f=document.createElement('div');f.className='float-up text-violet-400 font-extrabold text-sm';f.textContent=`+${earned} XP`;f.style.right='16px';f.style.top='16px';w.appendChild(f)}
    const aa=$('aa');if(aa){aa.style.opacity='.3';aa.style.pointerEvents='none'}
    $('fb').innerHTML=`<div class="glass rounded-2xl p-4 sm:p-5 ${correct?'border-green-500/20':'border-red-500/20'} enter mt-3">
        <div class="flex items-center gap-3 mb-3"><div class="w-9 h-9 rounded-xl flex items-center justify-center shrink-0 ${correct?'bg-green-500/10 text-green-400':'bg-red-500/10 text-red-400'} pop"><i class="fas ${correct?'fa-check':'fa-times'}"></i></div><div><div class="font-bold text-sm ${correct?'text-green-400':'text-red-400'}">${correct?'Richtig!':'Nicht ganz'}</div><div class="text-[10px] text-slate-500">+${earned} XP${S.combo>=3?` · 🔥×${mult.toFixed(1)}`:''}</div></div></div>
        <div class="bg-white/5 rounded-lg p-3"><div class="text-[9px] font-bold text-slate-500 uppercase tracking-widest mb-1">Richtige Antwort</div><p class="text-sm text-slate-300 leading-relaxed">${esc(q.correctFull||q.answer)}</p></div>
        ${q.explanation?`<p class="text-[11px] text-slate-500 mt-2 italic leading-relaxed">${esc(q.explanation)}</p>`:''}
    </div>
    <button onclick="S.qi++;${S.mode==='connect'?'renderConnectGame()':'renderGame()'}" class="w-full bg-violet-600 hover:bg-violet-500 text-white py-3 rounded-xl font-bold text-sm mt-3 transition-colors active:scale-95">
        ${S.qi+1>=S.total?'<i class="fas fa-flag-checkered mr-2"></i>Ergebnis':'<i class="fas fa-arrow-right mr-2"></i>Weiter'}
    </button>`;
    if(!correct&&w)w.classList.add('shake');
}

// ═══ RESULTS ═══
function renderResults(){
    clearInterval(S.sprintTimer);const pct=S.total>0?Math.round((S.score/S.total)*100):0;const modM=getModM(S.module?.id||1);const rank=getRank(modM);
    const ts={};S.answers.forEach(a=>{if(!ts[a.topic])ts[a.topic]={c:0,t:0,xp:0};ts[a.topic].t++;ts[a.topic].xp+=a.earned;if(a.correct)ts[a.topic].c++});
    app.innerHTML=`<div class="enter">
        <div class="text-center mb-6 pt-4"><div class="text-5xl mb-3 pop">${pct>=80?'🏆':pct>=50?'💪':'📚'}</div><h1 class="text-xl sm:text-2xl font-extrabold tracking-tight">Training abgeschlossen</h1><p class="text-slate-500 text-sm mt-1">Modul ${S.module?.id} · ${S.module?.name}</p></div>
        <div class="grid grid-cols-3 gap-2.5 mb-5">
            <div class="glass rounded-2xl p-4 text-center"><div class="text-xl sm:text-2xl font-extrabold text-white t-num">${pct}%</div><div class="text-[8px] text-slate-500 font-bold uppercase tracking-widest mt-0.5">${S.score}/${S.total}</div></div>
            <div class="glass rounded-2xl p-4 text-center"><div class="text-xl sm:text-2xl font-extrabold text-violet-400 t-num">+${S.sessionXP}</div><div class="text-[8px] text-slate-500 font-bold uppercase tracking-widest mt-0.5">XP</div></div>
            <div class="glass rounded-2xl p-4 text-center"><div class="text-xl sm:text-2xl font-extrabold text-orange-400 t-num">${S.maxCombo}×</div><div class="text-[8px] text-slate-500 font-bold uppercase tracking-widest mt-0.5">Combo</div></div>
        </div>
        <div class="glass rounded-2xl p-5 mb-5 text-center"><div class="text-3xl rank-glow mb-1" style="color:${rank.color}">${rank.emoji}</div><div class="text-sm font-bold" style="color:${rank.color}">${rank.label}</div><div class="text-[11px] text-slate-500 mt-1">Modul ${S.module?.id} Mastery: ${modM}%</div><div class="w-full bg-white/5 rounded-full h-2 mt-3 overflow-hidden max-w-[200px] mx-auto"><div class="h-full rounded-full" style="width:${modM}%;background:${rank.color}"></div></div></div>
        ${Object.keys(ts).length?`<div class="glass rounded-2xl p-5 mb-5"><h3 class="text-[9px] font-bold text-slate-500 uppercase tracking-widest mb-3">Themen-Detail</h3>${Object.entries(ts).sort((a,b)=>(a[1].c/a[1].t)-(b[1].c/b[1].t)).map(([t,s])=>{const tp=Math.round((s.c/s.t)*100);const tc=tp>=70?'#22c55e':tp>=40?'#eab308':'#ef4444';const tm=S.mastery[`module_${S.module.id}`]?.[t]||0;const tr=getRank(tm);return`<div class="flex items-center gap-2 mb-2.5"><span class="text-xs" style="color:${tr.color}">${tr.emoji}</span><span class="text-[11px] font-bold text-slate-400 flex-1 truncate">${t.replace(/_/g,' ')}</span><span class="text-[10px] font-bold t-num" style="color:${tc}">${s.c}/${s.t}</span><span class="text-[9px] font-bold text-slate-600 t-num w-8 text-right">${tm}%</span></div>`}).join('')}</div>`:''}
        <div class="grid grid-cols-2 gap-2.5">
            <button onclick="resetGame();startMode('${S.mode==='weakness'?'recall':S.mode}')" class="glass rounded-xl py-3 font-bold text-sm text-violet-400 hover:bg-violet-500/10 transition-all active:scale-95"><i class="fas fa-redo mr-1.5"></i>Nochmal</button>
            <button onclick="renderHome()" class="glass rounded-xl py-3 font-bold text-sm text-slate-400 hover:bg-white/5 transition-all active:scale-95"><i class="fas fa-home mr-1.5"></i>Home</button>
        </div>
    </div>`;save()
}

// ═══ INIT ═══
renderHome();
</script>

SLMCloud.autoLogin();
window.addEventListener('beforeunload', () => { if(SLMCloud.ready) SLMCloud.save(); });
