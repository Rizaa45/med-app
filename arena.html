<script>

// ═══════════════════════════════════════════════════════════════
//  QUESTION NORMALIZER — THE CORE INNOVATION
//  Transforms ANY question type into a uniform game-ready format
// ═══════════════════════════════════════════════════════════════
const Normalizer = {
    normalize(q) {
        // Returns: { id, topic, difficulty, display, type, answer, keywords, explanation, pairs, options }
        // type: 'tf' | 'text' | 'list' | 'connect'
        const base = {
            id: q.q_id,
            topic: q.topic || 'allgemein',
            difficulty: q.difficulty || 1,
            explanation: q.explanation || q.source_hint || '',
            raw: q,
        };

        switch(q.type) {
            case 'richtig_falsch': return this.normRF(q, base);
            case 'nennen_liste': return this.normList(q, base);
            case 'freitext_box': return this.normText(q, base);
            case 'tabelle_2spalten':
            case 'tabelle_3spalten':
            case 'tabelle_vergleich': return this.normTable(q, base);
            case 'zuordnung': return this.normZuordnung(q, base);
            case 'ergaenzen_liste': return this.normErgaenzen(q, base);
            case 'definition_plus_beispiele': return this.normDefinition(q, base);
            case 'ankreuzen_begruenden': return this.normAnkreuzen(q, base);
            default: return this.normFallback(q, base);
        }
    },

    normRF(q, base) {
        // Can be single statement or array
        const stmts = q.statements || (q.data?.statements) || [];
        if (stmts.length > 0) {
            // Pick one random statement for the game
            const s = stmts[Math.floor(Math.random() * stmts.length)];
            return {...base, type:'tf', display: s.text, answer: s.answer,
                keywords: [s.answer], correctFull: `${s.answer} — ${s.text}`};
        }
        // Single statement format
        return {...base, type:'tf', display: q.statement || 'Aussage fehlt',
            answer: q.answer || 'richtig', keywords: [q.answer || 'richtig'],
            correctFull: `${q.answer} — ${q.statement}`};
    },

    normList(q, base) {
        const correct = q.correct_answers || q.data?.correct_answers || [];
        const allValid = q.all_valid_answers || q.data?.all_valid_answers || correct;
        const count = q.count || q.data?.count || correct.length || 3;
        const inst = (q.instruction || '').replace(/\*\*(.*?)\*\*/g, '$1');
        return {...base, type:'list', display: inst || 'Nennen Sie die Antworten.',
            answer: correct.join(', '), keywords: allValid, count: Math.min(count, 6),
            correctFull: correct.join(' · ')};
    },

    normText(q, base) {
        const data = q.data || {};
        const inst = (q.instruction || '').replace(/\*\*(.*?)\*\*/g, '$1');
        const keywords = data.keywords || [];
        const correctAnswer = data.correct_answer || keywords.join(', ');
        return {...base, type:'text', display: inst || 'Erläutern Sie.',
            answer: correctAnswer, keywords: keywords,
            correctFull: correctAnswer};
    },

    normTable(q, base) {
        // Extract input cells as individual facts for Connect mode
        const table = q.data?.table;
        const inst = (q.instruction || '').replace(/\*\*(.*?)\*\*/g, '$1');
        const pairs = [];
        const keywords = [];

        if (table && table.rows) {
            table.rows.forEach(row => {
                let label = '';
                let values = [];
                row.cells.forEach((cell, ci) => {
                    if (cell.type === 'text' || cell.type === 'static') {
                        label = cell.content || cell.value || '';
                    } else if (cell.type === 'input' || cell.type === 'textarea') {
                        const ans = cell.correct_answer || '';
                        const kw = cell.keywords || [];
                        if (ans) values.push(ans);
                        keywords.push(...kw);
                        if (label && ans) pairs.push({left: label, right: ans});
                    }
                });
            });
        }

        const correctFull = pairs.map(p => `${p.left}: ${p.right}`).join(' · ') || keywords.join(', ');

        return {...base, type: pairs.length >= 2 ? 'connect' : 'text',
            display: inst || 'Füllen Sie die Tabelle aus.',
            answer: correctFull, keywords: keywords, pairs: pairs,
            correctFull: correctFull};
    },

    normZuordnung(q, base) {
        const data = q.data || {};
        const legend = data.legend || {};
        const stmts = data.statements || [];
        const inst = (q.instruction || '').replace(/\*\*(.*?)\*\*/g, '$1');

        const pairs = stmts.map(s => ({
            left: s.text.length > 60 ? s.text.substring(0, 57) + '...' : s.text,
            right: `${s.answer}: ${legend[s.answer] || s.answer}`
        }));

        return {...base, type:'connect', display: inst || 'Ordnen Sie zu.',
            answer: stmts.map(s => `${s.answer}`).join(', '),
            keywords: Object.values(legend), pairs: pairs,
            correctFull: stmts.map(s => `${s.text} → ${s.answer} (${legend[s.answer]})`).join(' · ')};
    },

    normErgaenzen(q, base) {
        const data = q.data || {};
        const missing = data.missing_items || [];
        const allValid = data.all_valid_missing || missing;
        const inst = (q.instruction || '').replace(/\*\*(.*?)\*\*/g, '$1');
        return {...base, type:'list', display: inst || 'Ergänzen Sie die fehlenden Punkte.',
            answer: missing.join(', '), keywords: allValid,
            count: missing.length, correctFull: missing.join(' · '),
            givenItems: data.given_items || []};
    },

    normDefinition(q, base) {
        const data = q.data || {};
        const inst = (q.instruction || '').replace(/\*\*(.*?)\*\*/g, '$1');
        const defCorrect = data.definition_correct || '';
        const defKW = data.definition_keywords || [];
        const examples = data.correct_examples || data.all_valid_examples || [];
        const allKW = [...defKW, ...examples];
        return {...base, type:'text', display: inst || 'Definieren Sie und nennen Sie Beispiele.',
            answer: defCorrect + (examples.length ? ' Beispiele: ' + examples.join(', ') : ''),
            keywords: allKW, correctFull: defCorrect + ' | Beispiele: ' + examples.join(', ')};
    },

    normAnkreuzen(q, base) {
        const data = q.data || {};
        const opts = data.options || [];
        const inst = (q.instruction_select || q.instruction || '').replace(/\*\*(.*?)\*\*/g, '$1');
        const correctOpts = opts.filter(o => o.correct).map(o => o.label);
        const wrongOpts = opts.filter(o => !o.correct).map(o => o.label);
        // Turn into a true/false for one random correct statement
        if (correctOpts.length > 0) {
            const pick = correctOpts[Math.floor(Math.random() * correctOpts.length)];
            return {...base, type:'tf', display: pick, answer:'richtig',
                keywords:['richtig'], correctFull: 'Richtig: ' + correctOpts.join(', ')};
        }
        return {...base, type:'text', display: inst, answer: correctOpts.join(', '),
            keywords: correctOpts, correctFull: correctOpts.join(', ')};
    },

    normFallback(q, base) {
        const inst = (q.instruction || q.statement || 'Frage').replace(/\*\*(.*?)\*\*/g, '$1');
        return {...base, type:'text', display: inst, answer: q.explanation || 'Keine Antwort verfügbar',
            keywords: [], correctFull: q.explanation || ''};
    },

    // Prepare full round: normalize + deduplicate + validate
    prepareRound(rawQuestions, count, mode) {
        const normalized = [];
        const seenDisplays = new Set();

        for (const q of rawQuestions) {
            if (!q.q_id || q.fallabhaengig) continue;
            try {
                const n = this.normalize(q);
                // Skip if display is empty or duplicate
                if (!n.display || n.display.length < 5) continue;
                const displayKey = n.display.substring(0, 50).toLowerCase();
                if (seenDisplays.has(displayKey)) continue;
                seenDisplays.add(displayKey);

                // For connect mode, only include questions with pairs
                if (mode === 'connect' && n.type !== 'connect') continue;
                // For connect mode, ensure at least 3 pairs
                if (mode === 'connect' && (!n.pairs || n.pairs.length < 3)) continue;

                // Validate answer exists
                if (!n.answer && !n.correctFull && n.keywords.length === 0) continue;

                normalized.push(n);
            } catch(e) { /* skip broken questions */ }
        }

        return shuffle(normalized).slice(0, count);
    }
};

// ═══════════════════════════════════════════════════════════════
//  UTILITY FUNCTIONS
// ═══════════════════════════════════════════════════════════════
function save() {
    localStorage.setItem('arena_xp', S.xp);
    localStorage.setItem('arena_ds', S.dailyStreak);
    localStorage.setItem('arena_mastery', JSON.stringify(S.mastery));
    const today = new Date().toISOString().slice(0,10);
    const last = localStorage.getItem('arena_last');
    if (last !== today) {
        const yesterday = new Date(Date.now()-86400000).toISOString().slice(0,10);
        S.dailyStreak = (last === yesterday) ? S.dailyStreak + 1 : 1;
        localStorage.setItem('arena_last', today);
        localStorage.setItem('arena_ds', S.dailyStreak);
    }
}

function getRank(pct) {
    for (let i = RANKS.length-1; i >= 0; i--) if (pct >= RANKS[i].min) return RANKS[i];
    return RANKS[0];
}

function getModuleMastery(mid) {
    const t = S.mastery[`module_${mid}`] || {};
    const v = Object.values(t);
    return v.length ? Math.round(v.reduce((a,b)=>a+b,0)/v.length) : 0;
}

function getLevel() { return Math.floor(S.xp / 500) + 1; }

function getComboMult() {
    return S.combo >= 10 ? 3 : S.combo >= 7 ? 2.5 : S.combo >= 5 ? 2 : S.combo >= 3 ? 1.5 : 1;
}

function shuffle(arr) {
    const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a;
}

function matchKW(text, kw) {
    if(!text||!kw)return false;
    const u=text.toLowerCase().trim(), k=kw.toLowerCase().trim();
    if(u.includes(k))return true;
    if(k.length>=4&&u.includes(k.substring(0,Math.min(k.length,5))))return true;
    return false;
}

function escHtml(s) { return (s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ═══════════════════════════════════════════════════════════════
//  SCREEN: HOME
// ═══════════════════════════════════════════════════════════════
function renderHome() {
    S.screen = 'home';
    const level = getLevel();
    const weaknesses = JSON.parse(localStorage.getItem('slm_exam_weaknesses')||'[]');
    const hasW = weaknesses.length > 0;
    const totalMastery = MODULES.reduce((sum,m)=>sum+getModuleMastery(m.id),0);
    const avgMastery = Math.round(totalMastery / MODULES.length);
    const overallRank = getRank(avgMastery);

    app.innerHTML = `
    <div class="enter">
        <!-- Nav -->
        <div class="flex items-center justify-between mb-6">
            <a href="index.html" class="text-slate-500 hover:text-violet-400 transition-colors text-sm font-bold">
                <i class="fas fa-arrow-left mr-1.5"></i>Dashboard
            </a>
            <div class="flex items-center gap-2">
                <div class="glass rounded-lg px-2.5 py-1.5 flex items-center gap-1.5 text-xs">
                    <span>🔥</span><span class="text-orange-400 font-extrabold t-num">${S.dailyStreak}</span>
                </div>
                <div class="glass rounded-lg px-2.5 py-1.5 flex items-center gap-1.5 text-xs">
                    <span class="text-violet-400 font-extrabold t-num">${S.xp.toLocaleString()}</span>
                    <span class="text-slate-600 font-bold">XP</span>
                </div>
                <div class="glass rounded-lg px-2.5 py-1.5 text-xs font-bold text-indigo-400">
                    Lv.${level}
                </div>
            </div>
        </div>

        <!-- Hero -->
        <div class="text-center mb-8">
            <div class="text-4xl mb-2 rank-glow" style="color:${overallRank.color}">${overallRank.emoji}</div>
            <h1 class="text-2xl sm:text-3xl font-black tracking-tight">SLM Arena</h1>
            <p class="text-slate-500 text-sm mt-1">Gesamt-Mastery: <span class="font-bold" style="color:${overallRank.color}">${avgMastery}%</span> · ${overallRank.label}</p>
        </div>

        ${hasW ? `
        <!-- Weakness Alert -->
        <div class="glass rounded-2xl p-4 sm:p-5 mb-6 border-red-500/20 enter" style="animation-delay:.1s">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-red-500/10 text-red-400 rounded-xl flex items-center justify-center pulse-ring shrink-0">
                    <i class="fas fa-crosshairs text-lg"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="text-sm font-bold text-white">Klausur-Schwächen erkannt</div>
                    <div class="text-[11px] text-red-400 truncate">${(weaknesses[weaknesses.length-1].weakTopics||[]).map(t=>t.replace(/_/g,' ')).join(', ')}</div>
                </div>
                <button onclick="startWeakness()" class="bg-red-600 hover:bg-red-500 text-white px-4 py-2 rounded-xl text-xs font-bold transition-colors shrink-0">
                    Zerstören
                </button>
            </div>
        </div>` : ''}

        <!-- Module Grid -->
        <h2 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-3 pl-1">Modul wählen</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 mb-6">
            ${MODULES.map((m,i) => {
                const pct = getModuleMastery(m.id);
                const rank = getRank(pct);
                return `
                <div onclick="selectModule(${m.id})" class="glass rounded-2xl p-4 cursor-pointer hover:border-white/10 transition-all enter" style="animation-delay:${.05+i*.03}s">
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 rounded-xl flex items-center justify-center shrink-0" style="background:${m.color}15;color:${m.color}">
                            <i class="fas ${m.icon} text-sm"></i>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="text-xs font-bold text-white truncate">${m.name}</div>
                            <div class="flex items-center gap-1.5 mt-1">
                                <div class="flex-1 bg-white/5 rounded-full h-1 overflow-hidden">
                                    <div class="h-full rounded-full" style="width:${pct}%;background:${m.color}"></div>
                                </div>
                                <span class="text-[9px] font-bold t-num" style="color:${rank.color}">${rank.emoji} ${pct}%</span>
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join('')}
        </div>
    </div>`;
}

// ═══════════════════════════════════════════════════════════════
//  SCREEN: MODULE SELECTED → MODE PICKER

            <i class="fas fa-arrow-left text-xs"></i>Zurück
        </button>

        <!-- Module header -->
        <div class="glass rounded-2xl p-5 mb-5">
            <div class="flex items-center gap-4 mb-3">
                <div class="w-12 h-12 rounded-2xl flex items-center justify-center text-xl" style="background:${S.module.color}15;color:${S.module.color}">
                    <i class="fas ${S.module.icon}"></i>
                </div>
                <div class="flex-1">
                    <h2 class="text-lg font-extrabold">Modul ${id}</h2>
                    <p class="text-sm text-slate-400">${S.module.name}</p>
                </div>
                <div class="text-center">
                    <div class="text-2xl rank-glow" style="color:${rank.color}">${rank.emoji}</div>
                    <div class="text-[9px] font-bold" style="color:${rank.color}">${rank.label}</div>
                </div>
            </div>
            <div class="bg-white/5 rounded-full h-2 overflow-hidden">
                <div class="h-full rounded-full transition-all" style="width:${pct}%;background:${S.module.color}"></div>
            </div>
            ${Object.keys(topics).length ? `
            <div class="mt-3 flex flex-wrap gap-1.5">
                ${Object.entries(topics).sort((a,b)=>a[1]-b[1]).slice(0,6).map(([t,v]) => {
                    const c = v >= 70 ? '#22c55e' : v >= 40 ? '#eab308' : '#ef4444';
                    return `<span class="text-[9px] font-bold px-2 py-0.5 rounded" style="background:${c}15;color:${c}">${t.replace(/_/g,' ')} ${v}%</span>`;
                }).join('')}
            </div>` : ''}
        </div>

        <!-- Mode selection -->
        <h3 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-3 pl-1">Trainingsmodus</h3>
        <div class="space-y-2.5 mb-5">
            ${MODES.filter(m=>m.id!=='weakness').map(m => `

                <div class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0" style="background:${m.color}15;color:${m.color}">
                    <i class="fas ${m.icon}"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="font-bold text-white text-sm">${m.name}</div>
                    <div class="text-[11px] text-slate-500 truncate">${m.desc}</div>
                </div>
                <i class="fas fa-chevron-right text-slate-700 group-hover:text-slate-400 transition-colors text-xs"></i>
            </button>`).join('')}
        </div>

        <!-- Round size -->
        <div class="glass rounded-2xl p-4">
            <label class="text-[9px] font-bold text-slate-500 uppercase tracking-widest block mb-2">Fragen pro Runde</label>
            <div class="flex gap-2">
                ${[5,10,15,20].map(n => `
                <button onclick="S.roundSize=${n};document.querySelectorAll('.rs').forEach(b=>{b.className='rs glass rounded-lg px-3 py-2 text-xs font-bold text-slate-500 transition-all flex-1'});this.className='rs bg-violet-600 rounded-lg px-3 py-2 text-xs font-bold text-white transition-all flex-1'"
                    class="rs ${S.roundSize===n?'bg-violet-600 text-white':'glass text-slate-500'} rounded-lg px-3 py-2 text-xs font-bold transition-all flex-1">${n}</button>
                `).join('')}
            </div>

    </div>`;
}

// ═══════════════════════════════════════════════════════════════
//  START GAME
// ═══════════════════════════════════════════════════════════════
async function startMode(mode) {
    S.mode = mode;
    resetGameState();

    app.innerHTML = `<div class="text-center py-20 enter">
        <div class="text-2xl text-violet-400 mb-3"><i class="fas fa-spinner fa-spin"></i></div>
        <p class="text-slate-500 font-medium text-sm">Fragen werden vorbereitet...</p>
    </div>`;

    try {
        const r = await fetch(`data/question-banks/module${S.module.id}_questions.json`);
        if (!r.ok) throw new Error('Bank nicht gefunden');
        S.rawBank = await r.json();

        S.normalizedQuestions = Normalizer.prepareRound(S.rawBank, S.roundSize, mode);
        S.total = S.normalizedQuestions.length;

        if (S.total === 0) throw new Error('Keine passenden Fragen');

        if (mode === 'learn') {
            await loadSummaries();
            renderLearnPhase();
        } else if (mode === 'connect') {
            renderConnectGame();
        } else {
            renderGame();
        }
    } catch(e) {
        app.innerHTML = `
        <div class="text-center py-20 enter">
            <div class="text-5xl mb-4">😔</div>
            <h2 class="text-lg font-bold mb-2">Nicht verfügbar</h2>
            <p class="text-slate-500 text-sm mb-6">${escHtml(e.message)}</p>
            <button onclick="selectModule(${S.module.id})" class="bg-violet-600 hover:bg-violet-500 text-white px-6 py-3 rounded-xl font-bold text-sm transition-colors">
                <i class="fas fa-arrow-left mr-2"></i>Zurück
            </button>
        </div>`;
    }
}

async function startWeakness() {
    const w = JSON.parse(localStorage.getItem('slm_exam_weaknesses')||'[]');
    if (!w.length) return renderHome();
    const latest = w[w.length-1];
    S.module = MODULES.find(m=>m.id===latest.module) || MODULES[0];
    S.mode = 'weakness';
    resetGameState();

    try {
        const r = await fetch(`data/question-banks/module${S.module.id}_questions.json`);
        S.rawBank = await r.json();
        let pool = S.rawBank.filter(q=>q.q_id && !q.fallabhaengig);
        if (latest.weakTopics?.length) {
            const wp = pool.filter(q=>latest.weakTopics.includes(q.topic));
            if (wp.length >= 3) pool = wp;
        }
        S.normalizedQuestions = Normalizer.prepareRound(pool, S.roundSize, 'recall');
        S.total = S.normalizedQuestions.length;
        if (!S.total) throw new Error('Keine schwachen Fragen');
        renderGame();
    } catch(e) { renderHome(); }
}

function resetGameState() {
    S.qi=0; S.score=0; S.total=0; S.combo=0; S.maxCombo=0; S.sessionXP=0; S.answers=[];
    clearInterval(S.sprintTimer);
}

// ═══════════════════════════════════════════════════════════════
//  LEARN MODE: Summary → then Quiz
// ═══════════════════════════════════════════════════════════════
async function loadSummaries() {
    S.summaries = [];
    // Try to load summary files for this module
    for (let i = 1; i <= 12; i++) {
        try {
            const r = await fetch(`data/module${S.module.id}summariesunit${i}.json`);
            if (r.ok) {
                const data = await r.json();
                if (Array.isArray(data)) {
                    data.forEach(item => {
                        if (item.topic && item.content) {
                            S.summaries.push({topic: item.topic, content: item.content, tags: item.tags || []});
                        }
                    });
                }
            }
        } catch(e) { /* skip */ }
    }
}

function renderLearnPhase() {
    S.learnPhase = true;
    S.learnSummaryIdx = 0;

    if (S.summaries.length === 0) {
        // No summaries available, skip to quiz
        S.mode = 'recall';
        renderGame();
        return;
    }

    showLearnCard();
}

function showLearnCard() {
    if (S.learnSummaryIdx >= S.summaries.length || S.learnSummaryIdx >= 3) {
        // After reading 3 summaries, start quiz
        S.learnPhase = false;
        renderGame();
        return;
    }

    const s = S.summaries[S.learnSummaryIdx];

    app.innerHTML = `
    <div class="enter">
        <div class="flex items-center justify-between mb-4">
            <button onclick="S.learnPhase=false;renderGame()" class="text-slate-500 hover:text-violet-400 text-xs font-bold transition-colors">
                <i class="fas fa-forward mr-1"></i>Quiz starten
            </button>
            <span class="text-xs font-bold text-slate-500">${S.learnSummaryIdx+1}/${Math.min(S.summaries.length, 3)} Themen</span>
        </div>

        <div class="glass rounded-2xl p-4 mb-4 border-indigo-500/20">
            <div class="flex items-center gap-2 mb-3">
                <i class="fas fa-book-open text-indigo-400"></i>
                <span class="text-xs font-bold text-indigo-400 uppercase tracking-widest">Lernphase — Lies aufmerksam</span>
            </div>
            <h3 class="text-lg font-bold text-white mb-3">${escHtml(s.topic)}</h3>
            ${s.tags.length ? `<div class="flex flex-wrap gap-1 mb-3">${s.tags.map(t=>`<span class="text-[9px] font-bold px-2 py-0.5 rounded bg-indigo-500/10 text-indigo-300">${escHtml(t)}</span>`).join('')}</div>` : ''}
            <div class="text-sm text-slate-300 leading-relaxed max-h-[50vh] overflow-y-auto pr-2 summary-content" style="scrollbar-width:thin">
                ${s.content}
            </div>
        </div>

        <button onclick="S.learnSummaryIdx++;showLearnCard()" class="w-full bg-violet-600 hover:bg-violet-500 text-white py-3 rounded-xl font-bold text-sm transition-colors">
            ${S.learnSummaryIdx + 1 >= Math.min(S.summaries.length, 3) ? '<i class="fas fa-brain mr-2"></i>Jetzt Quiz starten' : '<i class="fas fa-arrow-right mr-2"></i>Nächstes Thema'}
        </button>
    </div>`;
}

// ═══════════════════════════════════════════════════════════════
//  GAME SCREEN (Recall, Absorb, Sprint, Weakness)
// ═══════════════════════════════════════════════════════════════
function renderGame() {
    if (S.qi >= S.total) return renderResults();

    const mult = getComboMult();

    const mInfo = MODES.find(m=>m.id===S.mode);

    app.innerHTML = `
    <div class="enter" id="game-wrap">
        <!-- Top bar -->
        <div class="flex items-center justify-between mb-3">
            <button onclick="renderResults()" class="text-slate-600 hover:text-red-400 text-xs font-bold transition-colors">
                <i class="fas fa-times mr-1"></i>Ende
            </button>
            <div class="flex items-center gap-2">
                <span class="text-[10px] font-bold text-slate-600 t-num">${S.qi+1}/${S.total}</span>
                ${S.combo >= 3 ? `<span class="text-[10px] font-bold text-orange-400 pop">🔥×${mult.toFixed(1)}</span>` : ''}
                <span class="text-[10px] font-bold text-violet-400 t-num">+${S.sessionXP}</span>
            </div>
        </div>

        <!-- Progress -->
        <div class="w-full bg-white/5 rounded-full h-1 mb-5 overflow-hidden">
            <div class="h-full bg-violet-500 rounded-full transition-all duration-300" style="width:${progress}%"></div>
        </div>

        <!-- Topic + mode -->
        <div class="flex items-center gap-2 mb-3 flex-wrap">
            <span class="text-[9px] font-bold uppercase tracking-widest px-2 py-0.5 rounded" style="background:${S.module.color}12;color:${S.module.color}">${q.topic.replace(/_/g,' ')}</span>
            <span class="text-[9px] font-bold text-slate-600 uppercase tracking-widest">${mInfo?.name||S.mode}</span>
            <span class="text-[9px] font-bold text-slate-700">·  ${q.difficulty === 3 ? '⚡⚡⚡' : q.difficulty === 2 ? '⚡⚡' : '⚡'}</span>
        </div>

        <!-- Question card -->
        <div class="glass rounded-2xl p-5 sm:p-6 mb-4">
            <p class="text-white font-bold text-base sm:text-lg leading-relaxed">${escHtml(q.display)}</p>
            ${q.givenItems?.length ? `
            <div class="mt-3 space-y-1">
                <div class="text-[9px] font-bold text-slate-500 uppercase tracking-widest">Bereits gegeben:</div>
                ${q.givenItems.map(g=>`<div class="text-xs text-slate-400 flex items-center gap-1.5"><i class="fas fa-check text-slate-600 text-[8px]"></i>${escHtml(g)}</div>`).join('')}

            <div class="flex-1 bg-white/5 rounded-full h-1.5 overflow-hidden">
                <div id="sprint-bar" class="h-full rounded-full bg-red-500 transition-all" style="width:100%"></div>
            </div>
            <span id="sprint-time" class="text-[10px] font-bold text-red-400 t-num w-6 text-right">30</span>
        </div>` : ''}

        <div id="feedback-area"></div>
    </div>`;

    if (S.mode === 'sprint') startSprint();

}

function renderAnswerUI(q) {
    if (q.type === 'tf') {
        return `
        <div class="grid grid-cols-2 gap-3">
            <button onclick="submitAnswer('richtig')" class="glass rounded-xl py-4 font-bold text-sm hover:bg-green-500/10 hover:border-green-500/30 transition-all active:scale-95">
                <i class="fas fa-check text-green-400 mr-2"></i>Richtig
            </button>
            <button onclick="submitAnswer('falsch')" class="glass rounded-xl py-4 font-bold text-sm hover:bg-red-500/10 hover:border-red-500/30 transition-all active:scale-95">
                <i class="fas fa-times text-red-400 mr-2"></i>Falsch
            </button>
        </div>`;
    }

    if (q.type === 'list') {
        const c = Math.min(q.count || 3, 5);
        let inputs = '';
        for (let i = 0; i < c; i++) {
            inputs += `<input id="ai-${i}" type="text" class="w-full glass rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-600 outline-none focus:border-violet-500/50 transition-colors mb-2" placeholder="${i+1}." onkeydown="if(event.key==='Enter'){const n=$('ai-${i+1}');if(n)n.focus();else submitListAnswer(${c})}">`;
        }
        return inputs + `
        <button onclick="submitListAnswer(${c})" class="w-full bg-violet-600 hover:bg-violet-500 text-white py-3 rounded-xl font-bold text-sm mt-1 transition-colors active:scale-95">
            <i class="fas fa-check mr-2"></i>Prüfen
        </button>`;
    }

    // Default: text input with optional pen
    return `
    <div class="flex gap-2 mb-2">
        <button onclick="togglePen(false)" id="mode-type" class="flex-1 glass rounded-lg py-2 text-xs font-bold text-white bg-violet-600 transition-all">⌨️ Tippen</button>
        <button onclick="togglePen(true)" id="mode-pen" class="flex-1 glass rounded-lg py-2 text-xs font-bold text-slate-500 transition-all">✏️ Stift</button>
    </div>
    <div id="type-input">
        <textarea id="ai-text" class="w-full glass rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 outline-none focus:border-violet-500/50 transition-colors resize-none" rows="3" placeholder="Deine Antwort..."></textarea>
    </div>
    <div id="pen-input" class="hidden">
        <div id="pen-container"></div>
    </div>
    <button onclick="submitTextAnswer()" class="w-full bg-violet-600 hover:bg-violet-500 text-white py-3 rounded-xl font-bold text-sm mt-2 transition-colors active:scale-95">
        <i class="fas fa-check mr-2"></i>Prüfen
    </button>`;
}

function togglePen(penMode) {
    const typeDiv = $('type-input');
    const penDiv = $('pen-input');
    const typeBtn = $('mode-type');
    const penBtn = $('mode-pen');
    if (!typeDiv || !penDiv) return;

    if (penMode) {
        typeDiv.classList.add('hidden');
        penDiv.classList.remove('hidden');
        typeBtn.className = 'flex-1 glass rounded-lg py-2 text-xs font-bold text-slate-500 transition-all';
        penBtn.className = 'flex-1 glass rounded-lg py-2 text-xs font-bold text-white bg-violet-600 transition-all';
        const container = $('pen-container');
        if (container && !container.hasChildNodes()) {
            container.appendChild(CanvasInput.create('arena-pen', 600, 150));
        }
    } else {
        typeDiv.classList.remove('hidden');
        penDiv.classList.add('hidden');
        typeBtn.className = 'flex-1 glass rounded-lg py-2 text-xs font-bold text-white bg-violet-600 transition-all';
        penBtn.className = 'flex-1 glass rounded-lg py-2 text-xs font-bold text-slate-500 transition-all';
    }
}

// ═══════════════════════════════════════════════════════════════
//  ABSORB MODE
// ═══════════════════════════════════════════════════════════════
function startAbsorb(q) {
    const area = $('answer-area');
    area.innerHTML = `
    <div class="glass rounded-2xl p-5 mb-3 border-indigo-500/20">
        <div class="text-[9px] font-bold text-indigo-400 uppercase tracking-widest mb-2"><i class="fas fa-eye mr-1"></i>Merke dir das</div>
        <p class="text-white font-medium text-sm leading-relaxed">${escHtml(q.correctFull || q.answer)}</p>
    </div>
    <div class="text-center text-xs text-slate-500 font-bold"><span id="abs-t">5</span>s</div>`;

    let t = 5;
    const iv = setInterval(() => {
        t--;
        const el = $('abs-t');
        if (el) el.textContent = t;
        if (t <= 0) {
            clearInterval(iv);
            area.innerHTML = renderAnswerUI(q);
            $('ai-text')?.focus();
        }
    }, 1000);
}

// ═══════════════════════════════════════════════════════════════
//  SPRINT TIMER
// ═══════════════════════════════════════════════════════════════
function startSprint() {
    S.sprintLeft = 30;
    clearInterval(S.sprintTimer);
    S.sprintTimer = setInterval(() => {
        S.sprintLeft--;
        const bar = $('sprint-bar');
        const tm = $('sprint-time');
        if (bar) bar.style.width = (S.sprintLeft/30*100)+'%';
        if (tm) tm.textContent = S.sprintLeft;
        if (S.sprintLeft <= 5 && bar) bar.style.background = '#ef4444';
        if (S.sprintLeft <= 0) { clearInterval(S.sprintTimer); showFeedback(false); }
    }, 1000);
}

// ═══════════════════════════════════════════════════════════════
//  CONNECT MODE (pair matching game)
// ═══════════════════════════════════════════════════════════════
function renderConnectGame() {
    if (S.qi >= S.total) return renderResults();

    const q = S.normalizedQuestions[S.qi];
    const pairs = (q.pairs || []).slice(0, 5);
    if (pairs.length < 2) { S.qi++; return renderConnectGame(); }

    S.connectPairs = pairs;
    S.connectSelected = null;
    S.connectMatched = new Set();

    const leftItems = shuffle(pairs.map((p,i) => ({text: p.left, idx: i, side:'left'})));
    const rightItems = shuffle(pairs.map((p,i) => ({text: p.right, idx: i, side:'right'})));

    const progress = Math.round((S.qi / S.total) * 100);

    app.innerHTML = `
    <div class="enter" id="game-wrap">
        <div class="flex items-center justify-between mb-3">
            <button onclick="renderResults()" class="text-slate-600 hover:text-red-400 text-xs font-bold"><i class="fas fa-times mr-1"></i>Ende</button>
            <span class="text-[10px] font-bold text-slate-600 t-num">${S.qi+1}/${S.total}</span>
        </div>
        <div class="w-full bg-white/5 rounded-full h-1 mb-4 overflow-hidden">
            <div class="h-full bg-emerald-500 rounded-full" style="width:${progress}%"></div>
        </div>

        <div class="glass rounded-2xl p-4 mb-4 border-emerald-500/20">
            <div class="text-[9px] font-bold text-emerald-400 uppercase tracking-widest mb-1"><i class="fas fa-link mr-1"></i>Connect — Paare verbinden</div>
            <p class="text-sm text-white font-bold">${escHtml(q.display)}</p>
        </div>

        <div class="grid grid-cols-2 gap-3" id="connect-grid">
            <div class="space-y-2" id="left-col">
                ${leftItems.map(it => `
                <div onclick="connectClick('left',${it.idx})" id="cl-${it.idx}"
                     class="glass rounded-xl p-3 text-xs font-bold text-white cursor-pointer hover:border-emerald-500/30 transition-all leading-snug">
                    ${escHtml(it.text)}
                </div>`).join('')}
            </div>
            <div class="space-y-2" id="right-col">
                ${rightItems.map(it => `
                <div onclick="connectClick('right',${it.idx})" id="cr-${it.idx}"
                     class="glass rounded-xl p-3 text-xs font-bold text-slate-400 cursor-pointer hover:border-emerald-500/30 transition-all leading-snug">
                    ${escHtml(it.text)}
                </div>`).join('')}
            </div>
        </div>
        <div id="feedback-area" class="mt-4"></div>
    </div>`;
}

function connectClick(side, idx) {
    if (S.connectMatched.has(idx)) return;

    if (S.connectSelected === null) {
        S.connectSelected = {side, idx};
        const el = $(`c${side[0]}-${idx}`);
        if (el) el.style.borderColor = 'rgba(16,185,129,.5)';
    } else {
        const prev = S.connectSelected;
        S.connectSelected = null;

        // Must be different sides
        if (prev.side === side) {
            // Reset previous
            const pel = $(`c${prev.side[0]}-${prev.idx}`);
            if (pel) pel.style.borderColor = '';
            // Select new
            S.connectSelected = {side, idx};
            const el = $(`c${side[0]}-${idx}`);
            if (el) el.style.borderColor = 'rgba(16,185,129,.5)';
            return;
        }

        const leftIdx = prev.side === 'left' ? prev.idx : idx;
        const rightIdx = prev.side === 'right' ? prev.idx : idx;

        const isMatch = leftIdx === rightIdx;

        const lEl = $(`cl-${leftIdx}`);
        const rEl = $(`cr-${rightIdx}`);

        if (isMatch) {
            S.connectMatched.add(leftIdx);
            if (lEl) { lEl.style.background = 'rgba(16,185,129,.15)'; lEl.style.borderColor = 'rgba(16,185,129,.3)'; lEl.style.pointerEvents = 'none'; }
            if (rEl) { rEl.style.background = 'rgba(16,185,129,.15)'; rEl.style.borderColor = 'rgba(16,185,129,.3)'; rEl.style.pointerEvents = 'none'; }

            // Check if all matched
            if (S.connectMatched.size >= S.connectPairs.length) {
                // All correct — award XP
                S.score++;
                S.combo++;
                S.maxCombo = Math.max(S.maxCombo, S.combo);
                const earned = Math.round(25 * getComboMult());
                S.xp += earned;
                S.sessionXP += earned;
                S.answers.push({correct:true, earned, topic: S.normalizedQuestions[S.qi].topic});
                updateMastery(S.normalizedQuestions[S.qi].topic, true);
                save();

                setTimeout(() => { S.qi++; renderConnectGame(); }, 600);
            }
        } else {
            // Wrong match
            S.combo = 0;
            if (lEl) { lEl.classList.add('shake'); lEl.style.borderColor = 'rgba(239,68,68,.5)'; }
            if (rEl) { rEl.classList.add('shake'); rEl.style.borderColor = 'rgba(239,68,68,.5)'; }
            const pel = $(`c${prev.side[0]}-${prev.idx}`);
            if (pel) pel.style.borderColor = '';

            setTimeout(() => {
                if (lEl) { lEl.classList.remove('shake'); lEl.style.borderColor = ''; }
                if (rEl) { rEl.classList.remove('shake'); rEl.style.borderColor = ''; }
            }, 400);
        }
    }
}

// ═══════════════════════════════════════════════════════════════
//  ANSWER SUBMISSION
// ═══════════════════════════════════════════════════════════════
function submitAnswer(val) {
    clearInterval(S.sprintTimer);
    const q = S.normalizedQuestions[S.qi];
    const correct = val.toLowerCase() === (q.answer||'').toLowerCase();
    showFeedback(correct);
}

function submitTextAnswer() {
    clearInterval(S.sprintTimer);
    const q = S.normalizedQuestions[S.qi];
    const text = $('ai-text')?.value?.trim() || '';
    if (!text) return;

    const kw = q.keywords || [];
    if (kw.length === 0) {
        showFeedback(text.length > 5);
        return;
    }
    let matched = 0;
    kw.forEach(k => { if (matchKW(text, k)) matched++; });
    showFeedback(matched / kw.length >= 0.35);
}

function submitListAnswer(count) {
    clearInterval(S.sprintTimer);
    const q = S.normalizedQuestions[S.qi];
    const kw = q.keywords || [];
    let matched = 0;
    const used = new Set();
    for (let i = 0; i < count; i++) {
        const val = $(`ai-${i}`)?.value?.trim() || '';
        if (!val) continue;
        const m = kw.find((k,ki) => !used.has(ki) && matchKW(val, k));
        if (m) { matched++; used.add(kw.indexOf(m)); }
    }
    showFeedback(matched >= Math.max(1, Math.ceil(count * 0.35)));
}

// ═══════════════════════════════════════════════════════════════
//  FEEDBACK
// ═══════════════════════════════════════════════════════════════
function updateMastery(topic, correct) {
    const mKey = `module_${S.module.id}`;
    if (!S.mastery[mKey]) S.mastery[mKey] = {};
    const old = S.mastery[mKey][topic] || 0;
    S.mastery[mKey][topic] = Math.round(old * 0.7 + (correct ? 100 : 0) * 0.3);
}

function showFeedback(correct) {
    const q = S.normalizedQuestions[S.qi];

    if (correct) { S.combo++; S.score++; } else { S.combo = 0; }
    S.maxCombo = Math.max(S.maxCombo, S.combo);

    const baseXP = correct ? (q.difficulty === 3 ? 30 : q.difficulty === 2 ? 20 : 15) : 2;
    const mult = getComboMult();
    const earned = Math.round(baseXP * mult);
    S.xp += earned;
    S.sessionXP += earned;
    S.answers.push({correct, earned, topic: q.topic});
    updateMastery(q.topic, correct);
    save();

    // Float XP
    const wrap = $('game-wrap');
    if (wrap && correct) {
        const fl = document.createElement('div');
        fl.className = 'float-up text-violet-400 font-extrabold text-sm';
        fl.textContent = `+${earned} XP`;
        fl.style.right = '16px'; fl.style.top = '16px';
        wrap.appendChild(fl);
    }

    // Disable answer area
    const aa = $('answer-area');
    if (aa) aa.style.opacity = '.3'; aa.style.pointerEvents = 'none';

    const fb = $('feedback-area');
    fb.innerHTML = `
    <div class="glass rounded-2xl p-4 sm:p-5 ${correct ? 'border-green-500/20' : 'border-red-500/20'} enter mt-4">
        <div class="flex items-center gap-3 mb-3">
            <div class="w-9 h-9 rounded-xl flex items-center justify-center shrink-0 ${correct ? 'bg-green-500/10 text-green-400' : 'bg-red-500/10 text-red-400'} pop">
                <i class="fas ${correct ? 'fa-check' : 'fa-times'}"></i>
            </div>
            <div>
                <div class="font-bold text-sm ${correct ? 'text-green-400' : 'text-red-400'}">${correct ? 'Richtig!' : 'Nicht ganz'}</div>
                <div class="text-[10px] text-slate-500">+${earned} XP${S.combo >= 3 ? ` · 🔥×${mult.toFixed(1)}` : ''}</div>
            </div>
        </div>
        <div class="bg-white/5 rounded-lg p-3">
            <div class="text-[9px] font-bold text-slate-500 uppercase tracking-widest mb-1">Richtige Antwort</div>
            <p class="text-sm text-slate-300 leading-relaxed">${escHtml(q.correctFull || q.answer)}</p>
        </div>
        ${q.explanation ? `<p class="text-[11px] text-slate-500 mt-2 italic leading-relaxed">${escHtml(q.explanation)}</p>` : ''}
    </div>
    <button onclick="S.qi++;${S.mode==='connect'?'renderConnectGame()':'renderGame()'}" class="w-full bg-violet-600 hover:bg-violet-500 text-white py-3 rounded-xl font-bold text-sm mt-3 transition-colors active:scale-95">
        ${S.qi + 1 >= S.total ? '<i class="fas fa-flag-checkered mr-2"></i>Ergebnis' : '<i class="fas fa-arrow-right mr-2"></i>Weiter'}
    </button>`;

    if (!correct && wrap) wrap.classList.add('shake');
}

// ═══════════════════════════════════════════════════════════════
//  RESULTS SCREEN
// ═══════════════════════════════════════════════════════════════
function renderResults() {
    clearInterval(S.sprintTimer);
    const pct = S.total > 0 ? Math.round((S.score / S.total) * 100) : 0;
    const modM = getModuleMastery(S.module?.id || 1);
    const rank = getRank(modM);
    const mInfo = MODES.find(m=>m.id===S.mode);

    // Topic breakdown
    const ts = {};
    S.answers.forEach(a => {
        if (!ts[a.topic]) ts[a.topic] = {c:0, t:0, xp:0};
        ts[a.topic].t++;
        ts[a.topic].xp += a.earned;
        if (a.correct) ts[a.topic].c++;
    });

    app.innerHTML = `
    <div class="enter">
        <div class="text-center mb-6 pt-4">
            <div class="text-5xl mb-3 pop">${pct >= 80 ? '🏆' : pct >= 50 ? '💪' : '📚'}</div>
            <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight">Training abgeschlossen</h1>
            <p class="text-slate-500 text-sm mt-1">${mInfo?.name||''} · Modul ${S.module?.id}</p>
        </div>

        <!-- Score cards -->
        <div class="grid grid-cols-3 gap-2.5 mb-5">
            <div class="glass rounded-2xl p-4 text-center">
                <div class="text-xl sm:text-2xl font-extrabold text-white t-num">${pct}%</div>
                <div class="text-[8px] text-slate-500 font-bold uppercase tracking-widest mt-0.5">${S.score}/${S.total}</div>
            </div>
            <div class="glass rounded-2xl p-4 text-center">
                <div class="text-xl sm:text-2xl font-extrabold text-violet-400 t-num">+${S.sessionXP}</div>
                <div class="text-[8px] text-slate-500 font-bold uppercase tracking-widest mt-0.5">XP</div>
            </div>
            <div class="glass rounded-2xl p-4 text-center">
                <div class="text-xl sm:text-2xl font-extrabold text-orange-400 t-num">${S.maxCombo}×</div>
                <div class="text-[8px] text-slate-500 font-bold uppercase tracking-widest mt-0.5">Combo</div>
            </div>
        </div>

        <!-- Rank display -->
        <div class="glass rounded-2xl p-5 mb-5 text-center">
            <div class="text-3xl rank-glow mb-1" style="color:${rank.color}">${rank.emoji}</div>
            <div class="text-sm font-bold" style="color:${rank.color}">${rank.label}</div>
            <div class="text-[11px] text-slate-500 mt-1">Modul ${S.module?.id} Mastery: ${modM}%</div>
            <div class="w-full bg-white/5 rounded-full h-2 mt-3 overflow-hidden max-w-[200px] mx-auto">
                <div class="h-full rounded-full transition-all" style="width:${modM}%;background:${rank.color}"></div>
            </div>
        </div>

        <!-- Topic breakdown -->
        ${Object.keys(ts).length ? `
        <div class="glass rounded-2xl p-5 mb-5">
            <h3 class="text-[9px] font-bold text-slate-500 uppercase tracking-widest mb-3">Themen-Detail</h3>
            ${Object.entries(ts).sort((a,b)=>(a[1].c/a[1].t)-(b[1].c/b[1].t)).map(([t,s]) => {
                const tp = Math.round((s.c/s.t)*100);
                const tc = tp >= 70 ? '#22c55e' : tp >= 40 ? '#eab308' : '#ef4444';
                const topicMastery = S.mastery[`module_${S.module.id}`]?.[t] || 0;
                const tr = getRank(topicMastery);
                return `
                <div class="flex items-center gap-2 mb-2">
                    <span class="text-xs rank-glow" style="color:${tr.color}">${tr.emoji}</span>
                    <span class="text-[11px] font-bold text-slate-400 flex-1 truncate">${t.replace(/_/g,' ')}</span>
                    <span class="text-[10px] font-bold t-num" style="color:${tc}">${s.c}/${s.t}</span>
                    <span class="text-[9px] font-bold text-slate-600 t-num w-8 text-right">${topicMastery}%</span>
                </div>`;
            }).join('')}
        </div>` : ''}

        <!-- Actions -->
        <div class="grid grid-cols-2 gap-2.5">
            <button onclick="resetGameState();S.normalizedQuestions=Normalizer.prepareRound(S.rawBank,S.roundSize,S.mode==='connect'?'connect':'recall');S.total=S.normalizedQuestions.length;${S.mode==='connect'?'renderConnectGame()':'renderGame()'}"
                class="glass rounded-xl py-3 font-bold text-sm text-violet-400 hover:bg-violet-500/10 transition-all active:scale-95">
                <i class="fas fa-redo mr-1.5"></i>Nochmal
            </button>
            <button onclick="renderHome()" class="glass rounded-xl py-3 font-bold text-sm text-slate-400 hover:bg-white/5 transition-all active:scale-95">
                <i class="fas fa-home mr-1.5"></i>Home
            </button>
        </div>
    </div>`;

    save();
}

// ═══════════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════════
renderHome();
</script>
</body>
</html>
