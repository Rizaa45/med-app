<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLM Arena | Deep Learning Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *{box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:#060910;color:#e2e8f0;overflow-x:hidden;min-height:100vh}

        .page-bg{position:fixed;inset:0;z-index:0;
            background:radial-gradient(ellipse at 15% 20%,rgba(139,92,246,.05) 0%,transparent 50%),
            radial-gradient(ellipse at 85% 80%,rgba(249,115,22,.03) 0%,transparent 50%),
            radial-gradient(ellipse at 50% 50%,rgba(16,185,129,.02) 0%,transparent 60%),#060910}

        .card{background:rgba(15,23,42,.5);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.06);
            transition:all .35s cubic-bezier(.22,1,.36,1)}
        .card:hover{border-color:rgba(255,255,255,.12);box-shadow:0 20px 40px rgba(0,0,0,.3)}
        .card-interactive{cursor:pointer}.card-interactive:hover{transform:translateY(-3px)}

        @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
        .anim{animation:fadeUp .5s cubic-bezier(.22,1,.36,1) forwards;opacity:0}

        @keyframes pulse{0%,100%{opacity:.4}50%{opacity:.8}}.pulse{animation:pulse 3s ease-in-out infinite}

        @keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
        .slide-in{animation:slideIn .4s ease-out forwards}

        @keyframes popIn{0%{transform:scale(0);opacity:0}50%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
        .pop{animation:popIn .35s cubic-bezier(.175,.885,.32,1.275) forwards}

        @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
        .shake{animation:shake .4s ease-out}

        @keyframes glow{0%,100%{box-shadow:0 0 15px rgba(139,92,246,.15)}50%{box-shadow:0 0 35px rgba(139,92,246,.35)}}
        .glow{animation:glow 3s ease-in-out infinite}

        @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
        .shimmer{background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.04) 50%,transparent 100%);
            background-size:200% auto;animation:shimmer 2s linear infinite}

        .ring-track{stroke:rgba(255,255,255,.06)}
        .ring-fill{transition:stroke-dashoffset .8s ease-in-out;transform:rotate(-90deg);transform-origin:50% 50%}

        .topic-chip{transition:all .2s}.topic-chip:hover{transform:scale(1.03)}
        .topic-chip.selected{border-color:rgba(139,92,246,.6)!important;background:rgba(139,92,246,.1)!important}

        .mode-btn{transition:all .35s cubic-bezier(.22,1,.36,1)}
        .mode-btn:hover{transform:translateY(-4px) scale(1.02)}
        .mode-btn:active{transform:translateY(0) scale(.98)}

        .correct-flash{animation:correctFlash .5s ease-out}
        @keyframes correctFlash{0%{background:rgba(34,197,94,.2)}100%{background:transparent}}
        .wrong-flash{animation:wrongFlash .5s ease-out}
        @keyframes wrongFlash{0%{background:rgba(239,68,68,.2)}100%{background:transparent}}

        .xp-float{position:fixed;pointer-events:none;z-index:999;font-weight:900;font-size:18px;
            animation:xpFloat 1.2s ease-out forwards}
        @keyframes xpFloat{0%{opacity:1;transform:translateY(0) scale(1)}
            100%{opacity:0;transform:translateY(-80px) scale(1.5)}}

        ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:#1e293b;border-radius:10px}

        .combo-text{font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
        .combo-fire{color:#f97316}.combo-ultra{color:#ef4444}
        .combo-godlike{color:#a855f7;text-shadow:0 0 20px rgba(168,85,247,.5)}
    </style>
</head>
<body>
<div class="page-bg"></div>

<!-- ═══════════════════════════════════════════ -->
<!-- SCREEN: HOME                               -->
<!-- ═══════════════════════════════════════════ -->
<div id="screen-home" class="relative z-10 max-w-5xl mx-auto px-5 py-8">

    <!-- Header -->
    <header class="flex items-center justify-between mb-8 anim" style="animation-delay:.05s">
        <div class="flex items-center gap-3">
            <a href="index.html" class="w-9 h-9 bg-white/5 rounded-xl flex items-center justify-center text-slate-500 hover:text-white hover:bg-white/10 transition-all">
                <i class="fas fa-chevron-left text-sm"></i>
            </a>
            <div>
                <div class="flex items-center gap-2">
                    <span class="font-black text-xl tracking-tighter text-white">SLM Arena</span>
                    <span class="text-[8px] font-black bg-violet-500/20 text-violet-400 px-2 py-0.5 rounded uppercase tracking-[.2em]">v2</span>
                </div>
                <p class="text-[10px] text-slate-500 font-bold tracking-widest uppercase">Deep Learning Engine</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <div class="card rounded-xl px-3 py-2 flex items-center gap-2">
                <span class="text-orange-400">🔥</span>
                <span class="text-white font-black text-sm" id="h-streak">0</span>
            </div>
            <div class="card rounded-xl px-3 py-2 flex items-center gap-2">
                <div class="w-6 h-6 bg-gradient-to-br from-violet-500 to-purple-600 rounded-lg flex items-center justify-center text-[10px] text-white font-black" id="h-level">1</div>
                <span class="text-white font-black text-sm"><span id="h-xp">0</span> <span class="text-slate-500 text-[10px]">XP</span></span>
            </div>
        </div>
    </header>

    <!-- Module + Topic Selector -->
    <div class="card rounded-2xl p-5 mb-6 anim" style="animation-delay:.1s">
        <div class="flex flex-col sm:flex-row gap-4 items-start sm:items-center mb-4">
            <div class="flex-1">
                <label class="text-[9px] font-black text-slate-500 uppercase tracking-widest block mb-1.5">Modul</label>
                <select id="sel-module" onchange="Arena.loadTopics()" class="w-full p-3 bg-white/5 border border-white/10 rounded-xl text-white text-sm font-bold outline-none focus:border-violet-500 transition-all appearance-none cursor-pointer">
                    <option value="1">Modul 1 — Kommunikation & Biografie</option>
                </select>
            </div>
            <div>
                <label class="text-[9px] font-black text-slate-500 uppercase tracking-widest block mb-1.5">Runden</label>
                <div class="flex gap-1">
                    <button onclick="Arena.setRounds(5)" class="rounds-btn px-3 py-2.5 rounded-lg text-xs font-bold bg-white/5 text-slate-400 border border-white/10 hover:border-violet-500/50 transition-all" data-r="5">5</button>
                    <button onclick="Arena.setRounds(10)" class="rounds-btn px-3 py-2.5 rounded-lg text-xs font-bold bg-violet-500/20 text-violet-400 border border-violet-500/30 transition-all" data-r="10">10</button>
                    <button onclick="Arena.setRounds(15)" class="rounds-btn px-3 py-2.5 rounded-lg text-xs font-bold bg-white/5 text-slate-400 border border-white/10 hover:border-violet-500/50 transition-all" data-r="15">15</button>
                    <button onclick="Arena.setRounds(20)" class="rounds-btn px-3 py-2.5 rounded-lg text-xs font-bold bg-white/5 text-slate-400 border border-white/10 hover:border-violet-500/50 transition-all" data-r="20">20</button>
                </div>
            </div>
        </div>

        <!-- Topics -->
        <label class="text-[9px] font-black text-slate-500 uppercase tracking-widest block mb-2">Themen auswählen</label>
        <div class="flex flex-wrap gap-2 mb-3" id="topic-chips"></div>
        <div class="flex gap-2">
            <button onclick="Arena.selectAllTopics()" class="text-[10px] font-bold text-violet-400 hover:text-violet-300 transition-colors">Alle auswählen</button>
            <span class="text-slate-700">|</span>
            <button onclick="Arena.deselectAllTopics()" class="text-[10px] font-bold text-slate-500 hover:text-slate-400 transition-colors">Keine</button>
        </div>
    </div>

    <!-- Weakness Alert -->
    <div id="weakness-alert" class="hidden card rounded-2xl p-5 mb-6 border-l-4 border-red-500 anim" style="animation-delay:.12s">
        <div class="flex items-center gap-3 mb-3">
            <div class="w-9 h-9 bg-red-500/10 text-red-400 rounded-xl flex items-center justify-center"><i class="fas fa-crosshairs"></i></div>
            <div>
                <h3 class="font-black text-white text-sm">Schwächen erkannt</h3>
                <p class="text-[10px] text-slate-500">Aus deiner letzten Klausur-Simulation</p>
            </div>
        </div>
        <div id="weakness-tags" class="flex flex-wrap gap-1.5 mb-3"></div>
        <button onclick="Arena.startWeakness()" class="bg-red-500 hover:bg-red-400 text-white px-5 py-2.5 rounded-xl font-black text-[11px] uppercase tracking-widest transition-all">
            <i class="fas fa-crosshairs mr-1.5"></i> Schwächen zerstören
        </button>
    </div>

    <!-- 5 Mode Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-8 anim" style="animation-delay:.15s">

        <!-- ABSORB -->
        <button onclick="Arena.start('absorb')" class="mode-btn card card-interactive rounded-2xl p-6 text-left relative overflow-hidden group">
            <div class="absolute -right-6 -top-6 w-20 h-20 bg-indigo-500/5 rounded-full blur-2xl pulse"></div>
            <div class="w-12 h-12 bg-indigo-500/10 text-indigo-400 rounded-2xl flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                <i class="fas fa-eye text-xl"></i>
            </div>
            <h3 class="font-black text-white text-base uppercase tracking-tight mb-1">Absorb</h3>
            <p class="text-slate-500 text-[11px] leading-relaxed mb-3">Konzept lesen → verstehen → sofort aus dem Gedächtnis wiedergeben.</p>
            <div class="flex items-center gap-1.5 text-indigo-400 text-[10px] font-bold uppercase tracking-widest group-hover:gap-2.5 transition-all">
                <span>Starten</span><i class="fas fa-arrow-right text-[8px]"></i>
            </div>
        </button>

        <!-- RECALL -->
        <button onclick="Arena.start('recall')" class="mode-btn card card-interactive rounded-2xl p-6 text-left relative overflow-hidden group">
            <div class="absolute -right-6 -top-6 w-20 h-20 bg-orange-500/5 rounded-full blur-2xl pulse"></div>
            <div class="w-12 h-12 bg-orange-500/10 text-orange-400 rounded-2xl flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                <i class="fas fa-brain text-xl"></i>
            </div>
            <h3 class="font-black text-white text-base uppercase tracking-tight mb-1">Recall</h3>
            <p class="text-slate-500 text-[11px] leading-relaxed mb-3">Richtig/Falsch, Listen, Zuordnung, Freitext — alle Fragetypen gemischt.</p>
            <div class="flex items-center gap-1.5 text-orange-400 text-[10px] font-bold uppercase tracking-widest group-hover:gap-2.5 transition-all">
                <span>Starten</span><i class="fas fa-arrow-right text-[8px]"></i>
            </div>
        </button>

        <!-- CONNECT -->
        <button onclick="Arena.start('connect')" class="mode-btn card card-interactive rounded-2xl p-6 text-left relative overflow-hidden group">
            <div class="absolute -right-6 -top-6 w-20 h-20 bg-emerald-500/5 rounded-full blur-2xl pulse"></div>
            <div class="w-12 h-12 bg-emerald-500/10 text-emerald-400 rounded-2xl flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                <i class="fas fa-link text-xl"></i>
            </div>
            <h3 class="font-black text-white text-base uppercase tracking-tight mb-1">Connect</h3>
            <p class="text-slate-500 text-[11px] leading-relaxed mb-3">Begriffe ihren Definitionen zuordnen. Paare finden unter Zeitdruck.</p>
            <div class="flex items-center gap-1.5 text-emerald-400 text-[10px] font-bold uppercase tracking-widest group-hover:gap-2.5 transition-all">
                <span>Starten</span><i class="fas fa-arrow-right text-[8px]"></i>
            </div>
        </button>

        <!-- BRAIN MAP -->
        <button onclick="Arena.start('brainmap')" class="mode-btn card card-interactive rounded-2xl p-6 text-left relative overflow-hidden group">
            <div class="absolute -right-6 -top-6 w-20 h-20 bg-violet-500/5 rounded-full blur-2xl pulse"></div>
            <div class="w-12 h-12 bg-violet-500/10 text-violet-400 rounded-2xl flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                <i class="fas fa-map text-xl"></i>
            </div>
            <h3 class="font-black text-white text-base uppercase tracking-tight mb-1">Brain Map</h3>
            <p class="text-slate-500 text-[11px] leading-relaxed mb-3">Begriffe merken, dann blind aus dem Gedächtnis aufschreiben.</p>
            <div class="flex items-center gap-1.5 text-violet-400 text-[10px] font-bold uppercase tracking-widest group-hover:gap-2.5 transition-all">
                <span>Starten</span><i class="fas fa-arrow-right text-[8px]"></i>
            </div>
        </button>

        <!-- WEAKNESS DESTROYER -->
        <button onclick="Arena.startWeakness()" class="mode-btn card card-interactive rounded-2xl p-6 text-left relative overflow-hidden group border-red-500/10">
            <div class="absolute -right-6 -top-6 w-20 h-20 bg-red-500/5 rounded-full blur-2xl pulse"></div>
            <div class="w-12 h-12 bg-red-500/10 text-red-400 rounded-2xl flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                <i class="fas fa-crosshairs text-xl"></i>
            </div>
            <h3 class="font-black text-white text-base uppercase tracking-tight mb-1">Weakness</h3>
            <p class="text-slate-500 text-[11px] leading-relaxed mb-3">Bohrt gezielt in deine Klausur-Schwächen bis nichts mehr übrig ist.</p>
            <span id="weak-count-pill" class="hidden bg-red-500/20 text-red-400 text-[10px] font-black px-2 py-0.5 rounded-full"></span>
        </button>

        <!-- QUICK: Klausur -->
        <a href="exam-simulator.html" class="mode-btn card card-interactive rounded-2xl p-6 text-left relative overflow-hidden group border-orange-500/10">
            <div class="absolute -right-6 -top-6 w-20 h-20 bg-orange-500/5 rounded-full blur-2xl"></div>
            <div class="w-12 h-12 bg-gradient-to-br from-orange-500 to-red-500 text-white rounded-2xl flex items-center justify-center mb-4 shadow-lg shadow-orange-500/20 group-hover:scale-110 transition-transform">
                <i class="fas fa-file-alt text-xl"></i>
            </div>
            <h3 class="font-black text-white text-base uppercase tracking-tight mb-1">Klausur</h3>
            <p class="text-slate-500 text-[11px] leading-relaxed mb-3">1:1 Papier-Klausur. 90 Min. Fallbeispiel + Bewertung.</p>
            <div class="flex items-center gap-1.5 text-orange-400 text-[10px] font-bold uppercase tracking-widest group-hover:gap-2.5 transition-all">
                <span>Zur Klausur</span><i class="fas fa-external-link-alt text-[8px]"></i>
            </div>
        </a>
    </div>

    <!-- Topic Mastery -->
    <div class="card rounded-2xl p-5 anim" style="animation-delay:.2s">
        <h3 class="font-black text-white text-sm uppercase tracking-tight mb-4">Themen-Meisterung</h3>
        <div id="mastery-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-3"></div>
    </div>
</div>

<!-- ═══════════════════════════════════════════ -->
<!-- SCREEN: GAME                               -->
<!-- ═══════════════════════════════════════════ -->
<div id="screen-game" class="hidden relative z-10 min-h-screen">

    <!-- Top Bar -->
    <div class="fixed top-0 left-0 right-0 z-50 bg-[#060910]/90 backdrop-blur-xl border-b border-white/5">
        <div class="max-w-3xl mx-auto px-5 h-12 flex items-center justify-between">
            <button onclick="Arena.quit()" class="text-slate-500 hover:text-white text-xs font-bold flex items-center gap-1.5 transition-colors">
                <i class="fas fa-times"></i><span class="hidden sm:inline">Beenden</span>
            </button>
            <div class="flex items-center gap-3">
                <span id="g-mode" class="text-[9px] font-black text-violet-400 uppercase tracking-[.2em]">ABSORB</span>
                <span class="text-slate-700 text-xs">|</span>
                <span class="text-[9px] font-black text-slate-500 uppercase tracking-widest"><span id="g-cur">1</span>/<span id="g-tot">10</span></span>
            </div>
            <div class="flex items-center gap-3">
                <div class="flex items-center gap-1"><span class="text-orange-400 text-sm">🔥</span><span id="g-streak" class="text-white font-black text-sm">0</span></div>
                <div id="g-combo" class="hidden combo-text"></div>
                <div class="flex items-center gap-1">
                    <span class="text-indigo-400 text-xs">+</span><span id="g-xp" class="text-indigo-400 font-black text-sm">0</span><span class="text-indigo-400 text-[9px] font-bold">XP</span>
                </div>
            </div>
        </div>
        <div class="h-0.5 bg-white/5"><div id="g-bar" class="h-full bg-violet-500 transition-all duration-500" style="width:0%"></div></div>
    </div>

    <!-- Content -->
    <div class="pt-16 pb-16 px-5 max-w-2xl mx-auto">
        <div id="g-content"></div>
    </div>
</div>

<!-- ═══════════════════════════════════════════ -->
<!-- SCREEN: RESULTS                            -->
<!-- ═══════════════════════════════════════════ -->
<div id="screen-results" class="hidden relative z-10 min-h-screen flex items-center justify-center px-5 py-10">
    <div id="results-content" class="w-full max-w-lg"></div>
</div>

<script>
// ═══════════════════════════════════════════════
// SLM ARENA v2 — COMPLETE ENGINE
// ═══════════════════════════════════════════════

const Arena = {
    // ── STATE ──
    bank: [],
    questions: [],
    falls: [],
    topics: [],
    selectedTopics: new Set(),
    rounds: 10,
    mode: null,
    queue: [],
    idx: 0,
    streak: 0,
    maxStreak: 0,
    xpSession: 0,
    correct: 0,
    total: 0,
    topicResults: {},

    // ── PERSISTENT ──
    get xp() { return parseInt(localStorage.getItem('arena_xp')||'0') },
    set xp(v) { localStorage.setItem('arena_xp', v.toString()) },
    get level() { return Math.floor(this.xp / 500) + 1 },
    get mastery() { return JSON.parse(localStorage.getItem('arena_mastery')||'{}') },
    set mastery(v) { localStorage.setItem('arena_mastery', JSON.stringify(v)) },
    get dailyStreak() { return parseInt(localStorage.getItem('arena_streak')||'0') },

    // ── INIT ──
    async init() {
        this.updateHomeStats();
        await this.loadBank();
        this.loadTopics();
        this.loadWeaknesses();
        this.renderMastery();
    },

    async loadBank() {
        try {
            const r = await fetch('data/question-banks/module1_questions.json');
            this.bank = await r.json();
            this.questions = this.bank.filter(i => i.q_id);
            this.falls = this.bank.filter(i => i.fall_id);
            this.questions.forEach(q => { if(q.fallabhaengig===undefined) q.fallabhaengig=false; });
        } catch(e) { console.error('Bank load error', e); }
    },

    loadTopics() {
        const set = new Set();
        this.questions.forEach(q => { if(q.topic) set.add(q.topic); });
        this.topics = [...set].sort();
        this.selectedTopics = new Set(this.topics);
        this.renderTopicChips();
    },

    renderTopicChips() {
        const c = document.getElementById('topic-chips');
        const topicNames = {
            'biografiearbeit':'Biografiearbeit','kommunikation_theorie':'Kommunikationstheorie',
            'kommunikation_praxis':'Kommunikationspraxis','pflegeprozess_aufnahme':'Pflegeprozess & Aufnahme',
            'pflegeprozess':'Pflegeprozess','emotionspsychologie':'Emotionspsychologie',
            'supervision_beratung':'Supervision & Beratung','beratung_supervision':'Beratung & Supervision',
            'beratung_kollegial':'Kollegiale Beratung','beratungsformate':'Beratungsformate',
            'heimaufnahme':'Heimaufnahme','heimaufnahme_administration':'Heimaufnahme Admin',
            'heimaufnahme_vorbereitung':'Zimmervorbereitung','heimaufnahme_dokumente':'Aufnahme-Dokumente',
            'heimaufnahme_durchfuehrung':'Aufnahme-Durchführung','heimaufnahme_information':'Bewohner-Information',
            'interkulturelle_kommunikation':'Interkulturelle Komm.','pflegeprozess_anamnese':'Pflegeanamnese',
            'burnout_praevention':'Burnout-Prävention','biografieforschung':'Biografieforschung',
            'biografiearbeit_forschung':'Biografieforschung','reflexion_methodik':'Reflexionsmethodik',
            'kommunikation_störer':'Kommunikationsstörer','emotionsentstehung':'Emotionsentstehung',
        };
        const counts = {};
        this.questions.forEach(q => { counts[q.topic] = (counts[q.topic]||0)+1; });

        c.innerHTML = this.topics.map(t => {
            const name = topicNames[t] || t.replace(/_/g,' ');
            const n = counts[t]||0;
            const sel = this.selectedTopics.has(t);
            return `<button onclick="Arena.toggleTopic('${t}')" data-topic="${t}" class="topic-chip px-3 py-1.5 rounded-lg text-[11px] font-bold border transition-all ${sel?'bg-violet-500/10 text-violet-300 border-violet-500/30':'bg-white/3 text-slate-500 border-white/5 hover:border-white/15'}">${name} <span class="text-[9px] opacity-50">${n}</span></button>`;
        }).join('');
    },

    toggleTopic(t) {
        if(this.selectedTopics.has(t)) this.selectedTopics.delete(t); else this.selectedTopics.add(t);
        this.renderTopicChips();
    },
    selectAllTopics() { this.selectedTopics = new Set(this.topics); this.renderTopicChips(); },
    deselectAllTopics() { this.selectedTopics.clear(); this.renderTopicChips(); },

    setRounds(n) {
        this.rounds = n;
        document.querySelectorAll('.rounds-btn').forEach(b => {
            if(parseInt(b.dataset.r)===n) { b.className='rounds-btn px-3 py-2.5 rounded-lg text-xs font-bold bg-violet-500/20 text-violet-400 border border-violet-500/30 transition-all'; }
            else { b.className='rounds-btn px-3 py-2.5 rounded-lg text-xs font-bold bg-white/5 text-slate-400 border border-white/10 hover:border-violet-500/50 transition-all'; }
        });
    },

    loadWeaknesses() {
        const hist = JSON.parse(localStorage.getItem('slm_exam_history')||'[]');
        const last = hist.filter(h=>h.module===1).pop();
        if(!last||!last.topicScores) return;
        const weak = Object.entries(last.topicScores).filter(([t,s])=>s.possible>0&&(s.earned/s.possible)<0.6).map(([t])=>t);
        if(weak.length===0) return;
        document.getElementById('weakness-alert').classList.remove('hidden');
        document.getElementById('weakness-tags').innerHTML = weak.map(t=>`<span class="bg-red-500/10 text-red-400 text-[10px] font-bold px-2 py-0.5 rounded">${t.replace(/_/g,' ')}</span>`).join('');
        const pill = document.getElementById('weak-count-pill');
        pill.classList.remove('hidden');
        pill.textContent = weak.length+' Schwächen';
        this._weakTopics = weak;
    },

    updateHomeStats() {
        document.getElementById('h-xp').textContent = this.xp;
        document.getElementById('h-level').textContent = this.level;
        document.getElementById('h-streak').textContent = this.dailyStreak;
    },

    renderMastery() {
        const g = document.getElementById('mastery-grid');
        const m = this.mastery;
        const topicNames = {'biografiearbeit':'Biografie','kommunikation_theorie':'Komm. Theorie','kommunikation_praxis':'Komm. Praxis','pflegeprozess_aufnahme':'Pflegeprozess','emotionspsychologie':'Emotionen','supervision_beratung':'Supervision','heimaufnahme':'Heimaufnahme','interkulturelle_kommunikation':'Interkulturell'};
        const topics = Object.keys(topicNames);
        const circ = 2*Math.PI*18;

        g.innerHTML = topics.map(t=>{
            const pct = Math.min(m[t]||0, 100);
            const off = circ - (pct/100)*circ;
            const col = pct>=80?'stroke-green-500 text-green-400':pct>=50?'stroke-yellow-500 text-yellow-400':pct>=20?'stroke-orange-500 text-orange-400':'stroke-slate-700 text-slate-600';
            const label = pct>=80?'✅':pct>=50?'📖':pct>=20?'🔄':'⬜';
            return `<div class="card rounded-xl p-3 flex items-center gap-2.5">
                <div class="relative w-10 h-10 shrink-0">
                    <svg class="w-10 h-10" viewBox="0 0 44 44"><circle cx="22" cy="22" r="18" fill="none" class="ring-track" stroke-width="2.5"/><circle cx="22" cy="22" r="18" fill="none" class="${col.split(' ')[0]} ring-fill" stroke-width="2.5" stroke-dasharray="${circ}" stroke-dashoffset="${off}" stroke-linecap="round"/></svg>
                    <span class="absolute inset-0 flex items-center justify-center text-[9px] font-black ${col.split(' ')[1]}">${pct}%</span>
                </div>
                <div class="min-w-0"><div class="text-[11px] font-bold text-white truncate">${topicNames[t]}</div><div class="text-[9px] text-slate-600">${label}</div></div>
            </div>`;
        }).join('');
    },

    // ═══════════════════════════════
    // START GAME
    // ═══════════════════════════════
    start(mode) {
        if(this.selectedTopics.size===0) { alert('Bitte mindestens ein Thema auswählen!'); return; }
        this.mode = mode;
        this.idx = 0; this.streak = 0; this.maxStreak = 0;
        this.xpSession = 0; this.correct = 0; this.total = 0;
        this.topicResults = {};

        const pool = this.questions.filter(q=>this.selectedTopics.has(q.topic));
        if(pool.length===0) { alert('Keine Fragen für diese Themen!'); return; }
        this.queue = this.shuffle(pool).slice(0, this.rounds);

        this.showScreen('game');
        document.getElementById('g-mode').textContent = mode.toUpperCase();
        document.getElementById('g-tot').textContent = this.queue.length;
        this.render();
    },

    startWeakness() {
        if(!this._weakTopics||this._weakTopics.length===0) { alert('Keine Schwächen erkannt. Mach zuerst eine Klausur!'); return; }
        this.selectedTopics = new Set(this._weakTopics);
        this.renderTopicChips();
        this.start('recall');
    },

    // ═══════════════════════════════
    // RENDER CURRENT QUESTION
    // ═══════════════════════════════
    render() {
        const q = this.queue[this.idx];
        if(!q) { this.finish(); return; }

        document.getElementById('g-cur').textContent = this.idx+1;
        document.getElementById('g-bar').style.width = ((this.idx/this.queue.length)*100)+'%';
        document.getElementById('g-streak').textContent = this.streak;
        document.getElementById('g-xp').textContent = this.xpSession;
        this.updateCombo();

        const C = document.getElementById('g-content');
        const topic = (q.topic||'').replace(/_/g,' ');

        switch(this.mode) {
            case 'absorb': this.renderAbsorb(q, C, topic); break;
            case 'recall': this.renderRecall(q, C, topic); break;
            case 'connect': this.renderConnect(q, C, topic); break;
            case 'brainmap': this.renderBrainMap(q, C, topic); break;
            default: this.renderRecall(q, C, topic);
        }
        window.scrollTo({top:0,behavior:'smooth'});
    },

    // ── ABSORB ──
    renderAbsorb(q, C, topic) {
        const data = q.data||{};
        const answer = data.correct_answer||data.definition_correct||q.correct_answers?.join(', ')||'';
        const keywords = data.keywords||data.definition_keywords||[];

        C.innerHTML = `
        <div class="text-center mb-4"><span class="text-[9px] font-black text-indigo-400 uppercase tracking-[.2em] bg-indigo-500/10 px-3 py-1 rounded-full">${topic}</span></div>
        <div id="phase1" class="anim">
            <div class="card rounded-2xl p-6 mb-5">
                <h2 class="text-base font-black text-white mb-4 leading-snug">${this.fmt(q.instruction||q.statement||'')}</h2>
                <div class="bg-indigo-500/5 border border-indigo-500/15 rounded-xl p-5 mb-4">
                    <div class="text-[9px] font-black text-indigo-400 uppercase tracking-widest mb-2">💡 Musterantwort</div>
                    <p class="text-slate-300 text-sm leading-relaxed">${answer}</p>
                </div>
                ${keywords.length?`<div class="flex flex-wrap gap-1.5">${keywords.map(k=>`<span class="bg-white/5 text-indigo-300/80 text-[10px] font-bold px-2 py-0.5 rounded border border-white/5">${k}</span>`).join('')}</div>`:''}
            </div>
            <button onclick="Arena.absorbPhase2()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-3.5 rounded-xl font-black text-xs uppercase tracking-widest transition-all">
                <i class="fas fa-brain mr-2"></i>Verstanden — Jetzt abfragen
            </button>
        </div>
        <div id="phase2" class="hidden"></div>
        <div id="phase3" class="hidden"></div>`;
    },

    absorbPhase2() {
        const q = this.queue[this.idx];
        document.getElementById('phase1').classList.add('hidden');
        const p2 = document.getElementById('phase2');
        p2.classList.remove('hidden');
        p2.innerHTML = `<div class="anim">
            <div class="card rounded-2xl p-6 mb-5">
                <div class="text-[9px] font-black text-orange-400 uppercase tracking-[.2em] mb-3">🧠 Jetzt aus dem Gedächtnis</div>
                <h2 class="text-base font-black text-white mb-4">${this.fmt(q.instruction||'')}</h2>
                <textarea id="absorb-ans" class="w-full bg-white/5 border border-white/10 rounded-xl p-4 text-white text-sm outline-none focus:border-indigo-500 transition-all resize-none" rows="4" placeholder="Schreibe aus dem Gedächtnis..." autofocus></textarea>
            </div>
            <button onclick="Arena.absorbCheck()" class="w-full bg-orange-500 hover:bg-orange-400 text-white py-3.5 rounded-xl font-black text-xs uppercase tracking-widest transition-all">
                <i class="fas fa-check mr-2"></i>Prüfen
            </button>
        </div>`;
        setTimeout(()=>document.getElementById('absorb-ans')?.focus(),100);
    },

    absorbCheck() {
        const q = this.queue[this.idx];
        const data = q.data||{};
        const kw = data.keywords||data.definition_keywords||[];
        const ans = data.correct_answer||data.definition_correct||'';
        const user = document.getElementById('absorb-ans').value.trim();

        let hit=0;
        kw.forEach(k=>{ if(user.toLowerCase().includes(k.toLowerCase())) hit++; });
        const pct = kw.length>0?Math.round((hit/kw.length)*100):0;
        const xp = Math.round(pct/10)*5;

        this.score(pct>=60, xp, q.topic);

        document.getElementById('phase2').classList.add('hidden');
        const p3 = document.getElementById('phase3');
        p3.classList.remove('hidden');
        const emoji = pct>=70?'🔥':pct>=40?'💪':'📖';
        const col = pct>=70?'emerald':pct>=40?'yellow':'red';

        p3.innerHTML = `<div class="anim">
            <div class="card rounded-2xl p-6 mb-5 border-${col}-500/20">
                <div class="text-center mb-4">
                    <div class="text-4xl mb-1">${emoji}</div>
                    <div class="text-2xl font-black text-${col}-400">${pct}%</div>
                    <div class="text-xs text-slate-500">${hit}/${kw.length} Keywords</div>
                    <div class="text-indigo-400 font-black text-sm mt-1">+${xp} XP</div>
                </div>
                <div class="flex flex-wrap gap-1 mb-4">${kw.map(k=>{
                    const h=user.toLowerCase().includes(k.toLowerCase());
                    return `<span class="${h?'bg-emerald-500/15 text-emerald-400 border-emerald-500/20':'bg-red-500/10 text-red-400/70 border-red-500/15'} text-[10px] font-bold px-2 py-0.5 rounded border">${h?'✓':'✗'} ${k}</span>`;
                }).join('')}</div>
                <details class="group"><summary class="text-[10px] font-bold text-indigo-400 uppercase tracking-widest cursor-pointer hover:text-indigo-300">Musterantwort zeigen</summary>
                    <p class="text-slate-400 text-xs mt-2 leading-relaxed">${ans}</p>
                </details>
            </div>
            <button onclick="Arena.next()" class="w-full bg-slate-800 hover:bg-slate-700 text-white py-3.5 rounded-xl font-black text-xs uppercase tracking-widest transition-all">Weiter <i class="fas fa-arrow-right ml-2"></i></button>
        </div>`;
    },

    // ── RECALL ──
    renderRecall(q, C, topic) {
        if(q.type==='richtig_falsch') this.recallRF(q,C,topic);
        else if(q.type==='nennen_liste') this.recallList(q,C,topic);
        else if(q.type==='zuordnung') this.recallZuordnung(q,C,topic);
        else this.recallFrei(q,C,topic);
    },

    recallRF(q,C,topic) {
        const stmts = q.statements||(q.data?.statements)||[{text:q.statement,answer:q.answer}];
        const s = stmts[Math.floor(Math.random()*stmts.length)];
        C.innerHTML = `
        <div class="text-center mb-4"><span class="text-[9px] font-black text-orange-400 uppercase tracking-[.2em] bg-orange-500/10 px-3 py-1 rounded-full">${topic}</span></div>
        <div id="rf-card" class="card rounded-2xl p-6 mb-5 anim">
            <div class="text-[9px] font-black text-slate-500 uppercase tracking-widest mb-3">Richtig oder Falsch?</div>
            <h2 class="text-base font-bold text-white leading-relaxed mb-6">"${s.text}"</h2>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="Arena.checkRF(true,'${s.answer}')" class="card p-4 rounded-xl text-center hover:border-emerald-500/40 transition-all group cursor-pointer">
                    <i class="fas fa-check text-xl text-emerald-400 mb-1 group-hover:scale-125 transition-transform"></i>
                    <div class="font-black text-white text-xs uppercase">Richtig</div>
                </button>
                <button onclick="Arena.checkRF(false,'${s.answer}')" class="card p-4 rounded-xl text-center hover:border-red-500/40 transition-all group cursor-pointer">
                    <i class="fas fa-times text-xl text-red-400 mb-1 group-hover:scale-125 transition-transform"></i>
                    <div class="font-black text-white text-xs uppercase">Falsch</div>
                </button>
            </div>
        </div>
        <div id="rf-fb" class="hidden"></div>`;
    },

    checkRF(userSaysRichtig, correct) {
        const userAns = userSaysRichtig?'richtig':'falsch';
        const ok = userAns===correct;
        const xp = ok?15:0;
        const q = this.queue[this.idx];
        this.score(ok, xp, q.topic);

        const card = document.getElementById('rf-card');
        card.classList.add(ok?'correct-flash':'wrong-flash','shake');
        
        const fb = document.getElementById('rf-fb');
        fb.classList.remove('hidden');
        fb.innerHTML = `<div class="anim">
            <div class="card rounded-2xl p-5 ${ok?'border-emerald-500/20':'border-red-500/20'} mb-4">
                <div class="flex items-center gap-2 mb-2">
                    <span class="text-xl">${ok?'✅':'❌'}</span>
                    <span class="font-black text-white text-sm">${ok?'Richtig!':'Falsch!'}</span>
                    ${xp?`<span class="text-indigo-400 font-bold text-xs ml-auto">+${xp} XP</span>`:''}
                </div>
                <p class="text-slate-400 text-xs">${q.explanation||`Antwort: ${correct}`}</p>
            </div>
            <button onclick="Arena.next()" class="w-full bg-slate-800 hover:bg-slate-700 text-white py-3.5 rounded-xl font-black text-xs uppercase tracking-widest transition-all">Weiter <i class="fas fa-arrow-right ml-2"></i></button>
        </div>`;
    },

    recallList(q,C,topic) {
        const count = q.count||q.data?.count||3;
        const label = q.list_label||q.data?.list_label||'';
        C.innerHTML = `
        <div class="text-center mb-4"><span class="text-[9px] font-black text-orange-400 uppercase tracking-[.2em] bg-orange-500/10 px-3 py-1 rounded-full">${topic}</span></div>
        <div class="card rounded-2xl p-6 mb-5 anim">
            <div class="text-[9px] font-black text-slate-500 uppercase tracking-widest mb-3">Aus dem Gedächtnis</div>
            <h2 class="text-base font-black text-white leading-snug mb-5">${this.fmt(q.instruction)}</h2>
            ${label?`<div class="text-[10px] font-bold text-slate-400 mb-2">${label}</div>`:''}
            <div class="space-y-2.5">${Array.from({length:count},(_,i)=>`
                <div class="flex items-center gap-2.5">
                    <span class="w-7 h-7 bg-white/5 rounded-lg flex items-center justify-center text-slate-600 text-[10px] font-black shrink-0">${i+1}</span>
                    <input type="text" id="li-${i}" class="flex-1 bg-white/5 border border-white/10 rounded-xl px-3.5 py-2.5 text-white text-sm font-medium outline-none focus:border-violet-500 transition-all" placeholder="..." ${i===0?'autofocus':''}>
                </div>`).join('')}</div>
        </div>
        <button onclick="Arena.checkList(${count})" class="w-full bg-orange-500 hover:bg-orange-400 text-white py-3.5 rounded-xl font-black text-xs uppercase tracking-widest transition-all"><i class="fas fa-check mr-2"></i>Prüfen</button>
        <div id="list-fb" class="hidden mt-5"></div>`;
    },

    checkList(count) {
        const q = this.queue[this.idx];
        const valid = q.all_valid_answers||q.data?.all_valid_answers||q.correct_answers||q.data?.correct_answers||[];
        const correct = q.correct_answers||q.data?.correct_answers||[];
        let hit=0; const used=new Set();
        const results=[];
        for(let i=0;i<count;i++){
            const v=document.getElementById(`li-${i}`).value.trim();
            let ok=false;
            if(v) { const m=valid.find((a,ai)=>!used.has(ai)&&v.toLowerCase().includes(a.toLowerCase().substring(0,Math.min(4,a.length)))); if(m){ok=true;hit++;used.add(valid.indexOf(m));} }
            results.push({v,ok});
        }
        const pct=count>0?Math.round((hit/count)*100):0;
        const xp=hit*10;
        this.score(pct>=50,xp,q.topic);

        const fb=document.getElementById('list-fb');
        fb.classList.remove('hidden');
        fb.innerHTML=`<div class="anim">
            <div class="card rounded-2xl p-5 mb-4">
                <div class="flex items-center gap-2 mb-3"><span class="text-xl">${pct>=70?'🔥':pct>=40?'💪':'📖'}</span><span class="font-black text-white">${hit}/${count}</span><span class="text-indigo-400 font-bold text-xs ml-auto">+${xp} XP</span></div>
                <div class="space-y-1.5 mb-3">${results.map(r=>`<div class="flex items-center gap-2 text-xs"><span class="${r.ok?'text-emerald-400':'text-red-400'}">${r.ok?'✅':'❌'}</span><span class="text-slate-400">${r.v||'(leer)'}</span></div>`).join('')}</div>
                <details class="group"><summary class="text-[10px] font-bold text-indigo-400 uppercase tracking-widest cursor-pointer">Antworten zeigen</summary>
                    <div class="flex flex-wrap gap-1 mt-2">${correct.map(a=>`<span class="bg-emerald-500/10 text-emerald-400 text-[10px] font-bold px-2 py-0.5 rounded">${a}</span>`).join('')}</div>
                </details>
            </div>
            <button onclick="Arena.next()" class="w-full bg-slate-800 hover:bg-slate-700 text-white py-3.5 rounded-xl font-black text-xs uppercase tracking-widest transition-all">Weiter <i class="fas fa-arrow-right ml-2"></i></button>
        </div>`;
    },

    recallZuordnung(q,C,topic) {
        const data=q.data||{};
        const stmts=data.statements||[];
        const legend=data.legend||{};
        const opts=Object.keys(legend);
        const shuffled=[...stmts].sort(()=>Math.random()-.5);

        C.innerHTML=`
        <div class="text-center mb-4"><span class="text-[9px] font-black text-orange-400 uppercase tracking-[.2em] bg-orange-500/10 px-3 py-1 rounded-full">${topic}</span></div>
        <div class="card rounded-2xl p-6 mb-5 anim">
            <h2 class="text-base font-black text-white leading-snug mb-3">${this.fmt(q.instruction)}</h2>
            <div class="bg-white/3 rounded-xl p-3 mb-4 flex flex-wrap gap-2">${Object.entries(legend).map(([k,v])=>`<span class="text-[11px] font-bold text-indigo-300"><b class="text-white">${k}</b> = ${v}</span>`).join('')}</div>
            <div class="space-y-2.5">${shuffled.map((s,i)=>`
                <div class="flex items-center gap-2.5 bg-white/2 rounded-xl p-3 border border-white/5">
                    <select id="zu-${i}" class="w-12 bg-white/10 border border-white/10 rounded-lg px-1.5 py-2 text-white font-black text-center text-sm outline-none focus:border-violet-500 shrink-0">
                        <option value="">–</option>${opts.map(o=>`<option value="${o}">${o}</option>`).join('')}
                    </select>
                    <span class="text-slate-300 text-[12px] flex-1">${s.text}</span>
                </div>`).join('')}</div>
        </div>
        <button onclick="Arena.checkZu(${JSON.stringify(shuffled).replace(/"/g,'&quot;')})" class="w-full bg-orange-500 hover:bg-orange-400 text-white py-3.5 rounded-xl font-black text-xs uppercase tracking-widest transition-all"><i class="fas fa-check mr-2"></i>Prüfen</button>
        <div id="zu-fb" class="hidden mt-5"></div>`;
    },

    checkZu(stmts) {
        let hit=0;
        stmts.forEach((s,i)=>{ if(document.getElementById(`zu-${i}`).value===s.answer) hit++; });
        const pct=stmts.length>0?Math.round((hit/stmts.length)*100):0;
        const xp=hit*12;
        this.score(pct>=50,xp,this.queue[this.idx].topic);

        document.getElementById('zu-fb').classList.remove('hidden');
        document.getElementById('zu-fb').innerHTML=`<div class="anim">
            <div class="card rounded-2xl p-5 mb-4"><div class="flex items-center gap-2"><span class="text-xl">${pct>=70?'🔥':'📖'}</span><span class="font-black text-white">${hit}/${stmts.length}</span><span class="text-indigo-400 font-bold text-xs ml-auto">+${xp} XP</span></div></div>
            <button onclick="Arena.next()" class="w-full bg-slate-800 hover:bg-slate-700 text-white py-3.5 rounded-xl font-black text-xs uppercase tracking-widest transition-all">Weiter <i class="fas fa-arrow-right ml-2"></i></button>
        </div>`;
    },

    recallFrei(q,C,topic) {
        const data=q.data||{};
        C.innerHTML=`
        <div class="text-center mb-4"><span class="text-[9px] font-black text-orange-400 uppercase tracking-[.2em] bg-orange-500/10 px-3 py-1 rounded-full">${topic}</span></div>
        <div class="card rounded-2xl p-6 mb-5 anim">
            <div class="text-[9px] font-black text-slate-500 uppercase tracking-widest mb-3">Freitext</div>
            <h2 class="text-base font-black text-white leading-snug mb-5">${this.fmt(q.instruction||'')}</h2>
            <textarea id="frei-ans" class="w-full bg-white/5 border border-white/10 rounded-xl p-4 text-white text-sm outline-none focus:border-violet-500 transition-all resize-none" rows="4" placeholder="Deine Antwort..." autofocus></textarea>
        </div>
        <button onclick="Arena.checkFrei()" class="w-full bg-orange-500 hover:bg-orange-400 text-white py-3.5 rounded-xl font-black text-xs uppercase tracking-widest transition-all"><i class="fas fa-check mr-2"></i>Prüfen</button>
        <div id="frei-fb" class="hidden mt-5"></div>`;
    },

    checkFrei() {
        const q=this.queue[this.idx];
        const data=q.data||{};
        const kw=data.keywords||data.definition_keywords||[];
        const ans=data.correct_answer||data.definition_correct||'';
        const user=document.getElementById('frei-ans').value.trim();
        let hit=0;
        kw.forEach(k=>{if(user.toLowerCase().includes(k.toLowerCase()))hit++;});
        const pct=kw.length>0?Math.round((hit/kw.length)*100):0;
        const xp=Math.round(pct/10)*5;
        this.score(pct>=50,xp,q.topic);

        document.getElementById('frei-fb').classList.remove('hidden');
        document.getElementById('frei-fb').innerHTML=`<div class="anim">
            <div class="card rounded-2xl p-5 mb-4">
                <div class="text-center mb-3"><div class="text-2xl font-black ${pct>=70?'text-emerald-400':pct>=40?'text-yellow-400':'text-red-400'}">${pct}%</div><div class="text-indigo-400 font-bold text-xs">+${xp} XP</div></div>
                <div class="flex flex-wrap gap-1 mb-3">${kw.map(k=>{const h=user.toLowerCase().includes(k.toLowerCase());return `<span class="${h?'bg-emerald-500/15 text-emerald-400':'bg-red-500/10 text-red-400/60'} text-[10px] font-bold px-2 py-0.5 rounded">${h?'✓':'✗'} ${k}</span>`;}).join('')}</div>
                <details class="group"><summary class="text-[10px] font-bold text-indigo-400 uppercase tracking-widest cursor-pointer">Musterantwort</summary><p class="text-slate-400 text-xs mt-2">${ans}</p></details>
            </div>
            <button onclick="Arena.next()" class="w-full bg-slate-800 hover:bg-slate-700 text-white py-3.5 rounded-xl font-black text-xs uppercase tracking-widest transition-all">Weiter <i class="fas fa-arrow-right ml-2"></i></button>
        </div>`;
    },

    // ── CONNECT: Match pairs ──
    renderConnect(q,C,topic) {
        const data=q.data||{};
        let pairs=[];
        if(q.type==='zuordnung'&&data.legend&&data.statements) {
            pairs=data.statements.map(s=>({term:data.legend[s.answer]||s.answer, def:s.text}));
        } else if(q.type==='tabelle_2spalten'&&data.table) {
            data.table.rows.forEach(r=>{
                if(r.cells.length>=2&&r.cells[0].correct_answer&&r.cells[1].correct_answer) {
                    pairs.push({term:r.cells[0].correct_answer, def:r.cells[1].correct_answer.substring(0,60)});
                }
            });
        } else if(q.correct_answers) {
            pairs=q.correct_answers.slice(0,4).map((a,i)=>({term:a, def:`Punkt ${i+1}`}));
        }
        if(pairs.length<2) { this.renderRecall(q,C,topic); return; }
        pairs=pairs.slice(0,5);

        const terms=this.shuffle([...pairs]);
        const defs=this.shuffle([...pairs]);
        this._connectPairs=pairs;
        this._connectMatches={};
        this._connectSelected=null;

        C.innerHTML=`
        <div class="text-center mb-4"><span class="text-[9px] font-black text-emerald-400 uppercase tracking-[.2em] bg-emerald-500/10 px-3 py-1 rounded-full">${topic}</span></div>
        <div class="card rounded-2xl p-6 mb-5 anim">
            <div class="text-[9px] font-black text-slate-500 uppercase tracking-widest mb-3">Paare verbinden</div>
            <p class="text-slate-400 text-xs mb-4">Klicke einen Begriff links, dann die passende Definition rechts.</p>
            <div class="grid grid-cols-2 gap-3">
                <div class="space-y-2">${terms.map((p,i)=>`<button id="ct-${i}" onclick="Arena.connectSelect('t',${i},'${p.term.replace(/'/g,"\\'")}')" class="w-full card p-3 rounded-xl text-left text-sm font-bold text-indigo-300 hover:border-indigo-500/40 transition-all">${p.term}</button>`).join('')}</div>
                <div class="space-y-2">${defs.map((p,i)=>`<button id="cd-${i}" onclick="Arena.connectSelect('d',${i},'${p.term.replace(/'/g,"\\'")}')" class="w-full card p-3 rounded-xl text-left text-xs text-slate-400 hover:border-emerald-500/40 transition-all">${p.def}</button>`).join('')}</div>
            </div>
        </div>
        <div id="connect-fb" class="hidden"></div>`;
    },

    connectSelect(side,idx,termKey) {
        if(side==='t') {
            document.querySelectorAll('[id^="ct-"]').forEach(b=>b.classList.remove('border-indigo-500','bg-indigo-500/10'));
            document.getElementById(`ct-${idx}`).classList.add('border-indigo-500','bg-indigo-500/10');
            this._connectSelected={side,idx,term:termKey};
        } else if(this._connectSelected&&this._connectSelected.side==='t') {
            const tTerm=this._connectSelected.term;
            const dTerm=termKey;
            const ok=tTerm===dTerm;
            const tBtn=document.getElementById(`ct-${this._connectSelected.idx}`);
            const dBtn=document.getElementById(`cd-${idx}`);

            if(ok) {
                tBtn.classList.add('bg-emerald-500/15','border-emerald-500/30','pointer-events-none','opacity-50');
                dBtn.classList.add('bg-emerald-500/15','border-emerald-500/30','pointer-events-none','opacity-50');
                tBtn.classList.remove('border-indigo-500','bg-indigo-500/10');
                this._connectMatches[tTerm]=true;
                if(Object.keys(this._connectMatches).length===this._connectPairs.length) {
                    setTimeout(()=>this.connectDone(),400);
                }
            } else {
                tBtn.classList.add('shake','border-red-500/50');
                dBtn.classList.add('shake','border-red-500/50');
                setTimeout(()=>{
                    tBtn.classList.remove('shake','border-red-500/50','border-indigo-500','bg-indigo-500/10');
                    dBtn.classList.remove('shake','border-red-500/50');
                },500);
            }
            this._connectSelected=null;
        }
    },

    connectDone() {
        const matched=Object.keys(this._connectMatches).length;
        const total=this._connectPairs.length;
        const xp=matched*12;
        this.score(true,xp,this.queue[this.idx].topic);
        document.getElementById('connect-fb').classList.remove('hidden');
        document.getElementById('connect-fb').innerHTML=`<div class="anim">
            <div class="card rounded-2xl p-5 mb-4 text-center">
                <div class="text-3xl mb-1">🔥</div>
                <div class="font-black text-white text-lg">Alle ${total} Paare verbunden!</div>
                <div class="text-indigo-400 font-bold text-sm">+${xp} XP</div>
            </div>
            <button onclick="Arena.next()" class="w-full bg-slate-800 hover:bg-slate-700 text-white py-3.5 rounded-xl font-black text-xs uppercase tracking-widest transition-all">Weiter <i class="fas fa-arrow-right ml-2"></i></button>
        </div>`;
    },

    // ── BRAIN MAP ──
    renderBrainMap(q,C,topic) {
        const items = q.correct_answers||q.data?.correct_answers||[];
        if(items.length<2) { this.renderRecall(q,C,topic); return; }
        const show = items.slice(0, Math.min(items.length,6));
        const seconds = Math.max(3, Math.min(show.length*2, 10));

        C.innerHTML=`
        <div class="text-center mb-4"><span class="text-[9px] font-black text-violet-400 uppercase tracking-[.2em] bg-violet-500/10 px-3 py-1 rounded-full">${topic}</span></div>
        <div class="card rounded-2xl p-6 mb-5 anim">
            <div class="text-[9px] font-black text-slate-500 uppercase tracking-widest mb-3">📍 Merke dir alles!</div>
            <h2 class="text-sm font-black text-white leading-snug mb-4">${this.fmt(q.instruction)}</h2>
            <div id="bm-show" class="grid grid-cols-2 gap-2 mb-4">${show.map(s=>`<div class="bg-violet-500/10 border border-violet-500/20 rounded-xl p-3 text-center"><span class="text-violet-300 font-bold text-sm">${s}</span></div>`).join('')}</div>
            <div class="text-center"><div id="bm-timer" class="text-3xl font-black text-white">${seconds}</div><p class="text-[10px] text-slate-600">Sekunden</p></div>
        </div>
        <div id="bm-recall" class="hidden"></div>`;

        let t=seconds;
        const iv=setInterval(()=>{
            t--;document.getElementById('bm-timer').textContent=t;
            if(t<=0){
                clearInterval(iv);
                document.getElementById('bm-show').innerHTML='<div class="col-span-2 text-center py-6 text-slate-700"><i class="fas fa-eye-slash text-2xl mb-1"></i><p class="text-[10px]">Versteckt!</p></div>';
                const rc=document.getElementById('bm-recall');
                rc.classList.remove('hidden');
                rc.innerHTML=`<div class="anim">
                    <div class="card rounded-2xl p-6 mb-5">
                        <div class="text-[9px] font-black text-violet-400 uppercase tracking-widest mb-3">Jetzt aufschreiben!</div>
                        <div class="space-y-2">${show.map((_,i)=>`<div class="flex items-center gap-2"><span class="w-6 h-6 bg-violet-500/10 rounded-lg flex items-center justify-center text-violet-400 text-[10px] font-black">${i+1}</span><input type="text" id="bm-${i}" class="flex-1 bg-white/5 border border-white/10 rounded-xl px-3 py-2.5 text-white text-sm outline-none focus:border-violet-500" placeholder="..." ${i===0?'autofocus':''}></div>`).join('')}</div>
                    </div>
                    <button onclick="Arena.checkBM(${show.length})" class="w-full bg-violet-500 hover:bg-violet-400 text-white py-3.5 rounded-xl font-black text-xs uppercase tracking-widest transition-all"><i class="fas fa-check mr-2"></i>Prüfen</button>
                    <div id="bm-fb" class="hidden mt-5"></div>
                </div>`;
                document.getElementById('bm-0')?.focus();
            }
        },1000);
    },

    checkBM(count) {
        const q=this.queue[this.idx];
        const correct=q.correct_answers||q.data?.correct_answers||[];
        const valid=q.all_valid_answers||q.data?.all_valid_answers||correct;
        let hit=0;
        for(let i=0;i<count;i++){
            const v=document.getElementById(`bm-${i}`).value.trim();
            if(v&&valid.some(a=>v.toLowerCase().includes(a.toLowerCase().substring(0,Math.min(4,a.length))))) hit++;
        }
        const xp=hit*15;
        this.score(hit>=Math.ceil(count/2),xp,q.topic);

        document.getElementById('bm-fb').classList.remove('hidden');
        document.getElementById('bm-fb').innerHTML=`<div class="anim">
            <div class="card rounded-2xl p-5 mb-4 text-center">
                <div class="text-2xl font-black ${hit>=Math.ceil(count/2)?'text-emerald-400':'text-red-400'}">${hit}/${count}</div>
                <div class="text-indigo-400 font-bold text-xs">+${xp} XP</div>
                <div class="flex flex-wrap gap-1 justify-center mt-3">${correct.map(c=>`<span class="bg-violet-500/10 text-violet-300 text-[10px] font-bold px-2 py-0.5 rounded">${c}</span>`).join('')}</div>
            </div>
            <button onclick="Arena.next()" class="w-full bg-slate-800 hover:bg-slate-700 text-white py-3.5 rounded-xl font-black text-xs uppercase tracking-widest transition-all">Weiter <i class="fas fa-arrow-right ml-2"></i></button>
        </div>`;
    },

    // ═══════════════════════════════
    // SCORING & PROGRESSION
    // ═══════════════════════════════
    score(isCorrect, xp, topic) {
        this.total++;
        if(isCorrect) { this.correct++; this.streak++; if(this.streak>this.maxStreak) this.maxStreak=this.streak; }
        else { this.streak=0; }

        // Combo bonus
        const combo = this.streak>=10?3:this.streak>=7?2.5:this.streak>=5?2:this.streak>=3?1.5:1;
        const finalXP = Math.round(xp*combo);
        this.xpSession += finalXP;
        this.xp += finalXP;

        // Topic mastery
        if(topic) {
            const m=this.mastery;
            const cur=m[topic]||0;
            m[topic]=Math.round(cur*0.7+(isCorrect?100:0)*0.3);
            this.mastery=m;

            if(!this.topicResults[topic]) this.topicResults[topic]={correct:0,total:0};
            this.topicResults[topic].total++;
            if(isCorrect) this.topicResults[topic].correct++;
        }

        // Float XP
        if(finalXP>0) this.floatXP(finalXP);

        // Update UI
        document.getElementById('g-streak').textContent=this.streak;
        document.getElementById('g-xp').textContent=this.xpSession;
        this.updateCombo();
    },

    floatXP(amount) {
        const el=document.createElement('div');
        el.className='xp-float text-indigo-400';
        el.textContent=`+${amount}`;
        el.style.left=Math.random()*60+20+'%';
        el.style.top='40%';
        document.body.appendChild(el);
        setTimeout(()=>el.remove(),1200);
    },

    updateCombo() {
        const el=document.getElementById('g-combo');
        if(this.streak>=10) { el.classList.remove('hidden'); el.className='combo-text combo-godlike'; el.textContent='GODLIKE ×3'; }
        else if(this.streak>=7) { el.classList.remove('hidden'); el.className='combo-text combo-ultra'; el.textContent='ULTRA ×2.5'; }
        else if(this.streak>=5) { el.classList.remove('hidden'); el.className='combo-text combo-fire'; el.textContent='ON FIRE ×2'; }
        else if(this.streak>=3) { el.classList.remove('hidden'); el.className='combo-text'; el.style.color='#a3e635'; el.textContent='COMBO ×1.5'; }
        else { el.classList.add('hidden'); }
    },

    next() {
        this.idx++;
        if(this.idx>=this.queue.length) this.finish();
        else this.render();
    },

    // ═══════════════════════════════
    // FINISH / RESULTS
    // ═══════════════════════════════
    finish() {
        // Update daily streak
        const today=new Date().toDateString();
        const last=localStorage.getItem('arena_last_date');
        let streak=this.dailyStreak;
        if(last!==today){ streak++; localStorage.setItem('arena_streak',streak.toString()); localStorage.setItem('arena_last_date',today); }

        this.showScreen('results');
        const pct=this.total>0?Math.round((this.correct/this.total)*100):0;
        const lvl=this.level;

        const R=document.getElementById('results-content');
        R.innerHTML=`
        <div class="text-center mb-8 anim">
            <div class="text-5xl mb-3">${pct>=80?'🏆':pct>=60?'🔥':pct>=40?'💪':'📖'}</div>
            <h2 class="text-2xl font-black text-white tracking-tight mb-1">Session beendet!</h2>
            <p class="text-slate-500 text-sm">${this.mode?.toUpperCase()} • ${this.total} Fragen</p>
        </div>

        <div class="grid grid-cols-3 gap-3 mb-6 anim" style="animation-delay:.1s">
            <div class="card rounded-xl p-4 text-center"><div class="text-2xl font-black text-indigo-400">${this.xpSession}</div><div class="text-[9px] text-slate-500 font-bold uppercase">XP</div></div>
            <div class="card rounded-xl p-4 text-center"><div class="text-2xl font-black text-emerald-400">${pct}%</div><div class="text-[9px] text-slate-500 font-bold uppercase">Richtig</div></div>
            <div class="card rounded-xl p-4 text-center"><div class="text-2xl font-black text-orange-400">${this.maxStreak}</div><div class="text-[9px] text-slate-500 font-bold uppercase">Max Streak</div></div>
        </div>

        <div class="card rounded-xl p-4 mb-6 text-center anim" style="animation-delay:.15s">
            <div class="text-[9px] font-black text-slate-500 uppercase tracking-widest mb-1">Level</div>
            <div class="text-3xl font-black text-white">${lvl}</div>
            <div class="w-full bg-white/5 rounded-full h-1.5 mt-2"><div class="bg-violet-500 h-full rounded-full" style="width:${(this.xp%500)/5}%"></div></div>
            <div class="text-[9px] text-slate-600 mt-1">${this.xp%500}/500 XP zum nächsten Level</div>
        </div>

        ${Object.keys(this.topicResults).length?`
        <div class="card rounded-xl p-4 mb-6 anim" style="animation-delay:.2s">
            <div class="text-[9px] font-black text-slate-500 uppercase tracking-widest mb-3">Themen-Detail</div>
            ${Object.entries(this.topicResults).map(([t,s])=>{
                const tp=s.total>0?Math.round((s.correct/s.total)*100):0;
                const col=tp>=70?'bg-emerald-500':tp>=40?'bg-yellow-500':'bg-red-500';
                return `<div class="mb-2.5"><div class="flex justify-between text-[11px] mb-1"><span class="font-bold text-slate-300">${t.replace(/_/g,' ')}</span><span class="font-bold text-slate-500">${s.correct}/${s.total}</span></div><div class="w-full bg-white/5 rounded-full h-1"><div class="${col} h-full rounded-full" style="width:${tp}%"></div></div></div>`;
            }).join('')}
        </div>`:''}

        <div class="flex flex-col gap-2.5 anim" style="animation-delay:.25s">
            <button onclick="Arena.restart()" class="bg-violet-600 hover:bg-violet-500 text-white py-3.5 rounded-xl font-black text-xs uppercase tracking-widest transition-all"><i class="fas fa-redo mr-2"></i>Nochmal (${this.mode})</button>
            <button onclick="Arena.goHome()" class="bg-slate-800 hover:bg-slate-700 text-white py-3.5 rounded-xl font-black text-xs uppercase tracking-widest transition-all"><i class="fas fa-home mr-2"></i>Zurück zur Arena</button>
        </div>`;
    },

    restart() { this.start(this.mode); },
    quit() { if(confirm('Session beenden?')) this.finish(); },
    goHome() { this.showScreen('home'); this.updateHomeStats(); this.renderMastery(); },

    // ═══════════════════════════════
    // HELPERS
    // ═══════════════════════════════
    showScreen(s) {
        ['home','game','results'].forEach(x=>document.getElementById(`screen-${x}`).classList.toggle('hidden',x!==s));
    },
    shuffle(a) { const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b; },
    fmt(t) { return (t||'').replace(/\*\*(.*?)\*\*/g,'<strong class="text-indigo-300">$1</strong>'); }
};

document.addEventListener('DOMContentLoaded',()=>Arena.init());
</script>
</body>
</html>
