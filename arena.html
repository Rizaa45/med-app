<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLM Arena</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        body{font-family:'Inter',sans-serif;background:#0a0a0f;color:#e2e8f0;overflow-x:hidden}

        /* Subtle animated gradient bg */
        .bg-glow{position:fixed;inset:0;z-index:0;pointer-events:none;
            background:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(99,102,241,.04),transparent),
                        radial-gradient(ellipse 60% 40% at 80% 100%,rgba(139,92,246,.03),transparent)}

        /* Glass card */
        .glass{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);
            backdrop-filter:blur(12px);border-radius:20px;transition:all .3s ease}

        /* Smooth page transitions */
        .screen{transition:opacity .3s ease,transform .3s ease}
        .screen.out{opacity:0;transform:translateY(10px);pointer-events:none}

        /* Fade in */
        @keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
        .fi{animation:fadeIn .4s ease-out both}

        /* XP float */
        @keyframes xpUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-60px) scale(1.3)}}
        .xp-fly{position:fixed;z-index:999;pointer-events:none;font-weight:900;animation:xpUp 1s ease-out forwards}

        /* Correct/Wrong pulse */
        @keyframes correctPulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.4)}70%{box-shadow:0 0 0 12px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
        @keyframes wrongPulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.4)}70%{box-shadow:0 0 0 12px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
        .pulse-ok{animation:correctPulse .6s ease-out}
        .pulse-no{animation:wrongPulse .6s ease-out}

        /* Pen canvas */
        .pen-area{touch-action:none;cursor:crosshair;background:
            linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),
            linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);
            background-size:24px 24px}

        /* Large S-Pen friendly input */
        .pen-input{font-size:18px!important;padding:16px!important;min-height:56px;
            line-height:1.6!important;letter-spacing:-.01em;
            -webkit-user-select:text;user-select:text}
        .pen-textarea{font-size:16px!important;padding:16px!important;min-height:140px;
            line-height:1.7!important;-webkit-user-select:text;user-select:text}

        /* Option buttons */
        .opt-btn{transition:all .2s ease}
        .opt-btn:active{transform:scale(.96)}
        .opt-btn.chosen{border-color:rgba(99,102,241,.5)!important;background:rgba(99,102,241,.08)!important}
        .opt-btn.correct{border-color:rgba(34,197,94,.5)!important;background:rgba(34,197,94,.06)!important}
        .opt-btn.wrong{border-color:rgba(239,68,68,.4)!important;background:rgba(239,68,68,.05)!important}

        /* Progress ring */
        .ring{transform:rotate(-90deg);transform-origin:50% 50%}

        /* Scrollbar */
        ::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:10px}

        /* Mode cards hover */
        .mode-card{transition:all .4s cubic-bezier(.22,1,.36,1)}
        .mode-card:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.1)}
        .mode-card:active{transform:translateY(-1px)}
    </style>
</head>
<body class="min-h-screen">
<div class="bg-glow"></div>

<!-- ══════════════════════════════════════════════ -->
<!-- HOME SCREEN                                    -->
<!-- ══════════════════════════════════════════════ -->
<div id="s-home" class="screen relative z-10 max-w-lg mx-auto px-5 py-8 min-h-screen">

    <!-- Top -->
    <div class="flex items-center justify-between mb-10 fi">
        <a href="index.html" class="w-10 h-10 rounded-2xl bg-white/5 flex items-center justify-center text-slate-500 hover:text-white hover:bg-white/10 transition-all">
            <i class="fas fa-chevron-left text-sm"></i>
        </a>
        <div class="text-center">
            <div class="font-black text-lg tracking-tight text-white">Arena</div>
        </div>
        <div class="flex items-center gap-1.5 bg-white/5 rounded-2xl px-3 py-2">
            <span class="text-sm">🔥</span>
            <span class="text-white font-black text-sm" id="home-streak">0</span>
        </div>
    </div>

    <!-- XP Card -->
    <div class="glass p-6 mb-8 fi" style="animation-delay:.08s">
        <div class="flex items-center justify-between">
            <div>
                <div class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1">Level <span id="home-lvl" class="text-violet-400">1</span></div>
                <div class="text-3xl font-black text-white"><span id="home-xp">0</span> <span class="text-base text-slate-500 font-bold">XP</span></div>
            </div>
            <div class="relative w-16 h-16">
                <svg class="w-16 h-16" viewBox="0 0 64 64">
                    <circle cx="32" cy="32" r="28" fill="none" stroke="rgba(255,255,255,.05)" stroke-width="4"/>
                    <circle id="home-ring" cx="32" cy="32" r="28" fill="none" stroke="#8b5cf6" stroke-width="4" class="ring"
                        stroke-dasharray="175.93" stroke-dashoffset="175.93" stroke-linecap="round"/>
                </svg>
                <div class="absolute inset-0 flex items-center justify-center">
                    <span id="home-ring-pct" class="text-[11px] font-black text-violet-400">0%</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Pen Mode Toggle -->
    <div class="flex items-center justify-between glass px-5 py-3 mb-6 fi" style="animation-delay:.1s">
        <div class="flex items-center gap-2.5">
            <i class="fas fa-pen-fancy text-violet-400"></i>
            <span class="text-sm font-bold text-white">S-Pen Modus</span>
        </div>
        <button id="pen-toggle" onclick="Arena.togglePen()" class="w-12 h-7 rounded-full bg-white/10 relative transition-all">
            <div id="pen-dot" class="w-5 h-5 rounded-full bg-slate-400 absolute top-1 left-1 transition-all"></div>
        </button>
    </div>

    <!-- Topic Filter -->
    <div class="mb-6 fi" style="animation-delay:.12s">
        <div class="flex items-center justify-between mb-3">
            <span class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Themen</span>
            <div class="flex gap-2">
                <button onclick="Arena.pickAll()" class="text-[10px] font-bold text-violet-400 hover:text-violet-300">Alle</button>
                <button onclick="Arena.pickNone()" class="text-[10px] font-bold text-slate-600 hover:text-slate-400">Keine</button>
            </div>
        </div>
        <div id="topic-list" class="flex flex-wrap gap-1.5"></div>
    </div>

    <!-- Mode Cards -->
    <div class="space-y-3 mb-10 fi" style="animation-delay:.15s">

        <button onclick="Arena.go('absorb')" class="mode-card glass w-full p-5 text-left flex items-center gap-4 group">
            <div class="w-12 h-12 rounded-2xl bg-indigo-500/10 flex items-center justify-center shrink-0 group-hover:scale-110 transition-transform">
                <i class="fas fa-eye text-indigo-400 text-lg"></i>
            </div>
            <div class="flex-1 min-w-0">
                <div class="font-black text-white text-sm uppercase tracking-tight">Absorb</div>
                <div class="text-[11px] text-slate-500 truncate">Lesen → Verstehen → Aus dem Gedächtnis schreiben</div>
            </div>
            <i class="fas fa-chevron-right text-slate-700 text-xs group-hover:text-indigo-400 transition-colors"></i>
        </button>

        <button onclick="Arena.go('recall')" class="mode-card glass w-full p-5 text-left flex items-center gap-4 group">
            <div class="w-12 h-12 rounded-2xl bg-orange-500/10 flex items-center justify-center shrink-0 group-hover:scale-110 transition-transform">
                <i class="fas fa-brain text-orange-400 text-lg"></i>
            </div>
            <div class="flex-1 min-w-0">
                <div class="font-black text-white text-sm uppercase tracking-tight">Recall</div>
                <div class="text-[11px] text-slate-500 truncate">Richtig/Falsch, Listen, Zuordnung — alles gemischt</div>
            </div>
            <i class="fas fa-chevron-right text-slate-700 text-xs group-hover:text-orange-400 transition-colors"></i>
        </button>

        <button onclick="Arena.go('connect')" class="mode-card glass w-full p-5 text-left flex items-center gap-4 group">
            <div class="w-12 h-12 rounded-2xl bg-emerald-500/10 flex items-center justify-center shrink-0 group-hover:scale-110 transition-transform">
                <i class="fas fa-link text-emerald-400 text-lg"></i>
            </div>
            <div class="flex-1 min-w-0">
                <div class="font-black text-white text-sm uppercase tracking-tight">Connect</div>
                <div class="text-[11px] text-slate-500 truncate">Begriffe und Definitionen als Paare verbinden</div>
            </div>
            <i class="fas fa-chevron-right text-slate-700 text-xs group-hover:text-emerald-400 transition-colors"></i>
        </button>

        <button onclick="Arena.go('sprint')" class="mode-card glass w-full p-5 text-left flex items-center gap-4 group">
            <div class="w-12 h-12 rounded-2xl bg-rose-500/10 flex items-center justify-center shrink-0 group-hover:scale-110 transition-transform">
                <i class="fas fa-bolt text-rose-400 text-lg"></i>
            </div>
            <div class="flex-1 min-w-0">
                <div class="font-black text-white text-sm uppercase tracking-tight">Sprint</div>
                <div class="text-[11px] text-slate-500 truncate">30 Sekunden pro Frage. Wie viele schaffst du?</div>
            </div>
            <i class="fas fa-chevron-right text-slate-700 text-xs group-hover:text-rose-400 transition-colors"></i>
        </button>

        <div id="weak-btn" class="hidden">
            <button onclick="Arena.goWeak()" class="mode-card glass w-full p-5 text-left flex items-center gap-4 group border-red-500/20">
                <div class="w-12 h-12 rounded-2xl bg-red-500/10 flex items-center justify-center shrink-0 group-hover:scale-110 transition-transform">
                    <i class="fas fa-crosshairs text-red-400 text-lg"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="font-black text-white text-sm uppercase tracking-tight">Schwächen <span id="weak-n" class="text-red-400 text-xs font-bold ml-1">3</span></div>
                    <div class="text-[11px] text-slate-500 truncate">Gezielt deine Klausur-Schwächen trainieren</div>
                </div>
                <i class="fas fa-chevron-right text-slate-700 text-xs group-hover:text-red-400 transition-colors"></i>
            </button>
        </div>

    </div>

    <!-- Mastery -->
    <div class="fi" style="animation-delay:.2s">
        <div class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-3">Fortschritt</div>
        <div id="mastery-bars" class="space-y-2.5"></div>
    </div>
</div>

<!-- ══════════════════════════════════════════════ -->
<!-- GAME SCREEN                                    -->
<!-- ══════════════════════════════════════════════ -->
<div id="s-game" class="screen out hidden relative z-10 min-h-screen">

    <!-- Top bar -->
    <div class="fixed top-0 left-0 right-0 z-50 bg-[#0a0a0f]/90 backdrop-blur-xl">
        <div class="max-w-lg mx-auto px-5 h-12 flex items-center justify-between">
            <button onclick="Arena.exit()" class="text-slate-600 hover:text-white transition-colors">
                <i class="fas fa-times"></i>
            </button>
            <div class="flex items-center gap-3">
                <span class="text-[9px] font-black text-slate-600 uppercase tracking-widest"><span id="g-n">1</span>/<span id="g-t">10</span></span>
                <div class="flex items-center gap-1"><span class="text-orange-400 text-sm">🔥</span><span id="g-s" class="text-white font-black text-sm">0</span></div>
            </div>
            <div id="g-combo" class="text-[10px] font-black text-slate-700 uppercase tracking-widest"></div>
        </div>
        <div class="h-[2px] bg-white/[.03]"><div id="g-bar" class="h-full bg-violet-500 transition-all duration-700" style="width:0%"></div></div>
    </div>

    <!-- Content -->
    <div class="pt-16 pb-20 px-5 max-w-lg mx-auto" id="g-c"></div>

    <!-- Bottom XP -->
    <div class="fixed bottom-0 left-0 right-0 z-50 bg-[#0a0a0f]/80 backdrop-blur-xl border-t border-white/[.03]">
        <div class="max-w-lg mx-auto px-5 h-10 flex items-center justify-center gap-2">
            <span class="text-indigo-400 text-xs font-bold">+<span id="g-xp">0</span> XP</span>
        </div>
    </div>
</div>

<!-- ══════════════════════════════════════════════ -->
<!-- RESULTS SCREEN                                 -->
<!-- ══════════════════════════════════════════════ -->
<div id="s-results" class="screen out hidden relative z-10 min-h-screen flex items-center justify-center px-5 py-10">
    <div id="r-c" class="w-full max-w-lg"></div>
</div>

<script>
// ══════════════════════════════════════════════════
// SLM ARENA v3 — CLEAN ENGINE
// ══════════════════════════════════════════════════
const Arena = {

    // State
    bank:[], qs:[], topics:[], sel:new Set(), penMode:false,
    mode:null, queue:[], idx:0, streak:0, best:0,
    xpSess:0, ok:0, tot:0, tRes:{}, sprintTimer:null,

    // Persistent
    get xp(){return +(localStorage.arena_xp||0)},
    set xp(v){localStorage.arena_xp=v},
    get lv(){return Math.floor(this.xp/500)+1},
    get mst(){return JSON.parse(localStorage.arena_mst||'{}')},
    set mst(v){localStorage.arena_mst=JSON.stringify(v)},
    get dstreak(){return +(localStorage.arena_ds||0)},

    // ── Init ──
    async init(){
        try{
            const r=await fetch('data/question-banks/module1_questions.json');
            this.bank=await r.json();
        }catch(e){console.error(e)}
        this.qs=this.bank.filter(i=>i.q_id);
        this.qs.forEach(q=>{if(q.fallabhaengig===undefined)q.fallabhaengig=false});
        const ts=new Set();this.qs.forEach(q=>{if(q.topic)ts.add(q.topic)});
        this.topics=[...ts].sort();this.sel=new Set(this.topics);

        // Pen mode from storage
        this.penMode=localStorage.arena_pen==='1';
        this.updatePenUI();

        this.renderTopics();this.renderHome();this.loadWeak();
    },

    // ── Home rendering ──
    renderHome(){
        const xp=this.xp,lv=this.lv,prog=(xp%500)/500;
        document.getElementById('home-xp').textContent=xp;
        document.getElementById('home-lvl').textContent=lv;
        document.getElementById('home-streak').textContent=this.dstreak;
        const circ=2*Math.PI*28;
        document.getElementById('home-ring').style.strokeDashoffset=circ-(prog*circ);
        document.getElementById('home-ring-pct').textContent=Math.round(prog*100)+'%';
        this.renderMastery();
    },

    renderTopics(){
        const names={'biografiearbeit':'Biografie','kommunikation_theorie':'Komm. Theorie',
            'kommunikation_praxis':'Komm. Praxis','pflegeprozess_aufnahme':'Aufnahme',
            'pflegeprozess':'Pflegeprozess','emotionspsychologie':'Emotionen',
            'supervision_beratung':'Supervision','beratung_supervision':'Beratung',
            'beratung_kollegial':'Kollegiale Ber.','heimaufnahme':'Heimaufnahme',
            'interkulturelle_kommunikation':'Interkulturell','burnout_praevention':'Burnout',
            'biografieforschung':'Bio-Forschung','reflexion_methodik':'Reflexion'};
        const el=document.getElementById('topic-list');
        el.innerHTML=this.topics.map(t=>{
            const n=names[t]||t.replace(/_/g,' ');const on=this.sel.has(t);
            return `<button onclick="Arena.togTopic('${t}')" class="px-3 py-1.5 rounded-xl text-[11px] font-bold border transition-all ${on?'bg-violet-500/10 text-violet-300 border-violet-500/25':'bg-white/[.02] text-slate-600 border-white/[.04] hover:border-white/10'}">${n}</button>`;
        }).join('');
    },

    renderMastery(){
        const m=this.mst;
        const show=['biografiearbeit','kommunikation_theorie','kommunikation_praxis',
            'pflegeprozess_aufnahme','emotionspsychologie','supervision_beratung','heimaufnahme'];
        const names={'biografiearbeit':'Biografie','kommunikation_theorie':'Komm. Theorie',
            'kommunikation_praxis':'Komm. Praxis','pflegeprozess_aufnahme':'Pflegeprozess',
            'emotionspsychologie':'Emotionen','supervision_beratung':'Supervision','heimaufnahme':'Heimaufnahme'};
        document.getElementById('mastery-bars').innerHTML=show.map(t=>{
            const p=Math.min(m[t]||0,100);
            const c=p>=75?'bg-emerald-500':p>=45?'bg-amber-500':'bg-white/10';
            return `<div><div class="flex justify-between mb-1"><span class="text-[11px] font-bold text-slate-400">${names[t]||t}</span><span class="text-[11px] font-bold ${p>=75?'text-emerald-400':p>=45?'text-amber-400':'text-slate-600'}">${p}%</span></div><div class="w-full h-1 bg-white/[.04] rounded-full"><div class="${c} h-full rounded-full transition-all" style="width:${p}%"></div></div></div>`;
        }).join('');
    },

    loadWeak(){
        const h=JSON.parse(localStorage.slm_exam_history||'[]');
        const l=h.filter(x=>x.module===1).pop();
        if(!l||!l.topicScores)return;
        const w=Object.entries(l.topicScores).filter(([,s])=>s.possible>0&&s.earned/s.possible<.6).map(([t])=>t);
        if(!w.length)return;this._weak=w;
        document.getElementById('weak-btn').classList.remove('hidden');
        document.getElementById('weak-n').textContent=w.length;
    },

    // ── Toggles ──
    togTopic(t){if(this.sel.has(t))this.sel.delete(t);else this.sel.add(t);this.renderTopics()},
    pickAll(){this.sel=new Set(this.topics);this.renderTopics()},
    pickNone(){this.sel.clear();this.renderTopics()},

    togglePen(){
        this.penMode=!this.penMode;
        localStorage.arena_pen=this.penMode?'1':'0';
        this.updatePenUI();
    },
    updatePenUI(){
        const dot=document.getElementById('pen-dot');
        const tog=document.getElementById('pen-toggle');
        if(this.penMode){
            dot.style.left='26px';dot.className='w-5 h-5 rounded-full bg-violet-400 absolute top-1 transition-all';
            tog.className='w-12 h-7 rounded-full bg-violet-500/30 relative transition-all';
        }else{
            dot.style.left='4px';dot.className='w-5 h-5 rounded-full bg-slate-500 absolute top-1 transition-all';
            tog.className='w-12 h-7 rounded-full bg-white/10 relative transition-all';
        }
    },

    // ── Start ──
    go(mode){
        if(!this.sel.size){alert('Wähle mindestens ein Thema.');return}
        this.mode=mode;this.idx=0;this.streak=0;this.best=0;this.xpSess=0;this.ok=0;this.tot=0;this.tRes={};
        const pool=this.qs.filter(q=>this.sel.has(q.topic));
        if(!pool.length){alert('Keine Fragen verfügbar.');return}
        this.queue=this.shuf(pool).slice(0,10);
        this.show('game');
        document.getElementById('g-t').textContent=this.queue.length;
        this.play();
    },
    goWeak(){if(this._weak){this.sel=new Set(this._weak);this.renderTopics();this.go('recall')}},

    // ── Play current ──
    play(){
        const q=this.queue[this.idx];if(!q){this.end();return}
        document.getElementById('g-n').textContent=this.idx+1;
        document.getElementById('g-bar').style.width=(this.idx/this.queue.length*100)+'%';
        document.getElementById('g-s').textContent=this.streak;
        document.getElementById('g-xp').textContent=this.xpSess;
        this.combo();
        const C=document.getElementById('g-c');
        const tp=(q.topic||'').replace(/_/g,' ');

        if(this.mode==='absorb') this.mAbsorb(q,C,tp);
        else if(this.mode==='connect') this.mConnect(q,C,tp);
        else if(this.mode==='sprint') this.mSprint(q,C,tp);
        else this.mRecall(q,C,tp);

        window.scrollTo({top:0,behavior:'smooth'});
    },

    // ═══════════════════════════
    // MODE: ABSORB
    // ═══════════════════════════
    mAbsorb(q,C,tp){
        const d=q.data||{},ans=d.correct_answer||d.definition_correct||q.correct_answers?.join(', ')||'',
              kw=d.keywords||d.definition_keywords||[];
        C.innerHTML=`
        <div class="fi">
            <div class="text-center mb-5"><span class="text-[9px] font-black text-indigo-400/60 uppercase tracking-[.3em]">${tp}</span></div>
            <div id="ab1">
                <div class="glass p-6 mb-5">
                    <div class="text-sm font-bold text-white leading-relaxed mb-5">${this.fmt(q.instruction||q.statement||'')}</div>
                    <div class="bg-indigo-500/[.04] border border-indigo-500/10 rounded-2xl p-5">
                        <div class="text-[9px] font-black text-indigo-400/50 uppercase tracking-widest mb-2">Musterantwort</div>
                        <div class="text-slate-300 text-[13px] leading-relaxed">${ans}</div>
                    </div>
                    ${kw.length?`<div class="flex flex-wrap gap-1 mt-4">${kw.map(k=>`<span class="text-[10px] font-bold text-violet-300/40 bg-violet-500/[.04] px-2 py-0.5 rounded-lg">${k}</span>`).join('')}</div>`:''}
                </div>
                <button onclick="Arena.ab2()" class="w-full py-4 rounded-2xl font-black text-sm uppercase tracking-widest bg-indigo-500 hover:bg-indigo-400 text-white transition-all">Verstanden — Abfragen</button>
            </div>
            <div id="ab2" class="hidden"></div>
            <div id="ab3" class="hidden"></div>
        </div>`;
    },

    ab2(){
        const q=this.queue[this.idx];
        document.getElementById('ab1').classList.add('hidden');
        const el=document.getElementById('ab2');el.classList.remove('hidden');
        el.innerHTML=`<div class="fi">
            <div class="glass p-6 mb-5">
                <div class="text-[9px] font-black text-orange-400/60 uppercase tracking-[.2em] mb-3">Aus dem Gedächtnis</div>
                <div class="text-sm font-bold text-white leading-relaxed mb-4">${this.fmt(q.instruction||'')}</div>
                ${this.inputField('ab-ans',true)}
            </div>
            <button onclick="Arena.ab3()" class="w-full py-4 rounded-2xl font-black text-sm uppercase tracking-widest bg-orange-500 hover:bg-orange-400 text-white transition-all">Prüfen</button>
        </div>`;
        this.focusInput('ab-ans');
    },

    ab3(){
        const q=this.queue[this.idx],d=q.data||{},
              kw=d.keywords||d.definition_keywords||[],
              ans=d.correct_answer||d.definition_correct||'',
              user=this.getInput('ab-ans');
        let hit=0;kw.forEach(k=>{if(user.toLowerCase().includes(k.toLowerCase()))hit++});
        const pct=kw.length?Math.round(hit/kw.length*100):0,xp=Math.round(pct/10)*5;
        this.pts(pct>=50,xp,q.topic);

        document.getElementById('ab2').classList.add('hidden');
        const el=document.getElementById('ab3');el.classList.remove('hidden');
        el.innerHTML=`<div class="fi">
            <div class="glass p-6 mb-5 text-center">
                <div class="text-4xl mb-2">${pct>=70?'🔥':pct>=40?'💪':'📖'}</div>
                <div class="text-2xl font-black ${pct>=70?'text-emerald-400':pct>=40?'text-amber-400':'text-red-400'}">${pct}%</div>
                <div class="text-xs text-slate-600 mb-4">${hit}/${kw.length} Keywords • +${xp} XP</div>
                <div class="flex flex-wrap gap-1 justify-center mb-4">${kw.map(k=>{const h=user.toLowerCase().includes(k.toLowerCase());return`<span class="text-[10px] font-bold px-2 py-0.5 rounded ${h?'bg-emerald-500/10 text-emerald-400':'bg-white/[.03] text-slate-600'}">${h?'✓':'✗'} ${k}</span>`}).join('')}</div>
                <details><summary class="text-[10px] font-bold text-violet-400/60 uppercase tracking-widest cursor-pointer">Musterantwort</summary><p class="text-slate-500 text-xs mt-2 text-left leading-relaxed">${ans}</p></details>
            </div>
            <button onclick="Arena.nxt()" class="w-full py-4 rounded-2xl font-black text-sm uppercase tracking-widest bg-white/[.05] hover:bg-white/[.08] text-white transition-all">Weiter</button>
        </div>`;
    },

    // ═══════════════════════════
    // MODE: RECALL
    // ═══════════════════════════
    mRecall(q,C,tp){
        if(q.type==='richtig_falsch')this.rRF(q,C,tp);
        else if(q.type==='nennen_liste')this.rList(q,C,tp);
        else if(q.type==='zuordnung')this.rZu(q,C,tp);
        else this.rFrei(q,C,tp);
    },

    rRF(q,C,tp){
        const ss=q.statements||(q.data?.statements)||[{text:q.statement,answer:q.answer}];
        const s=ss[Math.floor(Math.random()*ss.length)];
        C.innerHTML=`<div class="fi">
            <div class="text-center mb-5"><span class="text-[9px] font-black text-orange-400/60 uppercase tracking-[.3em]">${tp}</span></div>
            <div class="glass p-6 mb-5" id="rf-card">
                <div class="text-[10px] font-bold text-slate-600 uppercase tracking-widest mb-3">Richtig oder Falsch?</div>
                <div class="text-[15px] font-semibold text-white leading-relaxed">"${s.text}"</div>
            </div>
            <div class="grid grid-cols-2 gap-3" id="rf-btns">
                <button onclick="Arena.rfChk(true,'${s.answer}')" class="opt-btn glass py-5 rounded-2xl text-center font-black text-white uppercase text-sm hover:border-emerald-500/30">
                    <i class="fas fa-check text-emerald-400 text-lg mb-1 block"></i>Richtig
                </button>
                <button onclick="Arena.rfChk(false,'${s.answer}')" class="opt-btn glass py-5 rounded-2xl text-center font-black text-white uppercase text-sm hover:border-red-500/30">
                    <i class="fas fa-times text-red-400 text-lg mb-1 block"></i>Falsch
                </button>
            </div>
            <div id="rf-fb" class="hidden mt-5"></div>
        </div>`;
    },

    rfChk(isR,cor){
        const ok=(isR?'richtig':'falsch')===cor,xp=ok?15:0,q=this.queue[this.idx];
        this.pts(ok,xp,q.topic);
        document.getElementById('rf-card').classList.add(ok?'pulse-ok':'pulse-no');
        document.getElementById('rf-btns').style.pointerEvents='none';
        const fb=document.getElementById('rf-fb');fb.classList.remove('hidden');
        fb.innerHTML=`<div class="fi">
            <div class="glass p-5 ${ok?'border-emerald-500/15':'border-red-500/15'} mb-4 flex items-center gap-3">
                <span class="text-xl">${ok?'✅':'❌'}</span>
                <div class="flex-1"><div class="font-black text-white text-sm">${ok?'Richtig!':'Falsch!'}</div><div class="text-[11px] text-slate-500">${q.explanation||'Antwort: '+cor}</div></div>
                ${xp?`<span class="text-indigo-400 font-bold text-xs">+${xp}</span>`:''}
            </div>
            <button onclick="Arena.nxt()" class="w-full py-4 rounded-2xl font-black text-sm uppercase tracking-widest bg-white/[.05] hover:bg-white/[.08] text-white transition-all">Weiter</button>
        </div>`;
    },

    rList(q,C,tp){
        const n=q.count||q.data?.count||3,lab=q.list_label||q.data?.list_label||'';
        C.innerHTML=`<div class="fi">
            <div class="text-center mb-5"><span class="text-[9px] font-black text-orange-400/60 uppercase tracking-[.3em]">${tp}</span></div>
            <div class="glass p-6 mb-5">
                <div class="text-sm font-bold text-white leading-relaxed mb-5">${this.fmt(q.instruction)}</div>
                ${lab?`<div class="text-[10px] font-bold text-slate-500 mb-2">${lab}</div>`:''}
                <div class="space-y-2">${Array.from({length:n},(_,i)=>`
                    <div class="flex items-center gap-2">
                        <span class="w-6 h-6 rounded-lg bg-white/[.03] flex items-center justify-center text-slate-600 text-[10px] font-black shrink-0">${i+1}</span>
                        ${this.inputField('li-'+i,false)}
                    </div>`).join('')}
                </div>
            </div>
            <button onclick="Arena.liChk(${n})" class="w-full py-4 rounded-2xl font-black text-sm uppercase tracking-widest bg-orange-500 hover:bg-orange-400 text-white transition-all">Prüfen</button>
            <div id="li-fb" class="hidden mt-5"></div>
        </div>`;
        this.focusInput('li-0');
    },

    liChk(n){
        const q=this.queue[this.idx],
              valid=q.all_valid_answers||q.data?.all_valid_answers||q.correct_answers||q.data?.correct_answers||[],
              cor=q.correct_answers||q.data?.correct_answers||[];
        let hit=0;const used=new Set();
        for(let i=0;i<n;i++){
            const v=this.getInput('li-'+i);
            if(v){const m=valid.find((a,ai)=>!used.has(ai)&&v.toLowerCase().includes(a.toLowerCase().substring(0,Math.min(4,a.length))));if(m){hit++;used.add(valid.indexOf(m))}}
        }
        const xp=hit*10;this.pts(hit>=Math.ceil(n/2),xp,q.topic);
        const fb=document.getElementById('li-fb');fb.classList.remove('hidden');
        fb.innerHTML=`<div class="fi">
            <div class="glass p-5 mb-4 text-center">
                <div class="text-2xl font-black ${hit>=Math.ceil(n/2)?'text-emerald-400':'text-red-400'}">${hit}/${n}</div>
                <div class="text-xs text-indigo-400 font-bold">+${xp} XP</div>
                <div class="flex flex-wrap gap-1 justify-center mt-3">${cor.map(c=>`<span class="text-[10px] font-bold bg-emerald-500/10 text-emerald-400/70 px-2 py-0.5 rounded">${c}</span>`).join('')}</div>
            </div>
            <button onclick="Arena.nxt()" class="w-full py-4 rounded-2xl font-black text-sm uppercase tracking-widest bg-white/[.05] hover:bg-white/[.08] text-white transition-all">Weiter</button>
        </div>`;
    },

    rZu(q,C,tp){
        const d=q.data||{},ss=d.statements||[],leg=d.legend||{},opts=Object.keys(leg),sh=[...ss].sort(()=>Math.random()-.5);
        C.innerHTML=`<div class="fi">
            <div class="text-center mb-5"><span class="text-[9px] font-black text-orange-400/60 uppercase tracking-[.3em]">${tp}</span></div>
            <div class="glass p-6 mb-5">
                <div class="text-sm font-bold text-white leading-relaxed mb-4">${this.fmt(q.instruction)}</div>
                <div class="flex flex-wrap gap-2 mb-5">${Object.entries(leg).map(([k,v])=>`<span class="text-[11px] font-bold text-indigo-300/60"><b class="text-white/80">${k}</b>=${v}</span>`).join('')}</div>
                <div class="space-y-2">${sh.map((s,i)=>`
                    <div class="flex items-center gap-2 bg-white/[.02] rounded-xl p-3 border border-white/[.03]">
                        <select id="zu-${i}" class="w-12 bg-white/[.06] border border-white/[.08] rounded-lg px-1 py-2 text-white font-black text-center text-sm outline-none focus:border-violet-500 shrink-0 appearance-none cursor-pointer">
                            <option value="">–</option>${opts.map(o=>`<option value="${o}">${o}</option>`).join('')}
                        </select>
                        <span class="text-slate-400 text-[12px] flex-1 leading-relaxed">${s.text}</span>
                    </div>`).join('')}
                </div>
            </div>
            <button onclick="Arena.zuChk(${JSON.stringify(sh).replace(/"/g,'&quot;')})" class="w-full py-4 rounded-2xl font-black text-sm uppercase tracking-widest bg-orange-500 hover:bg-orange-400 text-white transition-all">Prüfen</button>
            <div id="zu-fb" class="hidden mt-5"></div>
        </div>`;
    },

    zuChk(ss){
        let hit=0;ss.forEach((s,i)=>{if(document.getElementById('zu-'+i).value===s.answer)hit++});
        const xp=hit*12;this.pts(hit>=Math.ceil(ss.length/2),xp,this.queue[this.idx].topic);
        document.getElementById('zu-fb').classList.remove('hidden');
        document.getElementById('zu-fb').innerHTML=`<div class="fi"><div class="glass p-5 mb-4 text-center"><div class="text-2xl font-black ${hit>=Math.ceil(ss.length/2)?'text-emerald-400':'text-red-400'}">${hit}/${ss.length}</div><div class="text-xs text-indigo-400 font-bold">+${xp} XP</div></div><button onclick="Arena.nxt()" class="w-full py-4 rounded-2xl font-black text-sm uppercase tracking-widest bg-white/[.05] hover:bg-white/[.08] text-white transition-all">Weiter</button></div>`;
    },

    rFrei(q,C,tp){
        const d=q.data||{};
        C.innerHTML=`<div class="fi">
            <div class="text-center mb-5"><span class="text-[9px] font-black text-orange-400/60 uppercase tracking-[.3em]">${tp}</span></div>
            <div class="glass p-6 mb-5">
                <div class="text-sm font-bold text-white leading-relaxed mb-5">${this.fmt(q.instruction||'')}</div>
                ${this.inputField('fr-ans',true)}
            </div>
            <button onclick="Arena.frChk()" class="w-full py-4 rounded-2xl font-black text-sm uppercase tracking-widest bg-orange-500 hover:bg-orange-400 text-white transition-all">Prüfen</button>
            <div id="fr-fb" class="hidden mt-5"></div>
        </div>`;
        this.focusInput('fr-ans');
    },

    frChk(){
        const q=this.queue[this.idx],d=q.data||{},
              kw=d.keywords||d.definition_keywords||[],
              ans=d.correct_answer||d.definition_correct||'',
              user=this.getInput('fr-ans');
        let hit=0;kw.forEach(k=>{if(user.toLowerCase().includes(k.toLowerCase()))hit++});
        const pct=kw.length?Math.round(hit/kw.length*100):0,xp=Math.round(pct/10)*5;
        this.pts(pct>=50,xp,q.topic);
        document.getElementById('fr-fb').classList.remove('hidden');
        document.getElementById('fr-fb').innerHTML=`<div class="fi"><div class="glass p-5 mb-4 text-center">
            <div class="text-2xl font-black ${pct>=60?'text-emerald-400':pct>=30?'text-amber-400':'text-red-400'}">${pct}%</div>
            <div class="text-xs text-indigo-400 font-bold mb-3">+${xp} XP</div>
            <div class="flex flex-wrap gap-1 justify-center mb-3">${kw.map(k=>{const h=user.toLowerCase().includes(k.toLowerCase());return`<span class="text-[10px] font-bold px-2 py-0.5 rounded ${h?'bg-emerald-500/10 text-emerald-400':'bg-white/[.02] text-slate-700'}">${h?'✓':'✗'} ${k}</span>`}).join('')}</div>
            <details><summary class="text-[10px] font-bold text-violet-400/50 cursor-pointer uppercase tracking-widest">Antwort</summary><p class="text-slate-500 text-xs mt-2 text-left">${ans}</p></details>
        </div><button onclick="Arena.nxt()" class="w-full py-4 rounded-2xl font-black text-sm uppercase tracking-widest bg-white/[.05] hover:bg-white/[.08] text-white transition-all">Weiter</button></div>`;
    },

    // ═══════════════════════════
    // MODE: CONNECT (pair match)
    // ═══════════════════════════
    mConnect(q,C,tp){
        let pairs=[];
        if(q.type==='zuordnung'&&q.data?.legend&&q.data?.statements){
            pairs=q.data.statements.slice(0,4).map(s=>({a:q.data.legend[s.answer]||s.answer,b:s.text.substring(0,50)}));
        }else if(q.correct_answers){
            pairs=q.correct_answers.slice(0,4).map((a,i)=>({a,b:'Punkt '+(i+1)}));
        }
        if(pairs.length<2){this.mRecall(q,C,tp);return}

        this._cp=pairs;this._cm={};this._cs=null;
        const left=this.shuf([...pairs]),right=this.shuf([...pairs]);

        C.innerHTML=`<div class="fi">
            <div class="text-center mb-5"><span class="text-[9px] font-black text-emerald-400/60 uppercase tracking-[.3em]">${tp}</span></div>
            <div class="glass p-6 mb-5">
                <div class="text-[10px] font-bold text-slate-600 uppercase tracking-widest mb-4">Paare verbinden</div>
                <div class="grid grid-cols-2 gap-3">
                    <div class="space-y-2">${left.map((p,i)=>`<button id="cl-${i}" onclick="Arena.cSel('l',${i},'${p.a.replace(/'/g,"\\'")}')" class="opt-btn w-full glass p-3 rounded-xl text-left text-[12px] font-bold text-indigo-300/80">${p.a}</button>`).join('')}</div>
                    <div class="space-y-2">${right.map((p,i)=>`<button id="cr-${i}" onclick="Arena.cSel('r',${i},'${p.a.replace(/'/g,"\\'")}')" class="opt-btn w-full glass p-3 rounded-xl text-left text-[11px] text-slate-400">${p.b}</button>`).join('')}</div>
                </div>
            </div>
            <div id="c-fb" class="hidden"></div>
        </div>`;
    },

    cSel(side,i,key){
        if(side==='l'){
            document.querySelectorAll('[id^="cl-"]').forEach(b=>b.classList.remove('chosen'));
            document.getElementById('cl-'+i).classList.add('chosen');
            this._cs={i,key};
        }else if(this._cs){
            const ok=this._cs.key===key;
            const lb=document.getElementById('cl-'+this._cs.i),rb=document.getElementById('cr-'+i);
            if(ok){
                lb.classList.add('correct','pointer-events-none','opacity-40');lb.classList.remove('chosen');
                rb.classList.add('correct','pointer-events-none','opacity-40');
                this._cm[key]=1;
                if(Object.keys(this._cm).length===this._cp.length)setTimeout(()=>this.cDone(),300);
            }else{
                lb.classList.add('wrong');rb.classList.add('wrong');
                setTimeout(()=>{lb.classList.remove('wrong','chosen');rb.classList.remove('wrong')},400);
            }
            this._cs=null;
        }
    },

    cDone(){
        const n=this._cp.length,xp=n*12;this.pts(true,xp,this.queue[this.idx].topic);
        document.getElementById('c-fb').classList.remove('hidden');
        document.getElementById('c-fb').innerHTML=`<div class="fi"><div class="glass p-5 mb-4 text-center"><div class="text-3xl mb-1">🔗</div><div class="font-black text-white">${n} Paare verbunden</div><div class="text-xs text-indigo-400 font-bold">+${xp} XP</div></div><button onclick="Arena.nxt()" class="w-full py-4 rounded-2xl font-black text-sm uppercase tracking-widest bg-white/[.05] hover:bg-white/[.08] text-white transition-all">Weiter</button></div>`;
    },

    // ═══════════════════════════
    // MODE: SPRINT (timed)
    // ═══════════════════════════
    mSprint(q,C,tp){
        // Same as recall but with 30s timer
        if(this.sprintTimer)clearInterval(this.sprintTimer);
        let sec=30;
        C.innerHTML='';// Will be filled by recall, then timer added
        this.mRecall(q,C,tp);
        // Add timer overlay
        const timer=document.createElement('div');
        timer.id='sprint-timer';
        timer.className='fixed top-14 right-5 z-50 bg-rose-500/20 text-rose-400 font-black text-lg px-4 py-2 rounded-xl border border-rose-500/20';
        timer.textContent='30s';
        document.body.appendChild(timer);
        this.sprintTimer=setInterval(()=>{
            sec--;timer.textContent=sec+'s';
            if(sec<=5)timer.classList.add('animate-pulse');
            if(sec<=0){clearInterval(this.sprintTimer);timer.remove();this.pts(false,0,q.topic);this.nxt()}
        },1000);
    },

    // ═══════════════════════════
    // SCORING
    // ═══════════════════════════
    pts(ok,xp,topic){
        this.tot++;if(ok){this.ok++;this.streak++;if(this.streak>this.best)this.best=this.streak}else this.streak=0;
        const mul=this.streak>=10?3:this.streak>=7?2.5:this.streak>=5?2:this.streak>=3?1.5:1;
        const final=Math.round(xp*mul);
        this.xpSess+=final;this.xp+=final;
        if(topic){const m=this.mst;m[topic]=Math.round((m[topic]||0)*.7+(ok?100:0)*.3);this.mst=m;
            if(!this.tRes[topic])this.tRes[topic]={ok:0,tot:0};this.tRes[topic].tot++;if(ok)this.tRes[topic].ok++}
        if(final>0)this.flyXP(final);
        document.getElementById('g-s').textContent=this.streak;
        document.getElementById('g-xp').textContent=this.xpSess;
        this.combo();
    },

    flyXP(n){
        const el=document.createElement('div');el.className='xp-fly text-indigo-400';
        el.textContent='+'+n;el.style.left=(30+Math.random()*40)+'%';el.style.top='45%';
        document.body.appendChild(el);setTimeout(()=>el.remove(),1100);
    },

    combo(){
        const el=document.getElementById('g-combo'),s=this.streak;
        if(s>=10){el.textContent='GODLIKE ×3';el.style.color='#a855f7'}
        else if(s>=7){el.textContent='ULTRA ×2.5';el.style.color='#ef4444'}
        else if(s>=5){el.textContent='FIRE ×2';el.style.color='#f97316'}
        else if(s>=3){el.textContent='COMBO ×1.5';el.style.color='#a3e635'}
        else el.textContent='';
    },

    nxt(){
        if(this.sprintTimer){clearInterval(this.sprintTimer);document.getElementById('sprint-timer')?.remove()}
        this.idx++;this.idx>=this.queue.length?this.end():this.play();
    },

    exit(){if(confirm('Beenden?'))this.end()},

    // ═══════════════════════════
    // RESULTS
    // ═══════════════════════════
    end(){
        if(this.sprintTimer){clearInterval(this.sprintTimer);document.getElementById('sprint-timer')?.remove()}
        const today=new Date().toDateString(),last=localStorage.arena_last;
        let ds=this.dstreak;if(last!==today){ds++;localStorage.arena_ds=ds;localStorage.arena_last=today}

        this.show('results');
        const pct=this.tot?Math.round(this.ok/this.tot*100):0;
        document.getElementById('r-c').innerHTML=`
        <div class="text-center fi">
            <div class="text-5xl mb-4">${pct>=80?'🏆':pct>=60?'🔥':pct>=40?'💪':'📖'}</div>
            <div class="text-2xl font-black text-white tracking-tight mb-1">Session beendet</div>
            <div class="text-slate-600 text-sm mb-8">${this.mode?.toUpperCase()} • ${this.tot} Fragen</div>

            <div class="grid grid-cols-3 gap-3 mb-8">
                <div class="glass p-4 text-center"><div class="text-xl font-black text-indigo-400">${this.xpSess}</div><div class="text-[9px] text-slate-600 font-bold uppercase">XP</div></div>
                <div class="glass p-4 text-center"><div class="text-xl font-black text-emerald-400">${pct}%</div><div class="text-[9px] text-slate-600 font-bold uppercase">Richtig</div></div>
                <div class="glass p-4 text-center"><div class="text-xl font-black text-orange-400">${this.best}</div><div class="text-[9px] text-slate-600 font-bold uppercase">Streak</div></div>
            </div>

            <div class="glass p-4 mb-6 text-center">
                <div class="text-[9px] font-bold text-slate-600 uppercase tracking-widest mb-1">Level ${this.lv}</div>
                <div class="w-full h-1 bg-white/[.04] rounded-full"><div class="bg-violet-500 h-full rounded-full" style="width:${(this.xp%500)/5}%"></div></div>
                <div class="text-[9px] text-slate-700 mt-1">${this.xp%500}/500 XP</div>
            </div>

            ${Object.keys(this.tRes).length?`<div class="glass p-4 mb-6 text-left">
                <div class="text-[9px] font-bold text-slate-600 uppercase tracking-widest mb-3">Themen</div>
                ${Object.entries(this.tRes).map(([t,s])=>{const p=s.tot?Math.round(s.ok/s.tot*100):0;
                    return`<div class="flex justify-between items-center py-1.5 border-b border-white/[.03] last:border-0"><span class="text-[11px] font-bold text-slate-400">${t.replace(/_/g,' ')}</span><span class="text-[11px] font-bold ${p>=60?'text-emerald-400':'text-red-400'}">${s.ok}/${s.tot}</span></div>`}).join('')}
            </div>`:''}

            <div class="space-y-2">
                <button onclick="Arena.restart()" class="w-full py-4 rounded-2xl font-black text-sm uppercase tracking-widest bg-violet-500 hover:bg-violet-400 text-white transition-all">Nochmal</button>
                <button onclick="Arena.home()" class="w-full py-4 rounded-2xl font-black text-sm uppercase tracking-widest bg-white/[.05] hover:bg-white/[.08] text-white transition-all">Zurück</button>
            </div>
        </div>`;
    },

    restart(){this.go(this.mode)},
    home(){this.show('home');this.renderHome()},

    // ═══════════════════════════
    // INPUT FIELD (S-Pen aware)
    // ═══════════════════════════
    inputField(id, multi=false){
        if(this.penMode){
            // Large S-Pen friendly input — Samsung's built-in handwriting converts S-pen strokes to text
            if(multi){
                return `<textarea id="${id}" class="pen-textarea w-full bg-white/[.03] border-2 border-dashed border-violet-500/20 rounded-2xl text-white outline-none focus:border-violet-500/50 transition-all placeholder:text-slate-700" rows="5" placeholder="✏️ Mit S-Pen hier schreiben..." style="font-family:'Inter',sans-serif"></textarea>
                <div class="flex items-center gap-1.5 mt-1.5"><i class="fas fa-pen-fancy text-violet-400/30 text-[10px]"></i><span class="text-[10px] text-violet-400/30 font-bold">S-Pen Modus aktiv — direkt schreiben</span></div>`;
            }
            return `<input type="text" id="${id}" class="pen-input w-full bg-white/[.03] border-2 border-dashed border-violet-500/20 rounded-2xl text-white outline-none focus:border-violet-500/50 transition-all placeholder:text-slate-700" placeholder="✏️ Schreiben...">`;
        }
        if(multi){
            return `<textarea id="${id}" class="w-full bg-white/[.03] border border-white/[.06] rounded-xl p-4 text-white text-sm outline-none focus:border-violet-500/40 transition-all resize-none placeholder:text-slate-700" rows="4" placeholder="Antwort eingeben..."></textarea>`;
        }
        return `<input type="text" id="${id}" class="w-full bg-white/[.03] border border-white/[.06] rounded-xl px-4 py-3 text-white text-sm font-medium outline-none focus:border-violet-500/40 transition-all placeholder:text-slate-700" placeholder="...">`;
    },

    getInput(id){return(document.getElementById(id)?.value||'').trim()},
    focusInput(id){setTimeout(()=>document.getElementById(id)?.focus(),150)},

    // ═══════════════════════════
    // HELPERS
    // ═══════════════════════════
    show(s){
        ['home','game','results'].forEach(x=>{
            const el=document.getElementById('s-'+x);
            if(x===s){el.classList.remove('hidden','out');el.style.display=''}
            else{el.classList.add('out');setTimeout(()=>el.classList.add('hidden'),300)}
        });
    },
    shuf(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b},
    fmt(t){return(t||'').replace(/\*\*(.*?)\*\*/g,'<strong class="text-indigo-300/80">$1</strong>')}
};

document.addEventListener('DOMContentLoaded',()=>Arena.init());
</script>
</body>
</html>
