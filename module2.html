<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLM System | Modul 2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background: #fcfdfe; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .unit-content { max-height: 0; overflow: hidden; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .unit-content.open { max-height: 2000px; padding-bottom: 24px; }
    </style>
</head>
<body class="min-h-screen">

    <nav class="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 h-20 flex items-center justify-between">
            <button onclick="location.href='index.html'" class="group flex items-center text-slate-500 hover:text-indigo-600 font-semibold transition-all">
                <div class="p-2 rounded-full group-hover:bg-indigo-50 transition-all mr-2"><i class="fas fa-chevron-left"></i></div>
                <span class="text-sm uppercase tracking-wider">Dashboard</span>
            </button>
            <div class="text-center">
                <span class="font-extrabold text-slate-900 text-lg uppercase tracking-tighter">Modul 2</span>
                <span class="block text-[9px] text-indigo-600 font-bold tracking-[0.3em] uppercase">Status: 8 Wochen bis Examen</span>
            </div>
            <div class="w-10"></div> </div>
    </nav>

    <div class="max-w-4xl mx-auto px-6 py-8">
        <div class="flex bg-slate-100 rounded-2xl p-1.5 shadow-inner mb-8 border border-slate-200">
            <button onclick="switchTab('inhalt')" id="tab-inhalt" class="flex-1 py-3 rounded-xl font-bold transition-all bg-white text-indigo-600 shadow-sm border border-slate-200/50">Lerninhalte</button>
            <button onclick="switchTab('quiz')" id="tab-quiz" class="flex-1 py-3 rounded-xl font-bold transition-all text-slate-500">Prüfungsvorbereitung</button>
        </div>

        <div id="section-inhalt" class="space-y-6 fade-in">
            <h2 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-4">Themen-Zusammenfassungen (JSON-Load)</h2>
            
            <div id="units-loader" class="space-y-4">
                <div class="flex flex-col items-center justify-center py-12 text-slate-300">
                    <i class="fas fa-circle-notch animate-spin text-2xl mb-4"></i>
                    <p class="text-xs font-bold uppercase tracking-widest">Lade Einheiten...</p>
                </div>
            </div>

            <div class="flex items-center gap-4 py-8">
                <div class="h-px flex-1 bg-slate-200"></div>
                <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Original Handouts</span>
                <div class="h-px flex-1 bg-slate-200"></div>
            </div>
            <div id="pdf-list" class="grid gap-3">
                <a href="pdfs/mod2/skript1.pdf" class="bg-white p-4 rounded-2xl border border-slate-200 flex items-center justify-between group hover:border-indigo-500 transition-all">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 bg-red-50 text-red-500 rounded-xl flex items-center justify-center"><i class="fas fa-file-pdf"></i></div>
                        <div><h4 class="text-sm font-bold text-slate-700">Skript: Gesamtes Modul 2</h4><p class="text-[10px] text-slate-400 uppercase">PDF Dokument</p></div>
                    </div>
                    <i class="fas fa-download text-slate-300 group-hover:text-indigo-500"></i>
                </a>
            </div>
        </div>

        <div id="section-quiz" class="hidden fade-in text-center py-20">
            <div class="bg-indigo-50 w-20 h-20 rounded-3xl flex items-center justify-center text-indigo-600 mx-auto mb-6">
                <i class="fas fa-lock text-3xl"></i>
            </div>
            <h3 class="text-xl font-black text-slate-900 uppercase">Prüfung folgt</h3>
            <p class="text-slate-500 text-sm max-w-xs mx-auto mt-2">Diese Funktion wird freigeschaltet, sobald wir die Fragen-Datenbank für Modul 2 erstellt haben.</p>
        </div>
    </div>

    <button onclick="toggleProdigy()" class="fixed bottom-8 right-8 w-16 h-16 bg-indigo-600 text-white rounded-3xl shadow-2xl flex items-center justify-center z-[100] hover:scale-110 transition-transform">
        <i class="fas fa-robot text-2xl"></i>
    </button>

    <script src="js/module2.js"></script>
</body>
</html>
