<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLM System | Modul 2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background: #fcfdfe; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen">
    <nav class="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 h-20 flex items-center justify-between">
            <button onclick="location.href='index.html'" class="group flex items-center text-slate-500 hover:text-indigo-600 font-semibold transition-all">
                <i class="fas fa-chevron-left mr-2"></i>
                <span class="text-sm uppercase tracking-wider">Dashboard</span>
            </button>
            <div class="text-center">
                <span id="mod-title" class="font-extrabold text-slate-900 text-lg uppercase tracking-tighter">Modul 2: Kernwissen</span>
                <p class="text-[9px] text-indigo-600 font-bold tracking-[0.3em] uppercase mt-1">SLM Core v.5.1</p>
            </div>
            <button onclick="location.href='vault.html'" class="p-2 text-slate-400 hover:text-indigo-600 transition-all">
                <i class="fas fa-thumbtack text-lg"></i>
            </button>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto px-6 py-8">
        <div class="flex bg-slate-100 rounded-2xl p-1.5 shadow-inner mb-8 border border-slate-200">
            <button onclick="switchTab('inhalt')" id="tab-inhalt" class="flex-1 py-3 rounded-xl font-bold transition-all duration-300 bg-white text-indigo-600 shadow-sm border border-slate-200/50">Lerninhalte</button>
            <button onclick="switchTab('quiz')" id="tab-quiz" class="flex-1 py-3 rounded-xl font-bold transition-all duration-300 text-slate-500">Prüfungsvorbereitung</button>
        </div>

        <div id="section-inhalt" class="space-y-6 fade-in">
            <div id="summary-dropdown-container"></div>
            
            <div id="summary-display-area" class="hidden"></div>
           
            <div class="flex items-center gap-4 py-4 mt-8">
                <div class="h-px flex-1 bg-slate-200"></div>
                <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Original Handouts</span>
                <div class="h-px flex-1 bg-slate-200"></div>
            </div>
           
            <div id="pdf-list" class="grid gap-4">
                <div class="p-5 bg-white rounded-2xl border border-slate-100 text-xs font-bold text-slate-400 text-center uppercase">Keine PDFs hinterlegt</div>
            </div>
        </div>

        <div id="section-quiz" class="hidden space-y-8 fade-in">
             <div class="text-center py-20 bg-white rounded-3xl border border-slate-100">
                <i class="fas fa-brain text-4xl text-indigo-200 mb-4"></i>
                <p class="font-bold text-slate-400 uppercase text-xs">Simulator in Vorbereitung</p>
             </div>
        </div>
    </div>

    <script>
        // Startet sofort, wenn das HTML geladen ist
        document.addEventListener('DOMContentLoaded', () => {
            console.log("Seite geladen. Erstelle Dropdown...");
            renderSummaryDropdown();
        });

        function renderSummaryDropdown() {
            const container = document.getElementById('summary-dropdown-container');
            if(!container) {
                console.error("Fehler: Dropdown-Container nicht im HTML gefunden!");
                return;
            }

            const summaries = [
                { id: "", name: "Wähle eine Lerneinheit..." },
                { id: "1", name: "1. Notfallmanagement & Erste Hilfe" },
                { id: "2", name: "2. Anatomie & Physiologie" },
                { id: "3", name: "3. Krankheitslehre" },
                { id: "4", name: "4. Pharmakologie Basis" },
                { id: "5", name: "5. Hygiene & Infektion" },
                { id: "6", name: "6. Dokumentation" }
            ];

            container.innerHTML = `
                <div class="relative w-full mb-6">
                    <select onchange="loadSummaryContent(this.value)" class="w-full p-4 bg-white border-2 border-indigo-100 rounded-2xl shadow-sm text-slate-700 font-bold focus:border-indigo-500 outline-none appearance-none cursor-pointer">
                        ${summaries.map(s => `<option value="${s.id}">${s.name}</option>`).join('')}
                    </select>
                    <div class="absolute right-5 top-1/2 -translate-y-1/2 pointer-events-none text-indigo-500">
                        <i class="fas fa-chevron-down"></i>
                    </div>
                </div>
            `;
            console.log("Dropdown erfolgreich erstellt.");
        }

        async function loadSummaryContent(num) {
            if(!num) return;
            const displayArea = document.getElementById('summary-display-area');
            displayArea.innerHTML = `<div class="p-16 text-center animate-pulse text-indigo-500 font-bold">Lade Experten-Inhalt...</div>`;
            displayArea.classList.remove('hidden');

            try {
                const url = `data/module2summariesunit${num}.json`;
                console.log("Lade JSON von URL:", url);
                
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`HTTP Error: ${response.status}`);
                }
                
                const data = await response.json();
                const unit = data[0]; // Dein JSON ist ein Array!

                displayArea.innerHTML = `
                    <div class="fade-in bg-white rounded-[2.5rem] shadow-xl border border-slate-100 overflow-hidden mb-10">
                        <div class="bg-indigo-600 p-8 text-white flex justify-between items-center">
                            <div>
                                <span class="text-indigo-200 text-xs font-black uppercase tracking-widest">Einheit ${num}</span>
                                <h2 class="text-2xl font-black">${unit.title}</h2>
                            </div>
                            <button onclick="closeSummary()" class="bg-white/20 hover:bg-white/40 p-3 rounded-full transition-all">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                        <div class="p-8 md:p-12 prose max-w-none">
                            ${unit.content}
                        </div>
                    </div>
                `;
                console.log("JSON erfolgreich geladen und angezeigt.");
            } catch (err) {
                console.error("Fehler beim Laden:", err);
                displayArea.innerHTML = `
                    <div class="p-10 text-red-500 bg-red-50 rounded-3xl border border-red-100 text-center">
                        <i class="fas fa-exclamation-triangle text-3xl mb-3"></i>
                        <p class="font-bold">Datei nicht gefunden</p>
                        <p class="text-xs mt-2 text-red-400">Prüfe, ob die Datei exakt "data/module2summariesunit${num}.json" heißt (alles klein geschrieben).</p>
                        <p class="text-xs mt-1 text-red-400">Systemmeldung: ${err.message}</p>
                    </div>`;
            }
        }

        function closeSummary() {
            document.getElementById('summary-display-area').classList.add('hidden');
        }

        function switchTab(tab) {
            document.getElementById('section-inhalt').classList.toggle('hidden', tab !== 'inhalt');
            document.getElementById('section-quiz').classList.toggle('hidden', tab !== 'quiz');
            
            const btnInhalt = document.getElementById('tab-inhalt');
            const btnQuiz = document.getElementById('tab-quiz');

            if(tab === 'inhalt') {
                btnInhalt.className = "flex-1 py-3 rounded-xl font-bold transition-all bg-white text-indigo-600 shadow-sm border border-slate-200/50";
                btnQuiz.className = "flex-1 py-3 rounded-xl font-bold transition-all text-slate-500";
            } else {
                btnQuiz.className = "flex-1 py-3 rounded-xl font-bold transition-all bg-white text-indigo-600 shadow-sm border border-slate-200/50";
                btnInhalt.className = "flex-1 py-3 rounded-xl font-bold transition-all text-slate-500";
            }
        }
    </script>
</body>
</html>
