<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLM System | Modul 2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background: #fcfdfe; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        #pin-btn { transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        
        .simulator-card {
            position: relative;
            overflow: hidden;
        }
        .simulator-card::after {
            content: '16 AUFGABEN';
            position: absolute;
            top: 12px;
            right: 12px;
            background: #f97316;
            color: white;
            font-size: 10px;
            font-weight: 900;
            padding: 2px 10px;
            border-radius: 9999px;
            letter-spacing: 0.5px;
            box-shadow: 0 10px 15px -3px rgb(249 115 22 / 0.3);
        }
    </style>
</head>
<body class="min-h-screen overflow-x-hidden">
   
    <nav class="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 h-20 flex items-center justify-between">
            <button onclick="location.href='index.html'" class="group flex items-center text-slate-500 hover:text-indigo-600 font-semibold transition-all">
                <div class="p-2 rounded-full group-hover:bg-indigo-50 transition-all mr-2">
                    <i class="fas fa-chevron-left"></i>
                </div>
                <span class="hidden sm:inline text-sm uppercase tracking-wider">Dashboard</span>
            </button>
            <div class="flex flex-col items-center text-center">
                <span id="mod-title" class="font-extrabold text-slate-900 text-lg uppercase tracking-tighter">Modul 2: Notfallmanagement & Erste Hilfe</span>
                <span class="text-[9px] text-indigo-600 font-bold tracking-[0.3em] uppercase mt-1">SLM Core v.5.3</span>
            </div>
            <button onclick="location.href='vault.html'" class="p-2 text-slate-400 hover:text-indigo-600 transition-all">
                <i class="fas fa-thumbtack text-lg"></i>
            </button>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto px-6 py-8">
        <div class="flex bg-slate-100 rounded-2xl p-1.5 shadow-inner mb-8 border border-slate-200">
            <button onclick="switchTab('inhalt')" id="tab-inhalt" class="flex-1 py-3 rounded-xl font-bold transition-all duration-300 bg-white text-indigo-600 shadow-sm border border-slate-200/50">Lerninhalte</button>
            <button onclick="switchTab('quiz')" id="tab-quiz" class="flex-1 py-3 rounded-xl font-bold transition-all duration-300 text-slate-500">Prüfungsvorbereitung</button>
        </div>

        <!-- LERNINHALTE - HIER KOMMEN DIE 6 UNITS ALS ACCORDION -->
        <div id="section-inhalt" class="space-y-8 fade-in">
            <div class="mb-6">
                <h2 class="text-xl font-black text-slate-800 mb-2">Zusammenfassungen der Lerneinheiten</h2>
                <p class="text-slate-500 text-sm">Klicke auf eine Unit, um die Premium-Zusammenfassung zu öffnen.</p>
            </div>
            
            <!-- ACCORDION CONTAINER (wird automatisch mit deinen 6 JSONs gefüllt) -->
            <div id="summary-dropdown-container" class="space-y-4"></div>

            <!-- PDFs später -->
            <div class="pt-8 border-t border-slate-200">
                <div class="flex items-center gap-4 py-4">
                    <div class="h-px flex-1 bg-slate-200"></div>
                    <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Original Handouts (kommen später)</span>
                    <div class="h-px flex-1 bg-slate-200"></div>
                </div>
                <div id="pdf-list" class="grid gap-4 text-slate-400 text-xs italic text-center py-8">
                    PDFs werden in Kürze hinzugefügt...
                </div>
            </div>
        </div>

        <!-- PRÜFUNGSVORBEREITUNG (unverändert) -->
        <div id="section-quiz" class="hidden space-y-8 fade-in">
            <!-- Dein kompletter Quiz-Bereich (wie zuvor) -->
            <div id="quiz-selection" class="space-y-6">
                <!-- ... (der gesamte Quiz-Selection Code aus deiner letzten Version) ... -->
            </div>
            <div id="quiz-container" class="hidden">
                <!-- ... (der gesamte Quiz-Container Code) ... -->
            </div>
        </div>
    </div>

    <!-- PRODIGY SIDEBAR (kopiere deinen vollständigen Sidebar hierher aus der alten Datei) -->
    <!-- ... dein ganzer Prodigy-Sidebar-Code ... -->

    <script src="module2.js"></script>
</body>
</html>
