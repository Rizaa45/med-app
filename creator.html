<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLM Synthesis | AI Document Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Playfair+Display:ital,wght@0,900;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background: #0f172a; font-family: 'Inter', sans-serif; color: #f8fafc; }
        
        /* A4 Paper Styling */
        .paper-preview {
            background: white;
            color: #1e293b;
            width: 210mm;
            min-height: 297mm;
            padding: 20mm;
            margin: 0 auto;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        .medical-header { border-left: 6px solid #6366f1; padding-left: 20px; }

        @media print {
            nav, .sidebar, .no-print { display: none !important; }
            body { background: white; padding: 0; }
            .paper-preview { box-shadow: none; margin: 0; width: 100%; border: none; padding: 15mm; }
            .page-break { page-break-before: always; }
        }

        .glow-button {
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
            transition: all 0.3s ease;
        }
        .glow-button:hover { box-shadow: 0 0 30px rgba(99, 102, 241, 0.5); transform: translateY(-2px); }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <nav class="h-20 border-b border-slate-800 bg-slate-900/80 backdrop-blur-xl flex items-center justify-between px-8 z-50 no-print">
        <div class="flex items-center gap-6">
            <button onclick="location.href='index.html'" class="text-slate-400 hover:text-white transition-all group">
                <i class="fas fa-arrow-left group-hover:-translate-x-1 mr-2"></i> Dashboard
            </button>
            <div class="h-6 w-px bg-slate-700"></div>
            <div class="leading-none">
                <span class="font-black tracking-tighter uppercase text-lg italic">SLM <span class="text-indigo-500">Synthesis</span></span>
                <p class="text-[8px] text-slate-500 font-bold tracking-[0.4em] uppercase">Document Engine v.1.0</p>
            </div>
        </div>
        <button onclick="window.print()" class="bg-white text-slate-900 px-8 py-2.5 rounded-full font-black text-xs uppercase tracking-widest hover:bg-indigo-500 hover:text-white transition-all shadow-xl">
            <i class="fas fa-file-pdf mr-2"></i> PDF Download
        </button>
    </nav>

    <div class="flex flex-1 overflow-hidden">
        
        <aside class="sidebar w-96 bg-slate-900 border-r border-slate-800 p-8 overflow-y-auto no-print">
            <div class="space-y-8">
                <div>
                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-4 block">1. Was möchtest du erstellen?</label>
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="setType('Handout')" id="btn-handout" class="type-btn p-4 bg-slate-800 border border-slate-700 rounded-2xl text-[10px] font-bold uppercase tracking-widest hover:border-indigo-500 transition-all border-indigo-500 text-indigo-400">Handout</button>
                        <button onclick="setType('Flyer')" id="btn-flyer" class="type-btn p-4 bg-slate-800 border border-slate-700 rounded-2xl text-[10px] font-bold uppercase tracking-widest hover:border-indigo-500 transition-all">Flyer</button>
                    </div>
                </div>

                <div>
                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-4 block">2. Thema & Details</label>
                    <div class="space-y-4">
                        <input type="text" id="topic" placeholder="Thema (z.B. Herzinsuffizienz)" class="w-full bg-slate-800 border border-slate-700 rounded-2xl p-4 text-sm outline-none focus:border-indigo-500">
                        <textarea id="question" rows="4" placeholder="Deine spezifische Frage oder Fokus-Punkte..." class="w-full bg-slate-800 border border-slate-700 rounded-2xl p-4 text-sm outline-none focus:border-indigo-500"></textarea>
                    </div>
                </div>

                <div>
                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-4 block">3. Team & Skripte</label>
                    <div class="flex items-center justify-between bg-slate-800 p-4 rounded-2xl border border-slate-700">
                        <span class="text-xs font-bold text-slate-400">Anzahl Personen:</span>
                        <div class="flex items-center gap-4">
                            <button onclick="updateTeam(-1)" class="w-8 h-8 rounded-lg bg-slate-700 hover:bg-indigo-600 transition-colors">-</button>
                            <span id="teamLabel" class="font-black text-indigo-400 w-4 text-center">1</span>
                            <button onclick="updateTeam(1)" class="w-8 h-8 rounded-lg bg-slate-700 hover:bg-indigo-600 transition-colors">+</button>
                        </div>
                    </div>
                </div>

                <button onclick="generateSynthesis()" id="genBtn" class="w-full bg-indigo-600 text-white font-black py-5 rounded-[2rem] glow-button uppercase tracking-[0.2em] text-xs flex items-center justify-center gap-3">
                    <i class="fas fa-wand-magic-sparkles"></i> Synthesis starten
                </button>
            </div>
        </aside>

        <main class="flex-1 overflow-y-auto bg-slate-950 p-12 scroll-smooth">
            <div id="output-area">
                <div class="paper-preview rounded-sm flex flex-col items-center justify-center text-slate-200">
                    <div class="w-20 h-20 bg-slate-50 rounded-full flex items-center justify-center mb-6">
                        <i class="fas fa-file-medical text-3xl text-slate-300"></i>
                    </div>
                    <p class="font-black uppercase tracking-widest text-xs opacity-40">Bereit für die Generierung</p>
                </div>
            </div>
            
            <div id="scripts-container" class="mt-12 max-w-[210mm] mx-auto pb-20"></div>
        </main>
    </div>

    <script>
        let currentType = "Handout";
        let teamSize = 1;

        function setType(type) {
            currentType = type;
            document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('border-indigo-500', 'text-indigo-400'));
            document.getElementById(`btn-${type.toLowerCase()}`).classList.add('border-indigo-500', 'text-indigo-400');
        }

        function updateTeam(val) {
            teamSize = Math.max(1, Math.min(6, teamSize + val));
            document.getElementById('teamLabel').innerText = teamSize;
        }

        async function generateSynthesis() {
            const topic = document.getElementById('topic').value;
            const question = document.getElementById('question').value;
            const btn = document.getElementById('genBtn');

            if(!topic) return alert("Bitte Thema eingeben!");

            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-circle-notch animate-spin"></i> Generiere...`;

            // Prompt Engineering für perfektes Design
            const finalPrompt = `
                Handle als medizinischer Redakteur. Erstelle ein professionelles ${currentType} zum Thema: "${topic}".
                Fokus: "${question}".

                Formatvorgabe:
                1. Dokumentteil (HTML): Nutze <h2> für Sektionen, <p> für Texte, <ul> für Listen. Füge am Ende wissenschaftliche Quellen hinzu.
                2. Skriptteil: Erstelle für ${teamSize} Personen individuelle Sprecher-Texte. Die Texte müssen "echt" klingen (z.B. "Hallo zusammen, ich übernehme den Teil X...").

                Antworte AUSSCHLIESSLICH im JSON-Format:
                {
                  "docHtml": "...",
                  "scripts": [{"p": 1, "txt": "..."}, ...]
                }
            `;

            try {
                const response = await fetch('/api/grade', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: finalPrompt })
                });

                const data = await response.json();
                // Gemini antwortet manchmal mit Markdown-Code-Blocks, die wir entfernen müssen
                const cleanJson = JSON.parse(data.text.replace(/```json|```/g, ''));
                
                renderResult(cleanJson, topic);
            } catch (error) {
                console.error(error);
                alert("Fehler bei der Kommunikation mit dem SLM-Core.");
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fas fa-wand-magic-sparkles"></i> Synthesis starten`;
            }
        }

        function renderResult(data, topic) {
            const output = document.getElementById('output-area');
            const scripts = document.getElementById('scripts-container');

            // Render Document
            output.innerHTML = `
                <div class="paper-preview fade-in">
                    <div class="flex justify-between items-start mb-12 border-b border-slate-100 pb-6">
                        <div>
                            <p class="text-indigo-600 font-black text-[10px] uppercase tracking-widest mb-1 italic">Clinical Protocol & Review</p>
                            <p class="text-slate-400 text-[9px] font-bold uppercase tracking-widest">Date: ${new Date().toLocaleDateString('de-DE')}</p>
                        </div>
                        <img src="https://api.qrserver.com/v1/create-qr-code/?size=50x50&data=${encodeURIComponent(topic)}" class="w-12 opacity-20">
                    </div>

                    <div class="medical-header mb-10">
                        <h1 class="font-['Playfair_Display'] text-5xl font-black text-slate-900 leading-none mb-2">${topic.toUpperCase()}</h1>
                        <p class="text-slate-400 text-sm font-medium italic">${currentType} für professionelles Pflegepersonal</p>
                    </div>

                    <div class="prose max-w-none text-slate-700 leading-relaxed">
                        ${data.docHtml}
                    </div>

                    <div class="mt-20 pt-8 border-t border-slate-50 flex justify-between items-center text-[8px] text-slate-300 font-bold uppercase tracking-widest">
                        <span>SLM SYSTEM • SYNTHESIS ENGINE</span>
                        <span>Page 01 / 01</span>
                    </div>
                </div>
            `;

            // Render Scripts
            scripts.innerHTML = `
                <div class="page-break no-print mt-20 mb-8 flex items-center gap-4">
                    <div class="h-px flex-1 bg-slate-800"></div>
                    <span class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Team Sprecher-Skripte</span>
                    <div class="h-px flex-1 bg-slate-800"></div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    ${data.scripts.map(s => `
                        <div class="bg-slate-900 border border-slate-800 p-8 rounded-[2.5rem] shadow-xl">
                            <div class="flex items-center gap-4 mb-4">
                                <span class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center font-black text-xs">P${s.p}</span>
                                <h4 class="text-xs font-black uppercase text-slate-400 tracking-widest italic">Sprecher-Skript</h4>
                            </div>
                            <p class="text-slate-300 text-sm italic leading-loose">
                                <i class="fas fa-quote-left text-indigo-500/30 mr-2 text-xl"></i>
                                ${s.txt}
                                <i class="fas fa-quote-right text-indigo-500/30 ml-2 text-xl"></i>
                            </p>
                        </div>
                    `).join('')}
                </div>
            `;
            
            output.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
