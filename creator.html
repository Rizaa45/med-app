<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLM Synthesis | Pro Document Engine v3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Playfair+Display:ital,wght@0,900;1,900&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background: #0f172a; font-family: 'Inter', sans-serif; color: #f8fafc; overflow-x: hidden; position: relative; }
        
        /* Hintergrund-Effekt */
        body::before {
            content: ""; position: fixed; inset: 0;
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCIgdmlld0JveD0iMCAwIDQwIDQwIj48ZyBmaWxsLXJ1bGU9ImV2ZW5vZGQiPjxnIGZpbGw9IiM0ZjQ2ZTUiIGZpbGwtb3BhY2l0eT0iMC4wNSI+PHBhdGggZD0iTTAgMGg0MHY0MEgwVjB6bTIwIDIwaDIwdjIwSDIWMjB6TTAgMjBoMjB2MjBIMFYyMHoyMCAwaDIwdjIwSDIwVjB6Ii8+PC9nPjwvZz48L3N2Zz4=');
            opacity: 0.3; z-index: -2;
        }

        .bg-glow-1 { position: fixed; top: -10%; left: -10%; width: 50%; height: 50%; background: radial-gradient(circle, rgba(79,70,229,0.15) 0%, rgba(15,23,42,0) 70%); filter: blur(100px); z-index: -1; }

        @media print {
            nav, .sidebar, .no-print, .edit-controls, #editor-toolbar { display: none !important; }
            body { background: white; padding: 0; color: black; }
            body::before, .bg-glow-1 { display: none !important; }
            .canvas-container { padding: 0 !important; background: transparent !important; }
            .document-page { box-shadow: none !important; margin: 0 !important; border: none !important; page-break-after: always; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; contenteditable: false !important; }
        }

        /* Presentation Style (16:9) */
        .page-presentation { aspect-ratio: 16/9; width: 100%; max-width: 1100px; background: white; color: #1e293b; margin: 0 auto 3rem; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); overflow: hidden; display: flex; flex-direction: column; position: relative; }
        /* Flyer Style (A4 Portrait) */
        .page-flyer { width: 210mm; min-height: 297mm; background: white; color: #1e293b; margin: 0 auto 3rem; padding: 20mm; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); position: relative; }

        /* contenteditable Styling */
        [contenteditable="true"] { border: 1px dashed transparent; transition: all 0.2s; cursor: text; outline: none; }
        [contenteditable="true"]:hover { border-color: #94a3b8; background: rgba(0,0,0,0.02); }
        [contenteditable="true"]:focus { border-color: #4f46e5; background: rgba(79,70,229,0.05); }

        .medical-border { border-left: 8px solid #4f46e5; padding-left: 1.5rem; }
        
        /* Editor Toolbar */
        #editor-toolbar { transition: opacity 0.2s; }
        .toolbar-btn { padding: 4px 10px; border-radius: 6px; transition: background 0.2s; }
        .toolbar-btn:hover { background: #334155; }
    </style>
    <style id="print-orientation"></style>
</head>
<body class="h-screen flex flex-col">
    <div class="bg-glow-1"></div>

    <div id="editor-toolbar" class="fixed top-24 left-1/2 transform -translate-x-1/2 bg-slate-800 border border-slate-700 shadow-2xl rounded-xl p-2 z-[100] flex items-center gap-2 opacity-0 pointer-events-none no-print">
        <select onchange="execCmd('fontName', this.value)" class="bg-slate-900 text-white text-sm rounded-lg p-2 border border-slate-700 outline-none">
            <option value="Inter">Inter</option>
            <option value="Playfair Display">Playfair</option>
            <option value="Roboto">Roboto</option>
            <option value="Arial">Arial</option>
        </select>
        <select onchange="execCmd('fontSize', this.value)" class="bg-slate-900 text-white text-sm rounded-lg p-2 border border-slate-700 outline-none">
            <option value="3">Größe Normal</option>
            <option value="1">Winzig</option>
            <option value="4">Mittel</option>
            <option value="5">Groß</option>
            <option value="6">Sehr Groß</option>
            <option value="7">Riesig</option>
        </select>
        <div class="w-px h-6 bg-slate-700 mx-1"></div>
        <button onclick="execCmd('bold')" class="toolbar-btn text-white font-bold"><i class="fas fa-bold"></i></button>
        <button onclick="execCmd('italic')" class="toolbar-btn text-white italic"><i class="fas fa-italic"></i></button>
        <button onclick="execCmd('underline')" class="toolbar-btn text-white underline"><i class="fas fa-underline"></i></button>
        <div class="w-px h-6 bg-slate-700 mx-1"></div>
        <input type="color" onchange="execCmd('foreColor', this.value)" class="w-8 h-8 rounded cursor-pointer bg-transparent border-none p-0">
    </div>

    <nav class="h-20 border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-50 no-print shrink-0">
        <div class="max-w-7xl mx-auto px-8 h-20 flex items-center justify-between">
            <button onclick="location.href='index.html'" class="text-slate-400 hover:text-white transition-all group font-bold">
                <i class="fas fa-arrow-left group-hover:-translate-x-1 mr-2"></i> Dashboard
            </button>
            <div class="leading-none text-center">
                <span class="font-black tracking-tighter uppercase text-xl italic">SLM <span class="text-indigo-500">Synthesis</span></span>
                <p class="text-[8px] text-slate-500 font-bold tracking-[0.4em] uppercase">Engine v3.0 | Edit Mode</p>
            </div>
            <button onclick="window.print()" class="bg-indigo-600 text-white px-8 py-2.5 rounded-full font-black text-xs uppercase tracking-widest hover:bg-indigo-500 transition-all shadow-xl">
                <i class="fas fa-file-pdf mr-2"></i> PDF Download
            </button>
        </div>
    </nav>

    <div class="flex flex-1 overflow-hidden">
        <aside class="sidebar w-[380px] bg-slate-900/90 border-r border-slate-800 flex flex-col no-print shrink-0 z-10">
            <div class="p-8 overflow-y-auto flex-1 space-y-8">
                <div>
                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-3 block">1. Format</label>
                    <div class="grid grid-cols-2 gap-3 bg-slate-800 p-1 rounded-2xl">
                        <button onclick="setType('presentation')" id="btn-presentation" class="py-3 text-[10px] font-black uppercase tracking-widest rounded-xl transition-all bg-indigo-600 text-white shadow-lg">Präsentation</button>
                        <button onclick="setType('flyer')" id="btn-flyer" class="py-3 text-[10px] font-black uppercase tracking-widest rounded-xl transition-all text-slate-400 hover:text-white">Flyer</button>
                    </div>
                </div>

                <div>
                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-3 block">2. Inhalt & Fokus</label>
                    <div class="space-y-3">
                        <input type="text" id="topic" placeholder="Thema (z.B. Schmerztherapie)" class="w-full bg-slate-800 border border-slate-700 rounded-2xl p-4 text-sm outline-none focus:border-indigo-500 text-white transition-all">
                        <textarea id="instructions" rows="3" placeholder="Fokus-Punkte oder Modifikationen..." class="w-full bg-slate-800 border border-slate-700 rounded-2xl p-4 text-sm outline-none focus:border-indigo-500 text-white transition-all"></textarea>
                    </div>
                </div>

                <div id="slide-count-container">
                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-3 flex justify-between">3. Slides: <span id="slide-label" class="text-indigo-400">5</span></label>
                    <input type="range" id="slideCount" min="3" max="15" value="5" oninput="document.getElementById('slide-label').innerText = this.value" class="w-full accent-indigo-500">
                </div>

                <div>
                    <div class="flex items-center justify-between mb-3">
                        <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest">4. Team</label>
                        <button onclick="addTeamMember()" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-indigo-400 px-3 py-1 rounded-lg font-bold"><i class="fas fa-plus"></i></button>
                    </div>
                    <div id="team-list" class="space-y-2">
                        <input type="text" placeholder="Name 1" class="team-name w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm text-white">
                    </div>
                </div>
            </div>
            
            <div class="p-8 border-t border-slate-800 bg-slate-900">
                <button onclick="generateDocument()" id="genBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black py-5 rounded-[2rem] shadow-[0_0_20px_rgba(79,70,229,0.4)] uppercase tracking-[0.2em] text-xs flex items-center justify-center gap-3 transition-all">
                    <i class="fas fa-wand-magic-sparkles"></i> Erstellen
                </button>
            </div>
        </aside>

        <main class="flex-1 overflow-y-auto bg-slate-950 p-8 md:p-12 scroll-smooth canvas-container relative" id="main-canvas">
            <div id="output-area">
                <div class="flex flex-col items-center justify-center h-[60vh] text-slate-400">
                    <i class="fas fa-pen-nib text-6xl mb-6 opacity-20"></i>
                    <p class="font-black uppercase tracking-widest text-xs opacity-50">Bereit für die Synthese</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        // --- Editor & UI Logic ---
        let currentType = "presentation";

        function setType(type) {
            currentType = type;
            const btnPres = document.getElementById('btn-presentation');
            const btnFlyer = document.getElementById('btn-flyer');
            const slideContainer = document.getElementById('slide-count-container');
            
            document.getElementById('print-orientation').innerHTML = type === 'presentation' ? `@media print { @page { size: landscape; margin: 0; } }` : `@media print { @page { size: portrait; margin: 0; } }`;
            
            if(type === 'presentation') {
                btnPres.className = "py-3 text-[10px] font-black uppercase tracking-widest rounded-xl transition-all bg-indigo-600 text-white shadow-lg";
                btnFlyer.className = "py-3 text-[10px] font-black uppercase tracking-widest rounded-xl transition-all text-slate-400 hover:text-white";
                slideContainer.style.display = "block";
            } else {
                btnFlyer.className = "py-3 text-[10px] font-black uppercase tracking-widest rounded-xl transition-all bg-indigo-600 text-white shadow-lg";
                btnPres.className = "py-3 text-[10px] font-black uppercase tracking-widest rounded-xl transition-all text-slate-400 hover:text-white";
                slideContainer.style.display = "none";
            }
        }

        function addTeamMember() {
            const list = document.getElementById('team-list');
            const row = document.createElement('div');
            row.className = 'flex gap-2 team-member-row';
            row.innerHTML = `<input type="text" placeholder="Name" class="team-name flex-1 bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm text-white">
                <button onclick="this.parentElement.remove()" class="bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white w-12 rounded-xl flex transiton-all items-center justify-center"><i class="fas fa-times"></i></button>`;
            list.appendChild(row);
        }

        // Toolbar Logic
        function execCmd(command, value = null) {
            document.execCommand(command, false, value);
        }

        document.addEventListener('focusin', (e) => {
            if(e.target.hasAttribute('contenteditable')) {
                document.getElementById('editor-toolbar').classList.remove('opacity-0', 'pointer-events-none');
            }
        });

        // Hide toolbar when clicking outside editable areas
        document.getElementById('main-canvas').addEventListener('mousedown', (e) => {
            if(!e.target.hasAttribute('contenteditable') && !e.target.closest('#editor-toolbar')) {
                document.getElementById('editor-toolbar').classList.add('opacity-0', 'pointer-events-none');
            }
        });

        // --- Bild Upload Logik ---
        function handleImageUpload(input, targetId) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById(targetId).setAttribute('src', e.target.result);
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        // --- AI Generation Logic ---
        async function generateDocument() {
            const topic = document.getElementById('topic').value;
            if(!topic) return alert("Bitte Thema eingeben!");
            const instructions = document.getElementById('instructions').value;
            const slideCount = document.getElementById('slideCount').value;
            const teamNames = Array.from(document.querySelectorAll('.team-name')).map(i => i.value.trim()).filter(i => i !== "");
            if(teamNames.length === 0) teamNames.push("Projekt-Team");
            
            const btn = document.getElementById('genBtn');
            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-circle-notch animate-spin"></i> Generiere...`;

            const finalPrompt = `
                Handle als medizinischer Redakteur. Erstelle ein professionelles ${currentType} zum Thema: "${topic}".
                Fokus: "${instructions || 'Keine'}".
                Team: ${teamNames.join(', ')}.
                ${currentType === 'presentation' ? `Erstelle ${slideCount} inhaltliche Sektionen.` : 'Erstelle 3 inhaltliche Sektionen.'}

                Antworte AUSSCHLIESSLICH als JSON-Objekt (ohne Markdown):
                {
                  "title": "Kurzer, knackiger Titel",
                  "subtitle": "Untertitel",
                  "pages": [
                    {
                      "title": "Überschrift",
                      "contentHtml": "Text mit <br>, <ul>, <li>, <strong>...",
                      "imageKeyword": "3 englische suchbegriffe (z.B. medical hospital nurse)",
                      "imageCaption": "Kurze Bildbeschreibung"
                    }
                  ],
                  "sources": ["Quelle 1", "Quelle 2"],
                  "scripts": [{"name": "Name", "text": "Fakten"}]
                }
            `;

            try {
                // Wir nutzen wieder deinen Standard-API Endpunkt für Text
                const response = await fetch('/api/grade', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: finalPrompt })
                });
                
                const rawData = await response.json();
                const jsonText = rawData.text.replace(/```json|```/g, '').trim();
                const cleanJson = JSON.parse(jsonText);
                renderResult(cleanJson, teamNames);

            } catch (error) {
                console.error(error);
                alert("Fehler bei der AI-Generierung. Bitte versuche es erneut.");
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fas fa-wand-magic-sparkles"></i> Erstellen`;
            }
        }

        function renderResult(data, teamNames) {
            const output = document.getElementById('output-area');
            let html = '';
            
            // --- 1. TITLE PAGE (Schriftgröße gefixed) ---
            html += generatePage(currentType, `
                <div class="h-full flex flex-col justify-center items-center text-center p-12 relative overflow-hidden bg-white">
                    <div class="relative z-10 w-full max-w-4xl">
                        <span contenteditable="true" class="inline-block px-4 py-1.5 rounded-full bg-indigo-100 text-indigo-800 font-black uppercase tracking-widest text-[10px] mb-6">Medizinisches Dokument</span>
                        
                        <h1 contenteditable="true" class="font-['Playfair_Display'] text-4xl md:text-5xl lg:text-6xl font-black text-slate-900 leading-tight mb-4 break-words">${data.title}</h1>
                        
                        <p contenteditable="true" class="text-xl text-slate-500 font-medium mb-12">${data.subtitle}</p>
                        
                        <div class="pt-8 border-t border-slate-200 flex flex-wrap justify-center gap-4">
                            ${teamNames.map(name => `<div contenteditable="true" class="bg-slate-100 text-slate-700 px-4 py-2 rounded-xl text-sm font-bold shadow-sm">${name}</div>`).join('')}
                        </div>
                    </div>
                </div>
            `);

            // --- 2. CONTENT PAGES ---
            data.pages.forEach((page, index) => {
                let imageBlock = '';
                
                if(page.imageKeyword) {
                    const uniqueId = `img-page-${index}`;
                    // Direkter HTML-Aufruf der Bild-API (Umgeht CORS Probleme vom Server)
                    const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(page.imageKeyword + ' professional medical')}?width=800&height=600&nologo=true`;

                    if(currentType === 'presentation') {
                        imageBlock = `
                            <div class="w-full md:w-5/12 h-64 md:h-full relative shrink-0 bg-slate-100 rounded-3xl border border-slate-200 overflow-hidden flex flex-col">
                                <img src="${imgUrl}" id="${uniqueId}" class="w-full h-full object-cover flex-1" onerror="this.src='https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=800&q=80'">
                                
                                <div class="absolute top-4 right-4 edit-controls">
                                    <button onclick="document.getElementById('${uniqueId}-input').click()" class="bg-indigo-600 hover:bg-indigo-700 text-white shadow-lg px-3 py-2 rounded-lg font-bold text-xs flex items-center gap-2">
                                        <i class="fas fa-upload"></i> Eigenes Bild
                                    </button>
                                    <input type="file" id="${uniqueId}-input" class="hidden" accept="image/*" onchange="handleImageUpload(this, '${uniqueId}')">
                                </div>
                                
                                <div class="p-3 bg-slate-800 text-white">
                                    <p contenteditable="true" class="text-[10px] tracking-widest uppercase font-bold text-center">${page.imageCaption || 'Illustration'}</p>
                                </div>
                            </div>
                        `;
                    } else {
                        imageBlock = `
                            <div class="w-full h-64 my-6 relative rounded-2xl overflow-hidden border border-slate-200 bg-slate-50">
                                <img src="${imgUrl}" id="${uniqueId}" class="w-full h-full object-cover" onerror="this.src='https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=800&q=80'">
                                
                                <div class="absolute top-2 right-2 edit-controls">
                                    <button onclick="document.getElementById('${uniqueId}-input').click()" class="bg-indigo-600 hover:bg-indigo-700 text-white shadow-lg px-3 py-2 rounded-lg font-bold text-xs flex items-center gap-2">
                                        <i class="fas fa-upload"></i> Ändern
                                    </button>
                                    <input type="file" id="${uniqueId}-input" class="hidden" accept="image/*" onchange="handleImageUpload(this, '${uniqueId}')">
                                </div>
                            </div>
                            <p contenteditable="true" class="text-[10px] text-slate-500 font-bold uppercase tracking-widest text-center mt-[-1rem] mb-6">${page.imageCaption || 'Illustration'}</p>
                        `;
                    }
                }

                let pageContent = '';
                if(currentType === 'presentation') {
                    pageContent = `
                        <div class="h-full flex flex-col p-10 md:p-14">
                            <div class="flex items-center gap-4 mb-8 pb-4 border-b-2 border-slate-100">
                                <span class="text-3xl font-black text-indigo-200">${String(index+1).padStart(2, '0')}</span>
                                <h2 contenteditable="true" class="text-3xl font-black text-slate-900">${page.title}</h2>
                            </div>
                            <div class="flex-1 flex flex-col md:flex-row gap-10 overflow-hidden">
                                <div contenteditable="true" class="flex-1 text-lg text-slate-700 leading-relaxed font-medium">
                                    ${page.contentHtml}
                                </div>
                                ${imageBlock}
                            </div>
                        </div>
                    `;
                } else {
                    pageContent = `
                        <div class="medical-border mb-6 mt-4">
                            <h2 contenteditable="true" class="text-2xl font-black text-slate-900">${page.title}</h2>
                        </div>
                        ${imageBlock}
                        <div contenteditable="true" class="text-base text-slate-700 leading-relaxed">
                            ${page.contentHtml}
                        </div>
                    `;
                }
                html += generatePage(currentType, pageContent);
            });

            // --- 3. SOURCES & END ---
            html += generatePage(currentType, `
                <div class="h-full p-10 md:p-16 bg-slate-50">
                    <h2 contenteditable="true" class="text-3xl font-black text-slate-900 mb-8 border-b-4 border-indigo-600 pb-2 inline-block">Quellen & Abschluss</h2>
                    <ul class="list-decimal pl-5 text-sm text-slate-600 font-medium space-y-2 mb-12">
                        ${data.sources.map(s => `<li contenteditable="true">${s}</li>`).join('')}
                        <li contenteditable="true">Bildquellen: KI-Generiert via Pollinations AI & Eigene Uploads</li>
                    </ul>
                    <div class="mt-auto pt-12 text-center">
                        <h3 contenteditable="true" class="text-4xl font-black text-slate-900 mb-4">Vielen Dank!</h3>
                        <p contenteditable="true" class="text-slate-500 italic">Gibt es noch Fragen?</p>
                    </div>
                </div>
            `);

            output.innerHTML = html;
        }

        function generatePage(type, content) {
            return `<div class="document-page ${type === 'presentation' ? 'page-presentation' : 'page-flyer'}">${content}</div>`;
        }
        
        // Init
        setType('presentation');
    </script>
</body>
</html>
