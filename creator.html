<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>AI Presentation Studio Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[#0f172a] text-white h-screen flex flex-col overflow-hidden">

    <header class="h-14 border-b border-slate-800 bg-slate-950 flex items-center justify-between px-6 z-50">
        <div class="flex items-center gap-4">
            <span class="font-black text-indigo-500 tracking-tighter text-xl">SLM.studio</span>
            <div class="h-6 w-px bg-slate-800"></div>
            <h1 id="presentation-title" class="text-xs uppercase font-bold text-slate-400">Unbenanntes Projekt</h1>
        </div>
        <div class="flex gap-3">
            <button id="export-pdf" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-1.5 rounded text-xs font-bold transition-all">
                <i class="fas fa-file-pdf mr-2"></i> PDF EXPORT
            </button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <aside class="w-80 border-r border-slate-800 bg-slate-900/50 p-5 flex flex-col gap-6 overflow-y-auto custom-scrollbar">
            
            <section>
                <label class="section-label">1. Kontext & Daten</label>
                <input type="text" id="topic" placeholder="Hauptthema..." class="input-field">
                <textarea id="case-study" rows="4" placeholder="Fallbeispiel oder Frage hier einfügen..." class="input-field mt-2"></textarea>
                <div class="mt-2 border-2 border-dashed border-slate-700 rounded-lg p-4 text-center hover:border-indigo-500 cursor-pointer transition-all" onclick="document.getElementById('pdf-upload').click()">
                    <i class="fas fa-cloud-upload-alt text-slate-500 mb-2"></i>
                    <p class="text-[10px] text-slate-400 font-bold uppercase">PDF Analyse (Beta)</p>
                    <input type="file" id="pdf-upload" class="hidden" accept=".pdf">
                </div>
            </section>

            <section>
                <label class="section-label">2. Team & Sprecher</label>
                <div id="speaker-chips" class="flex flex-wrap gap-2 mb-2"></div>
                <div class="flex gap-2">
                    <input type="text" id="speaker-input" placeholder="Name..." class="input-field py-1 text-xs">
                    <button id="add-speaker" class="bg-slate-700 px-3 rounded hover:bg-indigo-600"><i class="fas fa-plus"></i></button>
                </div>
            </section>

            <section>
                <label class="section-label">3. Konfiguration</label>
                <div class="flex justify-between text-[10px] text-slate-400 font-bold mb-1">
                    <span>FOLIENANZAHL</span>
                    <span id="count-val">AUTO</span>
                </div>
                <input type="range" id="slide-count" min="0" max="20" value="0" class="w-full accent-indigo-500">
                
                <div class="mt-4">
                    <label class="text-[10px] font-bold text-slate-500 block mb-2">SKRIPT-TYP</label>
                    <select id="script-mode" class="input-field">
                        <option value="bullets">Fakten-Bulletpoints</option>
                        <option value="detailed">Ausführliches Skript</option>
                        <option value="none">Kein Skript</option>
                    </select>
                </div>
            </section>

            <button id="generate-btn" class="w-full bg-indigo-600 py-3 rounded-xl font-black text-sm uppercase tracking-widest hover:bg-indigo-500 shadow-lg shadow-indigo-500/20 transition-all mt-auto">
                Synthese Starten
            </button>
        </aside>

        <main class="flex-1 bg-slate-950 p-10 overflow-y-auto flex flex-col items-center gap-12" id="canvas">
            <div id="empty-state" class="mt-20 text-center opacity-20">
                <i class="fas fa-layer-group text-8xl mb-4"></i>
                <p class="text-xl font-light">Bereit für die Generierung</p>
            </div>
        </main>
    </div>

    <div id="editor-toolbar" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl p-2 hidden z-[100] flex gap-2 items-center">
        <button class="tool-btn" onclick="formatDoc('bold')"><i class="fas fa-bold"></i></button>
        <button class="tool-btn" onclick="formatDoc('italic')"><i class="fas fa-italic"></i></button>
        <div class="w-px h-6 bg-slate-700 mx-1"></div>
        <button class="tool-btn text-indigo-400" id="add-img-tool"><i class="fas fa-image"></i></button>
        <button class="tool-btn text-red-400" id="delete-element"><i class="fas fa-trash"></i></button>
    </div>

    <script src="js/editor.js"></script>
    <script src="js/synthesis.js"></script>
</body>
</html>
