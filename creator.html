<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLM Studio Pro | AI Presentation Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
</head>
<body class="bg-[#0b0f1a] text-slate-200 overflow-hidden font-['Plus_Jakarta_Sans']">

    <nav class="h-16 border-b border-white/5 bg-[#0b0f1a]/80 backdrop-blur-md flex items-center justify-between px-6 z-[100] relative">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-500/20">
                <i class="fas fa-brain text-white"></i>
            </div>
            <span class="text-xl font-extrabold tracking-tighter bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-400">SLM STUDIO <span class="text-indigo-500">PRO</span></span>
        </div>
        
        <div class="flex items-center gap-4">
            <div id="status-indicator" class="text-[10px] font-bold uppercase tracking-widest text-slate-500 flex items-center gap-2">
                <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span> System Bereit
            </div>
            <button id="export-btn" class="bg-white text-black hover:bg-indigo-500 hover:text-white px-5 py-2 rounded-full font-bold text-xs transition-all uppercase tracking-widest shadow-xl">
                Export PDF
            </button>
        </div>
    </nav>

    <div class="flex h-[calc(100vh-64px)] overflow-hidden">
        
        <aside class="w-[400px] border-r border-white/5 bg-[#0f1422] flex flex-col z-50">
            <div class="p-6 overflow-y-auto flex-1 custom-scrollbar space-y-8">
                
                <section>
                    <label class="sidebar-label">Projekt-Kontext</label>
                    <input type="text" id="main-topic" placeholder="Thema (z.B. Fallstudie Herr Z.)" class="modern-input mb-3">
                    <textarea id="ai-context" rows="5" placeholder="Einfügen von Fallbeispielen, Fragen oder Texten..." class="modern-input"></textarea>
                    
                    <div class="mt-3 relative">
                        <input type="file" id="pdf-upload" class="hidden" accept=".pdf">
                        <button onclick="document.getElementById('pdf-upload').click()" class="w-full py-3 border border-dashed border-slate-700 rounded-xl text-xs font-bold text-slate-400 hover:border-indigo-500 hover:text-indigo-400 transition-all">
                            <i class="fas fa-file-pdf mr-2"></i> PDF-ANALYSE STARTEN
                        </button>
                    </div>
                </section>

                <section>
                    <div class="flex justify-between items-center mb-4">
                        <label class="sidebar-label">Präsentations-Team</label>
                        <button id="add-speaker" class="text-indigo-400 hover:text-white transition-colors"><i class="fas fa-plus-circle"></i></button>
                    </div>
                    <div id="speaker-list" class="space-y-2">
                        </div>
                    <select id="script-config" class="modern-input mt-4 text-xs font-bold">
                        <option value="bullets">SKRIPT: FAKTISCHE BULLETPOINTS</option>
                        <option value="detailed">SKRIPT: DETAILLIERTER TEXT</option>
                        <option value="none">KEIN SKRIPT GENERIEREN</option>
                    </select>
                </section>

                <section>
                    <label class="sidebar-label">Umfang & Intelligenz</label>
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-[10px] font-bold text-slate-500">FOLIENANZAHL</span>
                        <span id="slide-count-val" class="text-indigo-400 font-bold">AUTO</span>
                    </div>
                    <input type="range" id="slide-count" min="0" max="15" value="0" class="modern-range">
                    <p class="text-[9px] text-slate-500 mt-2 font-medium italic">"0" lässt die KI die optimale Struktur basierend auf dem Inhalt bestimmen.</p>
                </section>
            </div>

            <div class="p-6 bg-[#0b0f1a] border-t border-white/5">
                <button id="generate-master" class="w-full bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-500 hover:to-blue-500 text-white font-black py-4 rounded-2xl shadow-2xl shadow-indigo-500/20 uppercase tracking-[0.2em] text-xs flex items-center justify-center gap-3 transition-all transform hover:-translate-y-1">
                    <i class="fas fa-sparkles"></i> Synthese Starten
                </button>
            </div>
        </aside>

        <main class="flex-1 bg-[#070910] p-12 overflow-y-auto flex flex-col items-center gap-16 relative" id="workspace">
            <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center opacity-20 select-none">
                <i class="fas fa-project-diagram text-9xl mb-8"></i>
                <h2 class="text-3xl font-black uppercase tracking-widest">Warte auf Input</h2>
            </div>
        </main>

        <aside class="w-16 border-l border-white/5 bg-[#0f1422] flex flex-col items-center py-6 gap-6 z-50">
            <button title="Text hinzufügen" class="tool-icon" id="tool-text"><i class="fas fa-font"></i></button>
            <button title="Bild hinzufügen" class="tool-icon" id="tool-img"><i class="fas fa-image"></i></button>
            <button title="Formen" class="tool-icon"><i class="fas fa-shapes"></i></button>
            <div class="w-8 h-px bg-slate-800"></div>
            <button title="Farbschema" class="tool-icon text-indigo-400"><i class="fas fa-palette"></i></button>
        </aside>
    </div>

    <div id="floating-tools" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-[#1a1f2e]/90 backdrop-blur-xl border border-white/10 px-6 py-3 rounded-2xl shadow-2xl flex items-center gap-6 opacity-0 translate-y-20 transition-all duration-500 z-[1000]">
        <div class="flex items-center gap-2 border-r border-white/10 pr-6">
            <button class="edit-btn" onclick="execCmd('bold')"><i class="fas fa-bold"></i></button>
            <button class="edit-btn" onclick="execCmd('italic')"><i class="fas fa-italic"></i></button>
        </div>
        <div class="flex items-center gap-4">
            <span class="text-[10px] font-black text-slate-500 uppercase">Größe</span>
            <input type="number" id="font-size" value="24" class="bg-transparent text-white font-bold w-12 outline-none">
        </div>
        <button id="delete-element" class="text-red-400 hover:text-red-300 ml-4"><i class="fas fa-trash"></i></button>
    </div>

    <script src="js/editor.js"></script>
    <script src="js/engine.js"></script>
</body>
</html>
