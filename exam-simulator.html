<!DOCTYPE html>
<html lang="de" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Prüfungs-Simulator · SLM System v8</title>
<meta name="description" content="1:1 Papier-Prüfungssimulator: Modulklausuren und Zwischenprüfung (PflAPrV) mit echtem Klausurzettel, Fallbeispiel und Arztbrief.">
<meta name="theme-color" content="#050811">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="css/tw.css">
<link rel="stylesheet" href="css/v8.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%236366f1'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='800'>S</text></svg>">
</head>
<body class="min-h-screen antialiased font-sans">
<noscript>
  <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#050811;color:#e2e8f0;font-family:sans-serif;text-align:center;padding:2rem">
    <div style="max-width:28rem">
      <div style="font-size:2rem;font-weight:800;margin-bottom:1rem">Prüfungs-Simulator</div>
      <p style="color:#94a3b8;line-height:1.6">Dieser Simulator benötigt JavaScript. Bitte aktiviere JavaScript und lade die Seite neu.</p>
    </div>
  </div>
</noscript>
<div class="page-bg" aria-hidden="true"></div>
<div class="pointer-events-none fixed inset-0 z-0 overflow-hidden" aria-hidden="true">
  <div class="absolute -top-24 -left-24 h-96 w-96 rounded-full opacity-20 blur-3xl float-anim" style="background:radial-gradient(circle,#6366f1,transparent 70%)"></div>
  <div class="absolute -bottom-32 right-1/4 h-80 w-80 rounded-full opacity-10 blur-3xl float-anim" style="background:radial-gradient(circle,#14b8a6,transparent 70%);animation-delay:2s"></div>
</div>

<div id="sim-root" class="relative z-10"></div>
<div id="toast-root"></div>

<script>
/* ═══ FEHLER-SICHERHEITSNETZ ═══ */
window.__SLM_BOOT_ERRORS__ = [];
function __slmShowFatalError(details) {
  try {
    var root = document.getElementById("sim-root");
    if (!root) { window.setTimeout(function () { __slmShowFatalError(details); }, 100); return; }
    if (root.innerHTML.trim()) return;
    root.innerHTML =
      '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem">' +
      '<div style="max-width:28rem;width:100%;background:rgba(15,23,42,0.9);border:1px solid rgba(248,113,113,0.3);border-radius:1.5rem;padding:2rem;text-align:center">' +
      '<div style="font-weight:800;font-size:1.1rem;color:#fff;margin:0 0 0.5rem">Der Simulator konnte nicht starten</div>' +
      '<p style="font-size:0.8rem;color:#94a3b8;line-height:1.6;margin:0 0 1rem">Bitte lade die Seite neu. Wenn der Fehler bleibt, prüfe, ob der komplette Ordner (js/, css/, fonts/) entpackt wurde.</p>' +
      '<pre style="font-size:0.65rem;color:#f87171;background:rgba(0,0,0,0.3);border-radius:0.5rem;padding:0.75rem;text-align:left;overflow:auto;max-height:10rem;margin:0">' + String(details).replace(/</g, "&lt;") + "</pre>" +
      '<button onclick="location.reload()" style="margin-top:1rem;width:100%;padding:0.75rem 1rem;border:0;border-radius:0.75rem;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-weight:800;cursor:pointer">Neu laden</button>' +
      "</div></div>";
  } catch (e) { }
}
window.addEventListener("error", function (e) {
  window.__SLM_BOOT_ERRORS__.push(String(e.message || e.error || e));
  __slmShowFatalError(window.__SLM_BOOT_ERRORS__.join("\n"));
});
window.addEventListener("unhandledrejection", function (e) {
  window.__SLM_BOOT_ERRORS__.push("Promise: " + String(e.reason));
});
window.setTimeout(function () {
  var root = document.getElementById("sim-root");
  if (root && !root.innerHTML.trim()) {
    __slmShowFatalError(window.__SLM_BOOT_ERRORS__.join("\n") || "Keine Fehler gemeldet — vermutlich fehlende Dateien (js/ oder css/ Ordner nicht entpackt?).");
  }
}, 2500);
</script>

<script src="js/data-local.js"></script>
<script src="js/icons.js"></script>
<script src="js/v8-core.js"></script>
<script src="js/v8-data.js"></script>
<script src="js/v8-exam-engine.js"></script>
<script src="js/v8-exam-renderer.js"></script>
<script src="js/v8-exam-grader.js"></script>
<script src="js/v8-exam-results.js"></script>
<script src="js/v8-exam-simulator.js"></script>
</body>
</html>
