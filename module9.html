<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modul 9 — Neurologische Rehabilitation | SLM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family:'Plus Jakarta Sans',sans-serif; background:#f8fafc; }
        .glass { background:rgba(255,255,255,.85); backdrop-filter:blur(20px); border:1px solid rgba(0,0,0,.08); box-shadow:0 1px 3px rgba(0,0,0,.06); }
        .prasanth-label { background:linear-gradient(135deg,#6366f1,#f97316); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .summary-content h3 { font-size:1.25rem; font-weight:800; color:#0f172a; margin:1.5rem 0 .75rem; }
        .summary-content h4 { font-size:1.05rem; font-weight:700; color:#b45309; margin:1.25rem 0 .5rem; }
        .summary-content p { color:#475569; line-height:1.8; margin-bottom:.75rem; }
        .summary-content ul { list-style:disc; padding-left:1.5rem; color:#475569; margin-bottom:1rem; }
        .summary-content li { margin-bottom:.35rem; line-height:1.7; }
        .summary-content strong { color:#1e293b; }
        .summary-content table { width:100%; border-collapse:collapse; margin:1rem 0; }
        .summary-content th { background:rgba(245,158,11,.12); color:#92400e; padding:.6rem 1rem; text-align:left; font-size:.8rem; font-weight:700; border-bottom:2px solid rgba(245,158,11,.2); }
        .summary-content td { padding:.5rem 1rem; border-bottom:1px solid #e2e8f0; color:#475569; font-size:.85rem; }
        ::-webkit-scrollbar { width:5px; }
        ::-webkit-scrollbar-thumb { background:rgba(0,0,0,.12); border-radius:99px; }
    </style>
</head>
<body class="min-h-screen text-slate-800">

<div class="max-w-5xl mx-auto px-5 sm:px-8 py-8 sm:py-12">

    <!-- Header -->
    <header class="mb-8">
        <a href="index.html" class="text-slate-400 hover:text-amber-600 text-sm font-medium inline-flex items-center gap-2 mb-4 transition-colors">
            <i class="fas fa-arrow-left text-xs"></i> Dashboard
        </a>
        <div class="flex items-center gap-4 mb-3">
            <div class="w-14 h-14 bg-amber-500 rounded-2xl flex items-center justify-center shadow-lg shadow-amber-500/20">
                <i class="fas fa-brain text-white text-2xl"></i>
            </div>
            <div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">Modul 9</h1>
                <p class="text-slate-500 font-medium text-sm">Neurologische Rehabilitation</p>
            </div>
        </div>
    </header>

    <!-- Tab Buttons -->
    <div class="flex gap-2 mb-8">
        <button id="tab-learn" onclick="switchTab('learn')" class="px-5 py-2.5 rounded-xl text-sm font-bold transition-all bg-amber-50 text-amber-700 border border-amber-200">
            <i class="fas fa-book-open mr-2"></i>Lerninhalte
        </button>
        <button id="tab-exam" onclick="switchTab('exam')" class="px-5 py-2.5 rounded-xl text-sm font-bold transition-all bg-slate-100 text-slate-500 border border-slate-200">
            <i class="fas fa-file-alt mr-2"></i>Klausur-Simulator
        </button>
    </div>

    <!-- Learn Tab -->
    <div id="panel-learn">
        <div class="glass rounded-2xl p-6 mb-6">
            <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-2">Thema wählen</label>
            <select id="topic-select" onchange="loadSummary()" class="w-full bg-white border border-slate-200 text-slate-800 rounded-xl px-4 py-3 text-sm font-medium focus:outline-none focus:border-amber-400 focus:ring-2 focus:ring-amber-100 transition-colors">
                <option value="">— Thema auswählen —</option>
                <option value="1">1 · Anatomie & Physiologie des Nervensystems</option>
                <option value="2">2 · Schlaganfall (Apoplex)</option>
                <option value="3">3 · Grundlagen & Phasen der Rehabilitation</option>
                <option value="4">4 · Pflegeprozess & Assessments in der Reha</option>
                <option value="5">5 · Rehabilitative Pflegeinterventionen & Konzepte</option>
                <option value="6">6 · Dysphagie (Schluckstörungen)</option>
            </select>
        </div>

        <div id="summary-container" class="glass rounded-2xl p-6 sm:p-8 hidden">
            <div id="summary-content" class="summary-content"></div>
        </div>

        <div id="empty-state" class="text-center py-16">
            <i class="fas fa-brain text-4xl text-amber-300 mb-4"></i>
            <p class="text-slate-400 font-medium">Wähle ein Thema, um die Zusammenfassung zu laden.</p>
        </div>
    </div>

    <!-- Exam Tab -->
    <div id="panel-exam" class="hidden">
        <div class="glass rounded-2xl p-8 text-center">
            <div class="w-16 h-16 bg-orange-50 text-orange-500 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-orange-100">
                <i class="fas fa-file-alt text-3xl"></i>
            </div>
            <h3 class="text-xl font-bold text-slate-900 mb-2">Klausur-Simulator</h3>
            <p class="text-slate-500 text-sm mb-6 max-w-md mx-auto">90-Minuten Papier-Klausur mit Fallbeispiel, 10 Fragetypen und automatischer Bewertung.</p>
            <a href="exam-simulator.html?module=9" class="inline-flex items-center gap-2 bg-orange-500 hover:bg-orange-600 text-white px-8 py-3 rounded-xl font-bold text-sm transition-colors shadow-lg shadow-orange-500/20">
                <i class="fas fa-play"></i> Klausur starten
            </a>
        </div>
    </div>

    <!-- Footer -->
    <footer class="mt-16 pt-6 border-t border-slate-200">
        <div class="text-[9px] text-slate-400 uppercase tracking-widest font-bold text-center">
            SLM System • <span class="prasanth-label">Prasanth</span> • Modul 9
        </div>
    </footer>

</div>

<script>
function switchTab(tab) {
    document.getElementById('panel-learn').classList.toggle('hidden', tab !== 'learn');
    document.getElementById('panel-exam').classList.toggle('hidden', tab !== 'exam');
    document.getElementById('tab-learn').className = tab === 'learn'
        ? 'px-5 py-2.5 rounded-xl text-sm font-bold transition-all bg-amber-50 text-amber-700 border border-amber-200'
        : 'px-5 py-2.5 rounded-xl text-sm font-bold transition-all bg-slate-100 text-slate-500 border border-slate-200';
    document.getElementById('tab-exam').className = tab === 'exam'
        ? 'px-5 py-2.5 rounded-xl text-sm font-bold transition-all bg-orange-50 text-orange-600 border border-orange-200'
        : 'px-5 py-2.5 rounded-xl text-sm font-bold transition-all bg-slate-100 text-slate-500 border border-slate-200';
}

async function loadSummary() {
    const unit = document.getElementById('topic-select').value;
    const container = document.getElementById('summary-container');
    const content = document.getElementById('summary-content');
    const empty = document.getElementById('empty-state');

    if (!unit) { container.classList.add('hidden'); empty.classList.remove('hidden'); return; }

    try {
        content.innerHTML = '<p class="text-slate-400 text-center py-8"><i class="fas fa-spinner fa-spin mr-2"></i>Laden...</p>';
        container.classList.remove('hidden');
        empty.classList.add('hidden');

        const res = await fetch(`data/module9summariesunit${unit}.json`);
        if (!res.ok) throw new Error('Datei nicht gefunden');
        const data = await res.json();

        let html = '';
        if (Array.isArray(data)) {
            data.forEach(item => {
                html += `<div class="mb-6">`;
                if (item.topic) html += `<h3>${item.topic}</h3>`;
                if (item.tags) html += `<div class="flex flex-wrap gap-1.5 mb-3">${item.tags.map(t =>
                    `<span class="bg-amber-50 text-amber-700 text-[10px] font-bold px-2 py-0.5 rounded border border-amber-200">${t}</span>`).join('')}</div>`;
                if (item.content) html += item.content;
                html += `</div>`;
            });
        } else {
            html = JSON.stringify(data);
        }

        content.innerHTML = html;
    } catch (e) {
        content.innerHTML = `<p class="text-red-500 text-center py-8"><i class="fas fa-exclamation-triangle mr-2"></i>Zusammenfassung konnte nicht geladen werden: ${e.message}</p>`;
    }
}
</script>
</body>
</html>
