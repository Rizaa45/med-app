<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLM System | Modul-Analyse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background: #fcfdfe; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .animate-modal { animation: modalSlide 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes modalSlide { from { opacity: 0; transform: scale(0.9) translateY(30px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        #pin-btn.active { background: #4f46e5; color: white; }
    </style>
</head>
<body class="min-h-screen overflow-x-hidden">
    
    <nav class="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 h-20 flex items-center justify-between">
            <button onclick="location.href='index.html'" class="group flex items-center text-slate-500 hover:text-indigo-600 font-semibold transition-all">
                <div class="p-2 rounded-full group-hover:bg-indigo-50 transition-all mr-2">
                    <i class="fas fa-chevron-left"></i>
                </div>
                <span class="hidden sm:inline text-sm uppercase tracking-wider">Dashboard</span>
            </button>
            <div class="flex flex-col items-center text-center">
                <span id="mod-title" class="font-extrabold text-slate-900 text-lg uppercase tracking-tighter">Modul 9: Analyse</span>
                <span class="text-[9px] text-indigo-600 font-bold tracking-[0.3em] uppercase mt-1">SLM Core v.5.5</span>
            </div>
            <button onclick="location.href='vault.html'" class="p-2 text-slate-400 hover:text-indigo-600 transition-all">
                <i class="fas fa-thumbtack text-lg"></i>
            </button>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto px-6 py-8">
        <div class="flex bg-slate-100 rounded-2xl p-1.5 shadow-inner mb-8 border border-slate-200">
            <button onclick="switchTab('inhalt')" id="tab-inhalt" class="flex-1 py-3 rounded-xl font-bold transition-all duration-300 bg-white text-indigo-600 shadow-sm border border-slate-200/50">Lerninhalte</button>
            <button onclick="switchTab('quiz')" id="tab-quiz" class="flex-1 py-3 rounded-xl font-bold transition-all duration-300 text-slate-500">Prüfungsvorbereitung</button>
        </div>

        <div id="section-inhalt" class="space-y-6 fade-in">
            <div id="summary-dropdown-container"></div>
            <div id="summary-display-area" class="hidden"></div>
            <div class="flex items-center gap-4 py-4">
                <div class="h-px flex-1 bg-slate-200"></div>
                <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Original Handouts</span>
                <div class="h-px flex-1 bg-slate-200"></div>
            </div>
            <div id="pdf-list" class="grid gap-4"></div>
        </div>

        <div id="section-quiz" class="hidden space-y-8 fade-in">
            <div id="quiz-selection" class="space-y-6">
                <div class="bg-indigo-900 rounded-[2.5rem] p-8 text-white relative overflow-hidden shadow-xl border border-indigo-700/50">
                    <h2 class="text-2xl font-black tracking-tight mb-6">Klausur-Vorbereitung</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 relative z-10">
                        <button onclick="startQuizMode('drill')" class="bg-white/10 hover:bg-white/20 border border-white/10 p-5 rounded-2xl text-left transition-all group">
                            <div class="flex items-center gap-3 mb-2">
                                <span class="bg-indigo-500 text-white w-10 h-10 flex items-center justify-center rounded-xl group-hover:scale-110 transition-transform"><i class="fas fa-dumbbell"></i></span>
                                <span class="font-bold">Der 30er Drill</span>
                            </div>
                            <p class="text-xs text-indigo-200">Fehler werden wiederholt, bis sie sitzen.</p>
                        </button>
                        <button onclick="startQuizMode('simulator')" class="bg-gradient-to-br from-orange-500 to-red-600 p-5 rounded-2xl text-left transition-all hover:scale-[1.02] shadow-lg group">
                            <div class="flex items-center gap-3 mb-2">
                                <span class="bg-white text-orange-600 w-10 h-10 flex items-center justify-center rounded-xl shadow-sm"><i class="fas fa-graduation-cap"></i></span>
                                <span class="font-bold text-white">Prüfungs-Simulator</span>
                            </div>
                            <p class="text-xs text-white/90">16 Aufgaben. Fallanalyse + Drills. KI-Note.</p>
                        </button>
                    </div>
                </div>
            </div>

            <div id="quiz-container" class="hidden">
                <div id="scenario-display" class="hidden bg-slate-900 rounded-[2rem] p-8 mb-6 text-white border-b-4 border-orange-500">
                    <span id="setting-badge" class="bg-orange-500 text-white text-[10px] font-black px-2 py-0.5 rounded uppercase tracking-widest mb-4 inline-block">FALLSTUDIE</span>
                    <p id="scenario-text" class="text-slate-200 text-sm leading-relaxed italic"></p>
                </div>

                <div class="bg-white rounded-[2.5rem] shadow-xl border border-slate-100 overflow-hidden">
                    <div class="bg-slate-900 px-8 py-4 flex justify-between items-center text-white text-[10px] font-black uppercase tracking-widest">
                        <span>Aufgabe <span id="q-current">1</span> / <span id="q-total">16</span></span>
                        <button onclick="exitQuiz()" class="hover:text-red-400 transition-colors italic">Abbrechen</button>
                    </div>
                    
                    <div class="p-8 md:p-12">
                        <div class="flex justify-between items-center mb-4">
                            <div id="type-badge" class="text-indigo-600 text-[10px] font-black uppercase tracking-[0.2em] bg-indigo-50 px-3 py-1 rounded-full">ANALYSE</div>
                        </div>
                        
                        <h2 id="question-text" class="text-xl md:text-2xl font-extrabold text-slate-900 mb-8 leading-tight">Lade Frage...</h2>
                        
                        <div id="options-grid" class="grid gap-3">
                            </div>
                        
                        <div id="feedback" class="mt-8 p-6 rounded-2xl hidden border-l-8 bg-slate-50 border-indigo-500 fade-in">
                            <p id="feedback-text" class="font-black text-lg uppercase mb-1"></p>
                            <p id="hint-text" class="text-slate-600 text-xs italic mb-4"></p>
                            <button id="next-btn" onclick="nextQuestion()" class="w-full bg-slate-900 text-white py-4 rounded-xl font-bold uppercase text-xs tracking-widest flex items-center justify-center gap-2 hover:bg-indigo-600 transition-all">
                                Nächste Aufgabe <i class="fas fa-arrow-right"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="prodigy-sidebar" class="fixed top-0 right-0 h-full w-full max-w-[440px] bg-white/95 backdrop-blur-xl shadow-[-20px_0_50px_rgba(0,0,0,0.1)] z-[110] translate-x-full transition-transform duration-500 flex flex-col border-l border-slate-200/50">
        <div class="p-6 bg-slate-900 text-white flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-indigo-600 rounded-2xl flex items-center justify-center transform -rotate-3"><i class="fas fa-brain text-xl"></i></div>
                <div>
                    <h4 class="font-black uppercase tracking-[0.15em] text-sm">Prodigy <span class="text-indigo-400">AI</span></h4>
                    <p class="text-[10px] text-slate-400 font-bold uppercase">Medical Tutor</p>
                </div>
            </div>
            <button onclick="toggleProdigy()" class="w-10 h-10 flex items-center justify-center rounded-xl bg-white/10"><i class="fas fa-times"></i></button>
        </div>
        <div id="prodigy-chat-box" class="flex-1 overflow-y-auto p-6 space-y-6 no-scrollbar"></div>
        <div class="p-6 bg-white border-t border-slate-100">
            <div class="relative flex items-center">
                <textarea id="prodigy-input" rows="1" placeholder="Stelle eine Fachfrage..." class="w-full p-4 pr-16 bg-slate-100 border-2 border-transparent focus:border-indigo-500 rounded-[1.5rem] text-sm outline-none resize-none transition-all"></textarea>
                <button onclick="askProdigy()" class="absolute right-2 w-11 h-11 bg-indigo-600 text-white rounded-xl flex items-center justify-center"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>
    <div id="prodigy-overlay" onclick="toggleProdigy()" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[105] hidden opacity-0 transition-all duration-500"></div>

    <button onclick="toggleProdigy()" class="fixed bottom-8 right-8 group z-[100]">
        <div class="absolute inset-0 bg-indigo-600 rounded-3xl blur-2xl opacity-40 animate-pulse"></div>
        <div class="relative w-16 h-16 bg-indigo-600 text-white rounded-3xl shadow-2xl flex items-center justify-center border-2 border-indigo-400/50">
            <i class="fas fa-robot text-2xl"></i>
        </div>
    </button>

    <script>
        // --- DATA & STATE ---
        let currentQuestions = [];
        let currentIndex = 0;
        let currentMode = '';
        let userAnswersLog = [];
        let activeCase = null;

        // --- UI TABS ---
        function switchTab(tab) {
            document.getElementById('section-inhalt').classList.toggle('hidden', tab !== 'inhalt');
            document.getElementById('section-quiz').classList.toggle('hidden', tab !== 'quiz');
            document.getElementById('tab-inhalt').className = tab === 'inhalt' ? 'flex-1 py-3 rounded-xl font-bold bg-white text-indigo-600 shadow-sm border border-slate-200/50' : 'flex-1 py-3 rounded-xl font-bold text-slate-500';
            document.getElementById('tab-quiz').className = tab === 'quiz' ? 'flex-1 py-3 rounded-xl font-bold bg-white text-indigo-600 shadow-sm border border-slate-200/50' : 'flex-1 py-3 rounded-xl font-bold text-slate-500';
        }

        // --- QUIZ ENGINE CORE ---
        async function startQuizMode(mode) {
            currentMode = mode;
            userAnswersLog = [];
            currentIndex = 0;
            
            document.getElementById('quiz-selection').classList.add('hidden');
            document.getElementById('quiz-container').classList.remove('hidden');

            try {
                // Hier fetchst du deine JSONs
                const qResp = await fetch('data/klausur27_questions.json');
                const allDrills = await qResp.json();

                if (mode === 'drill') {
                    // Drill: 30 zufällige Fragen
                    currentQuestions = allDrills.sort(() => 0.5 - Math.random()).slice(0, 30);
                    document.getElementById('scenario-display').classList.add('hidden');
                } 
                else if (mode === 'simulator') {
                    const cResp = await fetch('data/klausur27_cases.json');
                    const cases = await cResp.json();
                    
                    // 1. Random Case wählen
                    activeCase = cases[Math.floor(Math.random() * cases.length)];
                    const caseQuestions = activeCase.questions; 

                    // 2. Mit Drills auffüllen auf exakt 16 Aufgaben
                    const fillers = allDrills.sort(() => 0.5 - Math.random()).slice(0, 16 - caseQuestions.length);
                    currentQuestions = [...caseQuestions, ...fillers];

                    document.getElementById('scenario-display').classList.remove('hidden');
                    document.getElementById('scenario-text').innerText = activeCase.scenario;
                    document.getElementById('setting-badge').innerText = "STAATSEXAMEN SIMULATION";
                }

                document.getElementById('q-total').innerText = currentQuestions.length;
                showQuestion();
            } catch (e) {
                alert("Fehler beim Laden der Prüfungsdaten.");
                exitQuiz();
            }
        }

        function showQuestion() {
            if (currentIndex >= currentQuestions.length) { finishQuiz(); return; }
            
            const q = currentQuestions[currentIndex];
            document.getElementById('q-current').innerText = currentIndex + 1;
            document.getElementById('question-text').innerText = q.question || q.q;
            document.getElementById('type-badge').innerText = (q.type || 'Analyse').toUpperCase();
            document.getElementById('feedback').classList.add('hidden');
            
            const grid = document.getElementById('options-grid');
            grid.innerHTML = "";

            // Render Logic nach Typ
            if (q.type === "wahr_falsch") {
                renderTrueFalse(q, grid);
            } else if (q.type === "nennen_offen" || q.type === "lueckentext") {
                renderOpenTask(q, grid);
            } else {
                renderMC(q, grid);
            }
        }

        // --- RENDERERS ---
        function renderMC(q, grid) {
            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-5 rounded-2xl border-2 border-slate-100 hover:border-indigo-400 transition-all font-medium bg-white text-slate-700 flex justify-between items-center group";
                btn.innerHTML = `<span>${opt}</span><i class="fas fa-circle-check opacity-0 group-hover:opacity-20"></i>`;
                btn.onclick = () => handleAnswer(i, btn, q);
                grid.appendChild(btn);
            });
        }

        function renderTrueFalse(q, grid) {
            ["Wahr", "Falsch"].forEach((label, i) => {
                const btn = document.createElement('button');
                btn.className = "w-full p-6 rounded-2xl border-2 border-slate-100 font-bold uppercase tracking-widest hover:border-indigo-400 transition-all";
                btn.innerText = label;
                btn.onclick = () => handleAnswer(i, btn, q);
                grid.appendChild(btn);
            });
        }

        function renderOpenTask(q, grid) {
            grid.innerHTML = `
                <textarea id="open-input" class="w-full p-5 rounded-2xl border-2 border-slate-200 h-32 outline-none focus:border-indigo-500 transition-all text-sm" placeholder="Deine Antwort..."></textarea>
                <button id="check-btn" onclick="revealOpenSol()" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-black uppercase text-xs tracking-widest mt-2">Lösung abgleichen</button>
                <div id="sol-box" class="hidden space-y-4 fade-in mt-4">
                    <div class="p-4 bg-indigo-50 rounded-xl border border-indigo-100 text-sm italic text-slate-700">
                        <b class="block text-indigo-600 uppercase not-italic mb-1">Erwartet:</b> ${q.correct_answer || q.answer}
                    </div>
                    <div class="flex gap-2">
                        <button onclick="handleSelfCheck(true)" class="flex-1 bg-green-500 text-white py-3 rounded-lg font-bold text-[10px] uppercase">Richtig</button>
                        <button onclick="handleSelfCheck(false)" class="flex-1 bg-red-400 text-white py-3 rounded-lg font-bold text-[10px] uppercase">Falsch</button>
                    </div>
                </div>
            `;
        }

        function revealOpenSol() {
            document.getElementById('check-btn').classList.add('hidden');
            document.getElementById('sol-box').classList.remove('hidden');
        }

        // --- LOGIC ---
        function handleAnswer(idx, btn, q) {
            const isCorrect = idx === q.correct_answer;
            const allBtns = document.querySelectorAll('#options-grid button');
            allBtns.forEach(b => b.disabled = true);

            if (isCorrect) {
                btn.classList.add('border-green-500', 'bg-green-50');
            } else {
                btn.classList.add('border-red-500', 'bg-red-50');
                allBtns[q.correct_answer].classList.add('border-green-500', 'bg-green-50');
            }

            logResult(isCorrect, q);
        }

        function handleSelfCheck(isCorrect) {
            const q = currentQuestions[currentIndex];
            logResult(isCorrect, q);
        }

        function logResult(isCorrect, q) {
            userAnswersLog.push({ q: q.question || q.q, correct: isCorrect, cat: q.category || "Allgemein" });
            
            const feedback = document.getElementById('feedback');
            const fText = document.getElementById('feedback-text');
            feedback.classList.remove('hidden');

            if(isCorrect) {
                fText.innerText = "Korrekt!";
                fText.className = "font-black text-lg uppercase mb-1 text-green-600";
            } else {
                fText.innerText = currentMode === 'drill' ? "Wiederholung!" : "Falsch!";
                fText.className = "font-black text-lg uppercase mb-1 text-orange-600";
                if(currentMode === 'drill') currentQuestions.push(q); // Drill-Loop
            }

            document.getElementById('hint-text').innerText = q.hint || q.explanation || "Kein zusätzlicher Hinweis verfügbar.";
            document.getElementById('q-total').innerText = currentQuestions.length;
        }

        function nextQuestion() {
            currentIndex++;
            showQuestion();
        }

        function exitQuiz() { location.reload(); }

        // --- FINAL ANALYSIS ---
        async function finishQuiz() {
            const container = document.getElementById('quiz-container');
            const score = userAnswersLog.filter(a => a.correct).length;
            const total = userAnswersLog.length;
            const percent = Math.round((score / total) * 100);
            
            // Notenschlüssel
            let grade = "6";
            if(percent >= 92) grade = "1";
            else if(percent >= 81) grade = "2";
            else if(percent >= 67) grade = "3";
            else if(percent >= 50) grade = "4";
            else if(percent >= 30) grade = "5";

            container.innerHTML = `
                <div class="p-10 text-center animate-modal">
                    <div class="w-24 h-24 bg-indigo-600 text-white rounded-full flex items-center justify-center text-4xl font-black mx-auto mb-6 shadow-xl shadow-indigo-200">${grade}</div>
                    <h2 class="text-3xl font-black text-slate-900 uppercase tracking-tighter">Analyse Abgeschlossen</h2>
                    <p class="text-slate-500 mt-2">Du hast ${score} von ${total} Aufgaben korrekt gelöst (${percent}%).</p>
                    
                    <div class="mt-10 space-y-4 text-left max-w-md mx-auto">
                        <h4 class="text-[10px] font-black uppercase text-slate-400 tracking-[0.2em]">Kompetenz-Profil</h4>
                        ${generateStatsHTML()}
                    </div>

                    <button onclick="location.reload()" class="mt-10 w-full bg-slate-900 text-white py-5 rounded-2xl font-black uppercase tracking-widest shadow-lg">Zurück zum Dashboard</button>
                </div>
            `;
        }

        function generateStatsHTML() {
            const cats = [...new Set(userAnswersLog.map(a => a.cat))];
            return cats.map(c => {
                const cAns = userAnswersLog.filter(a => a.cat === c);
                const cPerc = Math.round((cAns.filter(a => a.correct).length / cAns.length) * 100);
                return `
                    <div class="group">
                        <div class="flex justify-between text-xs font-bold mb-1 uppercase"><span>${c}</span><span>${cPerc}%</span></div>
                        <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                            <div class="bg-indigo-500 h-full transition-all duration-1000" style="width: ${cPerc}%"></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Dummy Functions for Sidebar (Keep original logic)
        function toggleProdigy() {
            const s = document.getElementById('prodigy-sidebar');
            const o = document.getElementById('prodigy-overlay');
            const isOpen = s.style.transform === 'translateX(0%)';
            s.style.transform = isOpen ? 'translateX(100%)' : 'translateX(0%)';
            o.classList.toggle('hidden');
            setTimeout(() => o.classList.toggle('opacity-100'), 10);
        }
    </script>
</body>
</html>
