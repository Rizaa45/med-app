<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLM System | Zwischenprüfung Schwerpunkte</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background: #fcfdfe; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        /* Elegante Scrollbar, auch auf Mobile gut bedienbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
</head>
<body class="min-h-screen">

    <!-- Responsive Navbar -->
    <nav class="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 h-16 sm:h-20 flex items-center justify-between gap-2">
            <!-- Back Button -->
            <button onclick="location.href='index.html'" class="group flex items-center shrink-0 text-slate-500 hover:text-violet-600 font-semibold transition-all p-2 -ml-2">
                <i class="fas fa-chevron-left sm:mr-2 group-hover:-translate-x-1 transition-transform"></i>
                <span class="hidden sm:inline text-sm uppercase tracking-wider">Dashboard</span>
            </button>
            
            <!-- Title -->
            <div class="text-center flex-1 min-w-0">
                <div class="font-extrabold text-slate-900 text-sm sm:text-lg uppercase tracking-tighter truncate">
                    Zwischenprüfung<span class="hidden sm:inline">: Schwerpunkte</span>
                </div>
                <p class="text-[8px] sm:text-[9px] text-violet-600 font-bold tracking-[0.2em] sm:tracking-[0.3em] uppercase mt-0.5 sm:mt-1 truncate">
                    SLM Core v.5.4 • Pflege Edition
                </p>
            </div>
            
            <!-- Spacer (hält den Titel bei flex-between mittig) -->
            <div class="w-8 sm:w-24 shrink-0"></div>
        </div>
    </nav>

    <!-- Main Container mit angepasstem Padding für Mobile -->
    <div class="max-w-4xl mx-auto px-4 sm:px-6 py-6 sm:py-8">
        
        <!-- Dropdown Card -->
        <div class="bg-white p-4 sm:p-6 rounded-3xl sm:rounded-[2rem] shadow-sm border border-slate-200 mb-6 sm:mb-8">
            <label class="block text-[9px] sm:text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-2 sm:mb-3 ml-1">
                Schwerpunkt auswählen
            </label>
            <div id="summary-dropdown-container"></div>
        </div>

        <div id="summary-display-area" class="hidden min-h-[400px]"></div>

        <!-- Welcome State -->
        <div id="welcome-state" class="text-center py-12 sm:py-20 px-4 bg-slate-50 rounded-3xl sm:rounded-[3rem] border-2 border-dashed border-slate-200">
            <div class="w-16 h-16 sm:w-20 sm:h-20 bg-white rounded-2xl sm:rounded-3xl shadow-sm flex items-center justify-center mx-auto mb-4 sm:mb-6">
                <i class="fas fa-graduation-cap text-2xl sm:text-3xl text-violet-500"></i>
            </div>
            <h3 class="text-lg sm:text-xl font-bold text-slate-800 mb-2">Prüfungsvorbereitung</h3>
            <p class="text-slate-500 text-xs sm:text-sm max-w-xs mx-auto italic">Wähle einen Schwerpunkt aus dem Dropdown-Menü.</p>
        </div>

    </div>

    <script>
        const topics = [
            { id: "1", title: "Fallorientierter Pflegeprozess" },
            { id: "2", title: "Kommunikationsstrategien" },
            { id: "3", title: "Personenzentrierter Ansatz" },
            { id: "4", title: "Gewalt in der Pflege" },
            { id: "5", title: "Ekel und Scham" },
            { id: "6", title: "Rollenkonflikte" },
            { id: "7", title: "Kollegiale Beratung" },
            { id: "8", title: "Ethische Prinzipien / Pflegecharta" },
            { id: "9", title: "Pflegerische Versorgung: Diabetes, Demenz, Gastroenteritis" }
        ];

        document.addEventListener('DOMContentLoaded', renderDropdown);

        function renderDropdown() {
            const container = document.getElementById('summary-dropdown-container');
            container.innerHTML = `
                <div class="relative">
                    <select onchange="handleTopicSelection(this.value)" 
                            class="w-full p-4 sm:p-5 text-sm sm:text-base bg-slate-50 border-2 border-slate-100 rounded-xl sm:rounded-2xl shadow-sm text-slate-800 font-bold focus:border-violet-500 focus:bg-white outline-none appearance-none cursor-pointer transition-all">
                        <option value="">Bitte Schwerpunkt wählen...</option>
                        ${topics.map(t => `<option value="${t.id}">${t.id}. ${t.title}</option>`).join('')}
                    </select>
                    <div class="absolute right-4 sm:right-5 top-1/2 -translate-y-1/2 pointer-events-none text-violet-500">
                        <i class="fas fa-chevron-down"></i>
                    </div>
                </div>
            `;
        }

        async function handleTopicSelection(id) {
            const displayArea = document.getElementById('summary-display-area');
            const welcomeState = document.getElementById('welcome-state');

            if (!id) {
                displayArea.classList.add('hidden');
                welcomeState.classList.remove('hidden');
                return;
            }

            welcomeState.classList.add('hidden');
            displayArea.classList.remove('hidden');

            displayArea.innerHTML = `
                <div class="flex flex-col items-center justify-center py-16 sm:py-20 text-violet-600 px-4 text-center">
                    <i class="fas fa-circle-notch animate-spin text-3xl sm:text-4xl mb-3 sm:mb-4"></i>
                    <p class="font-black uppercase tracking-widest text-[10px] sm:text-xs">Lade Schwerpunkt-Dossier...</p>
                </div>
            `;

            try {
                const response = await fetch(`data/schwerpunkt/thema${id}.json`);
                if (!response.ok) throw new Error("File not found");
                
                const data = await response.json();
                const content = data.find(item => String(item.id) === String(id));
                if (!content) throw new Error("ID not found in JSON");

                displayArea.innerHTML = `
                    <div class="fade-in bg-white rounded-[2rem] sm:rounded-[2.5rem] shadow-xl border border-slate-100 overflow-hidden mb-8 sm:mb-12">
                        
                        <!-- Header -->
                        <div class="bg-gradient-to-r from-violet-900 to-violet-700 p-6 sm:p-8 md:p-10 text-white relative overflow-hidden">
                            <!-- Background Icon -->
                            <div class="absolute -right-4 -top-4 sm:right-8 sm:top-8 opacity-10 text-7xl sm:text-6xl sm:rotate-12 pointer-events-none">
                                <i class="fas fa-file-medical"></i>
                            </div>
                            
                            <span class="relative z-10 bg-green-500 text-white px-3 sm:px-4 py-1 rounded-full text-[9px] sm:text-[10px] font-black uppercase tracking-[0.2em] mb-3 sm:mb-4 inline-block">
                                Schwerpunkt ${id}
                            </span>
                            
                            <h2 class="relative z-10 text-2xl sm:text-3xl font-black tracking-tight leading-tight pr-6 sm:pr-0">
                                ${content.topic}
                            </h2>
                            
                            <div class="relative z-10 flex flex-wrap gap-1.5 sm:gap-2 mt-4 sm:mt-6">
                                ${(content.tags || []).map(tag => `
                                    <span class="bg-white/10 backdrop-blur-md text-white/90 text-[9px] sm:text-[10px] px-2 sm:px-3 py-1 rounded-md sm:rounded-lg font-bold border border-white/10">#${tag}</span>
                                `).join('')}
                            </div>
                        </div>

                        <!-- Content Area (mit overflow-x-auto für Tabellen auf Mobile) -->
                        <div class="p-5 sm:p-8 md:p-12 overflow-x-auto">
                            ${content.content}
                        </div>

                        <!-- Footer -->
                        <div class="bg-slate-50 p-4 sm:p-6 border-t border-slate-100 flex justify-center">
                            <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})" 
                                    class="text-slate-400 hover:text-violet-600 font-bold text-[10px] sm:text-xs uppercase tracking-widest flex items-center gap-2 transition-all">
                                <i class="fas fa-arrow-up"></i> Zum Anfang
                            </button>
                        </div>
                    </div>
                `;
            } catch (error) {
                displayArea.innerHTML = `
                    <div class="p-8 sm:p-12 text-center bg-amber-50 rounded-3xl sm:rounded-[2.5rem] border-2 border-amber-100">
                        <i class="fas fa-triangle-exclamation text-amber-500 text-3xl sm:text-4xl mb-3 sm:mb-4"></i>
                        <h4 class="font-black text-amber-900 uppercase text-sm sm:text-base">In Entwicklung</h4>
                        <p class="text-amber-700 text-xs sm:text-sm mt-2">
                            Die Datei <b>thema${id}.json</b> ist noch nicht verfügbar.
                        </p>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
