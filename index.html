<!DOCTYPE html>
<html lang="de" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SLM System · Pflegeausbildung</title>
<meta name="description" content="KI-gestützte Lernplattform zur Vorbereitung auf Zwischen- & Abschlussprüfung der generalistischen Pflegeausbildung.">
<meta name="theme-color" content="#050811">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="css/tw.css">
<link rel="stylesheet" href="css/v8.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%236366f1'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='800'>S</text></svg>">
</head>
<body class="min-h-screen antialiased font-sans" style="background-color:#050811;color:#e2e8f0">
<noscript>
  <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#050811;color:#e2e8f0;font-family:sans-serif;text-align:center;padding:2rem">
    <div style="max-width:28rem">
      <div style="font-size:2rem;font-weight:800;margin-bottom:1rem">SLM System</div>
      <p style="color:#94a3b8;line-height:1.6">Diese App benötigt JavaScript. Bitte aktiviere JavaScript in deinem Browser und lade die Seite neu.</p>
    </div>
  </div>
</noscript>
<div class="page-bg" aria-hidden="true"></div>

<!-- Schwebende Glows (wie PageBackground der v8-App) -->
<div class="pointer-events-none fixed inset-0 z-0 overflow-hidden" aria-hidden="true">
  <div class="absolute -top-24 -left-24 h-96 w-96 rounded-full opacity-30 blur-3xl float-anim" style="background:radial-gradient(circle,#6366f1,transparent 70%)"></div>
  <div class="absolute top-1/3 -right-32 h-[28rem] w-[28rem] rounded-full opacity-20 blur-3xl float-anim" style="background:radial-gradient(circle,#8b5cf6,transparent 70%);animation-delay:1.5s"></div>
  <div class="absolute -bottom-32 left-1/4 h-80 w-80 rounded-full opacity-15 blur-3xl float-anim" style="background:radial-gradient(circle,#14b8a6,transparent 70%);animation-delay:3s"></div>
</div>

<div id="app-root" class="relative z-10"></div>
<div id="toast-root"></div>

<script>
/* ═══ FEHLER-SICHERHEITSNETZ ═══
   Zeigt jeden Boot-Fehler sichtbar als Karte statt einer leeren Seite. */
window.__SLM_BOOT_ERRORS__ = [];
function __slmShowFatalError(details) {
  try {
    var root = document.getElementById("app-root");
    if (!root) { window.setTimeout(function () { __slmShowFatalError(details); }, 100); return; }
    if (root.innerHTML.trim()) return; // App hat gerendert → nichts tun
    root.innerHTML =
      '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem">' +
      '<div style="max-width:28rem;width:100%;background:rgba(15,23,42,0.9);border:1px solid rgba(248,113,113,0.3);border-radius:1.5rem;padding:2rem;text-align:center">' +
      '<div style="width:3.5rem;height:3.5rem;margin:0 auto 1rem;border-radius:0.75rem;background:rgba(239,68,68,0.15);display:flex;align-items:center;justify-content:center;font-size:1.5rem">⚠</div>' +
      '<div style="font-weight:800;font-size:1.1rem;color:#fff;margin-bottom:0.5rem">Die App konnte nicht starten</div>' +
      '<p style="font-size:0.8rem;color:#94a3b8;line-height:1.6;margin-bottom:1rem">Bitte lade die Seite neu. Wenn der Fehler bleibt, prüfe, ob der komplette Ordner (js/, css/, fonts/) entpackt wurde.</p>' +
      '<pre style="font-size:0.65rem;color:#f87171;background:rgba(0,0,0,0.3);border-radius:0.5rem;padding:0.75rem;text-align:left;overflow:auto;max-height:10rem">' + String(details).replace(/</g, "&lt;") + "</pre>" +
      '<button onclick="location.reload()" style="margin-top:1rem;width:100%;padding:0.75rem 1rem;border:0;border-radius:0.75rem;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-weight:800;cursor:pointer">Neu laden</button>' +
      "</div></div>";
  } catch (e) { /* absoluter Notfall */ }
}
window.addEventListener("error", function (e) {
  window.__SLM_BOOT_ERRORS__.push(String(e.message || e.error || e));
  __slmShowFatalError(window.__SLM_BOOT_ERRORS__.join("\n"));
});
window.addEventListener("unhandledrejection", function (e) {
  window.__SLM_BOOT_ERRORS__.push("Promise: " + String(e.reason));
});
</script>

<script src="js/data-local.js"></script>
<script src="js/icons.js"></script>
<script src="js/v8-core.js"></script>
<script src="js/v8-data.js"></script>
<script src="js/v8-exam-engine.js"></script>
<script src="js/v8-bibliothek.js"></script>
<script src="js/v8-training.js"></script>
<script src="js/v8-notizbuch.js"></script>
<script src="js/v8-profil.js"></script>
<script>
/* ════════════════════════════════════════════════════════════════
   APP BOOT — Login-Gate + AppShell + Hash-Router
   ════════════════════════════════════════════════════════════════ */
const App = {
  shell() {
    const user = V8Auth.get();
    const NAV = [
      { view: "bibliothek", label: "Bibliothek", icon: "book-open", href: "#/bibliothek" },
      { view: "training", label: "Training", icon: "dumbbell", href: "#/training" },
      { view: "notizbuch", label: "Notizbuch", icon: "notebook", href: "#/notizbuch" },
      { view: "profil", label: "Profil", icon: "user", href: "#/profil" },
    ];
    const path = V8Router.current();
    const activeRoute = "/" + (path.split("/").filter(Boolean)[0] || "bibliothek");
    return `
    <div class="relative flex min-h-screen flex-col">
      <header class="sticky top-0 z-40 safe-top">
        <div class="glass-strong border-b border-white/5">
          <div class="mx-auto flex max-w-7xl items-center gap-3 px-3 py-2.5 sm:px-5">
            <button onclick="V8Router.go('/bibliothek')" class="flex items-center gap-2 active:scale-95 transition-transform">
              <div class="gradient-indigo flex h-9 w-9 items-center justify-center rounded-xl shadow-lg shadow-violet-500/30">
                <i data-lucide="library" class="h-4 w-4 text-white"></i>
              </div>
              <div class="hidden sm:block leading-none text-left">
                <div class="text-sm font-black tracking-tight text-white">SLM System</div>
                <div class="text-[9px] font-semibold uppercase tracking-widest text-violet-400/80">v8 · Pflege</div>
              </div>
            </button>
            <nav class="ml-4 hidden items-center gap-1 lg:flex">
              ${NAV.map((n) => `
                <button onclick="V8Router.go('${n.href.replace("#/", "/").replace("#", "")}')" class="flex items-center gap-1.5 rounded-xl px-3 py-2 text-xs font-bold transition-all ${activeRoute === "/" + n.view ? "bg-violet-500/15 text-violet-300 ring-1 ring-violet-500/30" : "text-slate-400 hover:bg-white/5 hover:text-slate-200"}">
                  <i data-lucide="${n.icon}" class="h-3.5 w-3.5"></i>${n.label}
                </button>`).join("")}
            </nav>
            <div class="ml-auto flex items-center gap-2">
              ${V8Auth.isAdmin() ? `
              <span class="hidden items-center gap-1 rounded-xl border border-amber-500/30 bg-amber-500/10 px-2.5 py-1.5 text-[10px] font-black uppercase tracking-wider text-amber-300 sm:flex">
                <i data-lucide="shield-check" class="h-3 w-3"></i> Admin
              </span>` : ""}
              <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-br from-violet-500 to-indigo-500 text-[10px] font-black text-white">${esc((user?.name || "?")[0].toUpperCase())}</div>
              <button onclick="App.logout()" class="flex h-9 w-9 items-center justify-center rounded-xl border border-white/10 bg-white/5 text-slate-400 hover:text-red-300 active:scale-95 transition" title="Ausloggen">
                <i data-lucide="log-out" class="h-4 w-4"></i>
              </button>
            </div>
          </div>
        </div>
      </header>

      <main class="flex-1 pb-24 lg:pb-8" id="view-root"></main>

      <footer class="mt-auto border-t border-white/5 py-6 text-center">
        <div class="mx-auto max-w-7xl px-4">
          <p class="text-[11px] font-medium text-slate-500">
            <span class="gradient-text font-black">SLM System v8.0</span> · KI-gestützte Lernplattform · Generalistische Pflegeausbildung (PflBG / PflAPrV)
          </p>
        </div>
      </footer>

      <nav class="fixed bottom-0 left-0 right-0 z-40 lg:hidden safe-bottom">
        <div class="glass-strong border-t border-white/5">
          <div class="mx-auto flex max-w-md items-center justify-around px-2 py-1.5">
            ${NAV.map((n) => `
            <button onclick="V8Router.go('${n.href.replace("#/", "/").replace("#", "")}')" class="flex flex-1 flex-col items-center gap-0.5 rounded-xl px-2 py-1.5 transition-all ${activeRoute === "/" + n.view ? "text-violet-300" : "text-slate-500"}">
              <i data-lucide="${n.icon}" class="h-5 w-5"></i>
              <span class="text-[9px] font-bold">${n.label}</span>
            </button>`).join("")}
          </div>
        </div>
      </nav>
    </div>`;
  },

  render() {
    const root = document.getElementById("app-root");
    if (!V8Auth.get()) {
      root.innerHTML = LoginScreen();
      refreshIcons();
      bindLogin();
      return;
    }
    root.innerHTML = this.shell();
    refreshIcons();
    V8Router.start();
  },

  logout() {
    if (!confirm("Wirklich ausloggen?")) return;
    V8Auth.logout();
    this.render();
  },
};

/* ═══ LOGIN (v8-Design) ═══ */
function LoginScreen() {
  return `
  <div class="relative flex min-h-screen items-center justify-center overflow-hidden p-4">
    <div class="pointer-events-none fixed inset-0 z-0 overflow-hidden" aria-hidden="true">
      <div class="absolute -top-32 left-1/4 h-96 w-96 rounded-full bg-violet-600/20 blur-3xl float-anim"></div>
      <div class="absolute -bottom-32 right-1/4 h-96 w-96 rounded-full bg-indigo-600/15 blur-3xl float-anim" style="animation-delay:2s"></div>
    </div>
    <div class="relative z-10 w-full max-w-md anim-modal">
      <div class="gradient-indigo relative overflow-hidden rounded-t-3xl p-8 text-center">
        <div class="absolute inset-0 opacity-30" style="background-image:radial-gradient(circle,rgba(255,255,255,0.15) 1px,transparent 1px);background-size:24px 24px"></div>
        <div class="relative z-10">
          <div class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-2xl bg-white/15 backdrop-blur float-anim ring-2 ring-white/20">
            <i data-lucide="heart-pulse" class="h-8 w-8 text-white"></i>
          </div>
          <h1 class="text-3xl font-black tracking-tight text-white">SLM System</h1>
          <p class="mt-1 text-sm font-semibold text-violet-100">Pflegeausbildung · KI-Lernplattform</p>
          <div class="mt-3 inline-flex items-center gap-1.5 rounded-full bg-white/15 px-3 py-1 text-[10px] font-bold uppercase tracking-widest text-white">v8.0</div>
        </div>
      </div>
      <div class="glass-strong rounded-b-3xl border border-t-0 border-white/8 p-6">
        <label class="mb-1.5 block text-[11px] font-bold uppercase tracking-wider text-slate-400">Mit Namen anmelden</label>
        <div class="flex gap-2">
          <input id="login-name" type="text" placeholder="Vor- und Nachname" autocomplete="name"
            class="w-full rounded-2xl border border-white/10 bg-white/5 px-3.5 py-3 text-sm font-bold text-slate-100 outline-none focus:border-violet-400/50" />
          <button id="login-btn" class="gradient-indigo flex items-center justify-center rounded-2xl px-5 text-xs font-black uppercase tracking-wider text-white active:scale-95 transition-all">
            <i data-lucide="arrow-right" class="h-4 w-4"></i>
          </button>
        </div>
        <p class="mt-2 text-[10px] text-slate-500">Dein Profil, Fortschritt und Notizen bleiben lokal auf diesem Gerät gespeichert.</p>

        <div class="my-5 flex items-center gap-3">
          <div class="h-px flex-1 bg-white/10"></div>
          <span class="text-[10px] font-bold uppercase tracking-widest text-slate-600">Admin</span>
          <div class="h-px flex-1 bg-white/10"></div>
        </div>

        <div class="flex items-center justify-center gap-2" id="pin-row">
          ${[0, 1, 2, 3].map((i) => `<input id="pin-${i}" inputmode="numeric" maxlength="1" class="pin-box" data-pin="${i}">`).join("")}
        </div>
        <p class="mt-2 text-center text-[10px] text-slate-500" id="pin-hint">4-stellige Admin-PIN ${V8Auth.hasAdminPin() ? "eingeben" : "festlegen (erste Nutzung)"}</p>
      </div>
    </div>
  </div>`;
}

function bindLogin() {
  const nameInput = document.getElementById("login-name");
  const doLogin = () => {
    const name = nameInput.value.trim();
    if (!name) { V8Toast.error("Bitte Namen eingeben!"); nameInput.focus(); return; }
    V8Auth.login(name, "schueler");
    V8Toast.success(`Willkommen, ${name.split(" ")[0]}!`);
    App.render();
  };
  document.getElementById("login-btn").addEventListener("click", doLogin);
  nameInput.addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });

  // PIN-Logik (4 Boxen, Auto-Advance, Backspace, Enter)
  const boxes = [0, 1, 2, 3].map((i) => document.getElementById(`pin-${i}`));
  boxes.forEach((box, i) => {
    box.addEventListener("input", () => {
      if (!/^\d?$/.test(box.value)) { box.value = ""; return; }
      if (box.value && i < 3) boxes[i + 1].focus();
    });
    box.addEventListener("keydown", (e) => {
      if (e.key === "Backspace" && !box.value && i > 0) boxes[i - 1].focus();
      if (e.key === "Enter") submitPin();
    });
  });
  function submitPin() {
    const code = boxes.map((b) => b.value).join("");
    if (code.length !== 4) { V8Toast.error("PIN muss 4 Ziffern sein."); return; }
    if (V8Auth.checkAdminPin(code)) {
      V8Auth.login("Admin", "admin");
      V8Toast.success("Willkommen, Admin!");
      App.render();
    } else {
      boxes.forEach((b) => (b.value = ""));
      boxes[0].focus();
      V8Toast.error("Falscher PIN.");
    }
  }
}

/* ═══ ROUTEN REGISTRIEREN + START ═══ */
V8Router.register("/bibliothek", (path) => renderBibliothek(path));
V8Router.register("/training", () => renderTraining());
V8Router.register("/notizbuch", (path) => renderNotizbuch(path));
V8Router.register("/profil", () => renderProfil());

App.render();

/* Boot-Check: Wenn nach 2,5 s nichts gerendert wurde, Fehlerkarte zeigen. */
window.setTimeout(function () {
  var root = document.getElementById("app-root");
  if (root && !root.innerHTML.trim()) {
    __slmShowFatalError(window.__SLM_BOOT_ERRORS__.join("\n") || "Keine Fehler gemeldet — vermutlich fehlende Dateien (js/ oder css/ Ordner nicht entpackt?).");
  }
}, 2500);
</script>
</body>
</html>
