<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLM Lernheft</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  * { font-family: 'Inter', sans-serif; }
  body { background: #f0f4f8; color: #1e293b; }

  /* ── Flip Card ── */
  .flip-card { perspective: 1000px; cursor: pointer; height: 200px; }
  .flip-inner { position:relative; width:100%; height:100%; transition:transform .5s; transform-style:preserve-3d; }
  .flip-card.flipped .flip-inner { transform:rotateY(180deg); }
  .flip-front, .flip-back { position:absolute; width:100%; height:100%; backface-visibility:hidden; border-radius:16px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; text-align:center; }
  .flip-back { transform:rotateY(180deg); }

  /* ── Answer options ── */
  .ans-opt { border:2px solid #e2e8f0; border-radius:10px; padding:10px 14px; cursor:pointer; transition:all .15s; font-size:.875rem; text-align:left; width:100%; }
  .ans-opt:hover { border-color:#6366f1; background:#eef2ff; }
  .ans-opt.selected { border-color:#6366f1; background:#eef2ff; color:#3730a3; }
  .ans-opt.correct { border-color:#16a34a !important; background:#f0fdf4 !important; color:#15803d !important; }
  .ans-opt.wrong { border-color:#dc2626 !important; background:#fef2f2 !important; color:#b91c1c !important; }

  /* ── Match drag ── */
  .match-chip { cursor:grab; user-select:none; background:#e0e7ff; color:#3730a3; border:2px solid #a5b4fc; border-radius:8px; padding:6px 12px; font-size:.8rem; font-weight:600; display:inline-block; margin:3px; transition:all .2s; }
  .match-chip:hover { background:#c7d2fe; }
  .match-chip.placed { opacity:.4; cursor:not-allowed; }
  .drop-zone { min-height:40px; border:2px dashed #cbd5e1; border-radius:8px; padding:4px 8px; transition:all .2s; background:#f8fafc; font-size:.8rem; color:#94a3b8; display:flex; align-items:center; }
  .drop-zone.drag-over { border-color:#6366f1; background:#eef2ff; }
  .drop-zone.filled { border-color:#6366f1; background:#eef2ff; color:#3730a3; font-weight:600; }
  .drop-zone.correct { border-color:#16a34a; background:#f0fdf4; color:#15803d; }
  .drop-zone.wrong { border-color:#dc2626; background:#fef2f2; color:#b91c1c; }

  /* ── TF buttons ── */
  .tf-btn { flex:1; padding:10px; border-radius:10px; font-weight:700; font-size:.875rem; border:2px solid; cursor:pointer; transition:all .2s; }
  .tf-btn.richtig { border-color:#bbf7d0; color:#15803d; background:#f0fdf4; }
  .tf-btn.falsch { border-color:#fecaca; color:#b91c1c; background:#fef2f2; }
  .tf-btn:hover.richtig { background:#dcfce7; }
  .tf-btn:hover.falsch { background:#fee2e2; }
  .tf-btn.selected-r { background:#16a34a; color:white; border-color:#16a34a; }
  .tf-btn.selected-f { background:#dc2626; color:white; border-color:#dc2626; }

  /* ── Fill input ── */
  .fill-input { border:2px solid #e2e8f0; border-radius:8px; padding:8px 12px; font-size:.875rem; outline:none; transition:border-color .2s; width:100%; }
  .fill-input:focus { border-color:#6366f1; }
  .fill-input.ok { border-color:#16a34a; background:#f0fdf4; }
  .fill-input.nope { border-color:#dc2626; background:#fef2f2; }

  /* ── Progress ── */
  .prog-bar { height:6px; background:#e2e8f0; border-radius:9999px; overflow:hidden; }
  .prog-fill { height:100%; background:linear-gradient(90deg,#6366f1,#8b5cf6); border-radius:9999px; transition:width .4s ease; }

  /* ── Module tab active ── */
  .mod-tab { border:2px solid #e2e8f0; border-radius:10px; padding:6px 12px; font-size:.75rem; font-weight:700; cursor:pointer; transition:all .2s; background:white; color:#64748b; }
  .mod-tab.active { background:#6366f1; color:white; border-color:#6366f1; }
  .mod-tab:hover:not(.active) { border-color:#a5b4fc; color:#4f46e5; }

  /* ── Mode tab ── */
  .mode-tab { padding:8px 16px; border-radius:10px; font-weight:700; font-size:.8rem; cursor:pointer; transition:all .2s; background:white; color:#64748b; border:2px solid #e2e8f0; }
  .mode-tab.active { background:#6366f1; color:white; border-color:#6366f1; }

  /* ── Card ── */
  .lc { background:white; border-radius:16px; box-shadow:0 1px 8px rgba(0,0,0,.06); padding:20px; margin-bottom:16px; }
  .lc-tf { border-left:4px solid #8b5cf6; }
  .lc-fill { border-left:4px solid #f59e0b; }
  .lc-match { border-left:4px solid #06b6d4; }

  /* ── Badge ── */
  .badge { display:inline-flex; align-items:center; gap:4px; font-size:.7rem; font-weight:700; padding:3px 8px; border-radius:9999px; }
  .badge-tf { background:#ede9fe; color:#7c3aed; }
  .badge-fill { background:#fef3c7; color:#d97706; }
  .badge-match { background:#cffafe; color:#0e7490; }
  .badge-mc { background:#dbeafe; color:#1d4ed8; }

  /* ── Feedback ── */
  .fb { border-radius:8px; padding:8px 12px; font-size:.8rem; font-weight:600; margin-top:8px; }
  .fb-ok { background:#f0fdf4; color:#15803d; border:1px solid #bbf7d0; }
  .fb-no { background:#fef2f2; color:#b91c1c; border:1px solid #fecaca; }

  /* ── Quiz result ── */
  .quiz-result-circle { width:100px; height:100px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.75rem; font-weight:900; margin:0 auto 16px; }

  /* ── Loading ── */
  .spinner { width:40px; height:40px; border:4px solid #e2e8f0; border-top-color:#6366f1; border-radius:50%; animation:spin 1s linear infinite; margin:0 auto; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* scrollbar */
  ::-webkit-scrollbar { width:5px; }
  ::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:3px; }
</style>
</head>
<body class="min-h-screen">

<!-- HEADER -->
<header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
  <div class="max-w-4xl mx-auto px-4 h-14 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center">
        <i class="fas fa-book-open text-white text-sm"></i>
      </div>
      <div>
        <span class="font-black text-slate-800 text-sm">SLM Lernheft</span>
        <span class="text-xs text-slate-400 ml-2 font-medium">Easy Mode</span>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <div class="text-right hidden sm:block">
        <div class="text-xs font-bold text-slate-500" id="global-pct-txt">0% gelernt</div>
        <div class="prog-bar w-24 mt-1"><div class="prog-fill" id="global-pct-bar" style="width:0%"></div></div>
      </div>
      <button onclick="resetProgress()" title="Fortschritt zurücksetzen" class="text-slate-400 hover:text-red-500 transition-colors text-sm">
        <i class="fas fa-rotate-left"></i>
      </button>
    </div>
  </div>
</header>

<!-- MAIN -->
<main class="max-w-4xl mx-auto px-4 py-6">

  <!-- MODULE SELECTOR -->
  <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4 mb-5">
    <div class="text-xs font-black text-slate-400 uppercase tracking-widest mb-3">Modul wählen</div>
    <div id="mod-tabs" class="flex flex-wrap gap-2"></div>
  </div>

  <!-- LOADING -->
  <div id="loading-area" class="text-center py-16">
    <div class="spinner mb-4"></div>
    <p class="text-slate-500 font-medium text-sm">Lade Fragenbank…</p>
  </div>

  <!-- ERROR -->
  <div id="error-area" class="hidden bg-red-50 border border-red-200 rounded-2xl p-6 text-center">
    <i class="fas fa-exclamation-circle text-red-400 text-3xl mb-3"></i>
    <p id="error-msg" class="text-red-700 font-semibold text-sm"></p>
  </div>

  <!-- CONTENT (shown after load) -->
  <div id="main-area" class="hidden">
    <!-- MODULE INFO -->
    <div class="flex items-center justify-between mb-4">
      <div>
        <h2 id="mod-title" class="text-lg font-black text-slate-800"></h2>
        <p id="mod-subtitle" class="text-xs text-slate-400 font-medium"></p>
      </div>
      <div class="text-right">
        <div class="text-xs font-bold text-slate-400" id="mod-pct-txt">0% fertig</div>
        <div class="prog-bar w-20 mt-1"><div class="prog-fill" id="mod-pct-bar" style="width:0%"></div></div>
      </div>
    </div>

    <!-- MODE TABS -->
    <div class="flex gap-2 mb-5 flex-wrap">
      <button onclick="setMode('learn')" id="mTab-learn" class="mode-tab active">
        <i class="fas fa-graduation-cap mr-1.5"></i>Lernen
      </button>
      <button onclick="setMode('cards')" id="mTab-cards" class="mode-tab">
        <i class="fas fa-clone mr-1.5"></i>Karten
      </button>
      <button onclick="setMode('quiz')" id="mTab-quiz" class="mode-tab">
        <i class="fas fa-bolt mr-1.5"></i>Quiz
      </button>
    </div>

    <!-- CONTENT AREA -->
    <div id="content-area"></div>
  </div>

</main>

<script>
// ═══════════════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════════════
const MODULES = [
  {id:1, name:"Kommunikation & Biografie", short:"M1"},
  {id:2, name:"Medizinisches Kernwissen",  short:"M2"},
  {id:3, name:"Krankheitslehre",           short:"M3"},
  {id:4, name:"Schwangerschaft & Geburt",  short:"M4"},
  {id:5, name:"Prä- & Postop. Pflege",     short:"M5"},
  {id:6, name:"Notfall & Reanimation",     short:"M6"},
  {id:7, name:"Ambulante & Chron. Pflege", short:"M7"},
  {id:8, name:"Innere Medizin & Niere",    short:"M8"},
  {id:9, name:"Neurologische Reha",        short:"M9"},
];

// ═══════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════
let currentMod = 1;
let currentMode = 'learn';
let bankData = [];         // raw question bank
let learnItems = [];       // generated learn questions
let progress = JSON.parse(localStorage.getItem('slm_lernheft_v3') || '{}');
let quizState = {};
let cardIdx = 0;
let dragSource = null;

// ═══════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  buildModTabs();
  loadModule(1);
  updateGlobalProgress();
});

function buildModTabs() {
  const c = document.getElementById('mod-tabs');
  MODULES.forEach(m => {
    const b = document.createElement('button');
    b.className = `mod-tab ${m.id===1?'active':''}`;
    b.id = `modBtn-${m.id}`;
    b.textContent = m.short;
    b.title = m.name;
    b.onclick = () => loadModule(m.id);
    c.appendChild(b);
  });
}

// ═══════════════════════════════════════════════
//  LOAD MODULE
// ═══════════════════════════════════════════════
async function loadModule(id) {
  currentMod = id;
  currentMode = 'learn';
  cardIdx = 0;

  // update tab styles
  MODULES.forEach(m => {
    const b = document.getElementById(`modBtn-${m.id}`);
    if(b) b.className = `mod-tab ${m.id===id?'active':''}`;
  });

  show('loading-area'); hide('error-area'); hide('main-area');

  try {
    const url = `data/question-banks/module${id}_questions.json`;
    const resp = await fetch(url);
    if(!resp.ok) throw new Error(`Datei nicht gefunden: ${url}`);
    bankData = await resp.json();
    if(!Array.isArray(bankData) || !bankData.length) throw new Error('Fragenbank ist leer.');

    // generate learn items from bank
    learnItems = generateLearnItems(bankData, id);

    const mod = MODULES.find(m=>m.id===id);
    document.getElementById('mod-title').textContent = mod.name;
    document.getElementById('mod-subtitle').textContent = `${learnItems.length} Lerneinheiten aus ${bankData.length} Fragen`;

    hide('loading-area'); show('main-area');
    setMode('learn');
    updateModProgress();
    updateGlobalProgress();
  } catch(e) {
    hide('loading-area'); show('error-area');
    document.getElementById('error-msg').textContent = e.message;
  }
}

// ═══════════════════════════════════════════════
//  GENERATE LEARN ITEMS FROM QUESTION BANK
// ═══════════════════════════════════════════════
function generateLearnItems(bank, modId) {
  const items = [];
  const shuffled = shuffle([...bank]);

  shuffled.forEach((q, idx) => {
    if(!q || !q.question) return;

    const qText = cleanText(q.question);
    const type = q.type || 'mc';

    // ── True/False ──
    if(type === 'true_false' || type === 'tf') {
      items.push({
        type: 'tf',
        id: `m${modId}_tf_${idx}`,
        q: shortenText(qText, 120),
        correct: q.correct_answer === true || q.correct_answer === 'true' || q.correct_answer === 'Richtig',
        topic: q.topic || q.thema || ''
      });
    }

    // ── MC → generate TF + MC ──
    else if(type === 'mc' || type === 'multiple_choice' || !type) {
      const opts = getOptions(q);
      const correctOpt = getCorrectOption(q, opts);
      if(!correctOpt) return;

      const correctText = cleanText(correctOpt);
      const correctShort = shortenText(correctText, 80);

      // Make a TF from it (50% chance)
      if(idx % 3 === 0 && correctShort) {
        const isTrueStatement = Math.random() > 0.4;
        if(isTrueStatement) {
          items.push({
            type: 'tf',
            id: `m${modId}_tf_${idx}`,
            q: makeShortStatement(qText, correctShort, true),
            correct: true,
            topic: q.topic || ''
          });
        } else {
          const wrongOpt = opts.find(o => cleanText(o) !== correctText);
          if(wrongOpt) {
            items.push({
              type: 'tf',
              id: `m${modId}_tf_${idx}`,
              q: makeShortStatement(qText, cleanText(wrongOpt), false),
              correct: false,
              topic: q.topic || ''
            });
          }
        }
      }

      // Fill-in-blank
      if(idx % 3 === 1 && correctShort.split(' ').length <= 5) {
        const blank = makeFillBlank(qText, correctShort);
        if(blank) {
          items.push({
            type: 'fill',
            id: `m${modId}_fill_${idx}`,
            q: blank.sentence,
            answer: blank.answer,
            topic: q.topic || ''
          });
        }
      }

      // Keep as MC
      if(opts.length >= 3) {
        items.push({
          type: 'mc',
          id: `m${modId}_mc_${idx}`,
          q: shortenText(qText, 150),
          opts: shuffle(opts.map(o=>shortenText(cleanText(o),80))).slice(0,4),
          correct: shortenText(correctText, 80),
          topic: q.topic || ''
        });
      }
    }

    // ── Short Answer ──
    else if(type === 'short_answer' || type === 'kurz') {
      const ans = cleanText(q.sample_answer || q.answer || q.correct_answer || '');
      if(ans) {
        items.push({
          type: 'fill',
          id: `m${modId}_fill_${idx}`,
          q: shortenText(qText, 120),
          answer: shortenText(ans.split('.')[0].split(',')[0], 60),
          topic: q.topic || ''
        });
      }
    }
  });

  // Generate match sets (every 8 items, create one match)
  const matchSets = buildMatchSets(shuffled, modId);
  matchSets.forEach(ms => items.push(ms));

  return shuffle(items).slice(0, Math.min(items.length, 40));
}

function getOptions(q) {
  if(q.options && Array.isArray(q.options)) return q.options;
  if(q.answers && Array.isArray(q.answers)) return q.answers;
  const opts = [];
  ['a','b','c','d','A','B','C','D'].forEach(k => { if(q[k]) opts.push(q[k]); });
  return opts;
}

function getCorrectOption(q, opts) {
  if(q.correct_answer !== undefined) {
    const ca = q.correct_answer;
    if(typeof ca === 'string') {
      // might be "A", "B", index, or the actual text
      if(ca.length === 1 && /[A-Da-d]/.test(ca)) {
        const idx = ca.toLowerCase().charCodeAt(0) - 97;
        return opts[idx] || null;
      }
      return opts.find(o => cleanText(o) === cleanText(ca)) || ca;
    }
    if(typeof ca === 'number') return opts[ca] || null;
  }
  if(q.correct !== undefined) {
    const c = q.correct;
    if(typeof c === 'number') return opts[c] || null;
    return opts.find(o => cleanText(o) === cleanText(String(c))) || String(c);
  }
  return opts[0] || null;
}

function buildMatchSets(bank, modId) {
  const sets = [];
  // Collect Q→A pairs suitable for matching
  const pairs = [];
  bank.forEach((q,i) => {
    if(!q || !q.question) return;
    const opts = getOptions(q);
    const correct = getCorrectOption(q, opts);
    if(!correct) return;
    const qShort = extractKeyTerm(q.question);
    const aShort = extractKeyTerm(String(correct));
    if(qShort && aShort && qShort !== aShort && qShort.length < 40 && aShort.length < 40) {
      pairs.push({left: qShort, right: aShort});
    }
  });
  if(pairs.length >= 4) {
    // Make sets of 4
    for(let i=0; i < pairs.length && sets.length < 3; i+=4) {
      const chunk = pairs.slice(i, i+4);
      if(chunk.length === 4) {
        sets.push({
          type: 'match',
          id: `m${modId}_match_${i}`,
          q: 'Ordne die Begriffe richtig zu:',
          pairs: chunk,
          topic: ''
        });
      }
    }
  }
  return sets;
}

function extractKeyTerm(text) {
  if(!text) return '';
  const t = cleanText(text);
  // Remove common question words
  const cleaned = t
    .replace(/^(was ist|was bedeutet|welche|wann|wie viele|wie lautet|nennen sie|beschreiben sie|welcher|welches)\s*/i,'')
    .replace(/\?$/, '')
    .replace(/\.$/, '');
  // Take first 5 words max
  return cleaned.split(' ').slice(0,5).join(' ').trim();
}

function makeShortStatement(q, answer, isTrue) {
  // Create a short, clear true/false statement
  const qClean = shortenText(q.replace(/\?$/,''), 80).replace(/^(Was ist|Was bedeutet|Welche|Nennen Sie)\s*/i,'');
  if(isTrue) {
    return `${qClean}: ${answer}.`;
  } else {
    return `${qClean}: ${answer}.`;
  }
}

function makeFillBlank(question, answer) {
  if(!answer || answer.length < 2) return null;
  // Create: "Der Begriff ___ beschreibt X"
  const qClean = shortenText(question, 100).replace(/\?$/,'');
  return {
    sentence: `${qClean}: _____.`,
    answer: answer
  };
}

function cleanText(t) {
  if(!t) return '';
  return String(t).replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();
}

function shortenText(t, max) {
  if(!t) return '';
  t = cleanText(t);
  if(t.length <= max) return t;
  return t.substring(0, max-1).replace(/\s\S*$/, '') + '…';
}

function shuffle(arr) { return [...arr].sort(()=>Math.random()-.5); }

// ═══════════════════════════════════════════════
//  PROGRESS
// ═══════════════════════════════════════════════
function markDone(key) {
  progress[key] = true;
  localStorage.setItem('slm_lernheft_v3', JSON.stringify(progress));
  updateModProgress();
  updateGlobalProgress();
}

function updateModProgress() {
  if(!learnItems.length) return;
  const done = learnItems.filter(it => progress[it.id]).length;
  const pct = Math.round(done/learnItems.length*100);
  const bar = document.getElementById('mod-pct-bar');
  const txt = document.getElementById('mod-pct-txt');
  if(bar) bar.style.width = pct+'%';
  if(txt) txt.textContent = `${done}/${learnItems.length} fertig`;
}

function updateGlobalProgress() {
  const keys = Object.keys(progress).filter(k=>progress[k]);
  // Estimate total: assume ~20 items per module
  const total = MODULES.length * 20;
  const pct = Math.min(100, Math.round(keys.length/total*100));
  const bar = document.getElementById('global-pct-bar');
  const txt = document.getElementById('global-pct-txt');
  if(bar) bar.style.width = pct+'%';
  if(txt) txt.textContent = pct+'% gelernt';
}

function resetProgress() {
  if(!confirm('Gesamten Fortschritt zurücksetzen?')) return;
  progress = {};
  localStorage.removeItem('slm_lernheft_v3');
  updateModProgress();
  updateGlobalProgress();
  renderContent();
}

// ═══════════════════════════════════════════════
//  MODE
// ═══════════════════════════════════════════════
function setMode(mode) {
  currentMode = mode;
  ['learn','cards','quiz'].forEach(m => {
    const b = document.getElementById(`mTab-${m}`);
    if(b) b.className = `mode-tab ${m===mode?'active':''}`;
  });
  renderContent();
}

function renderContent() {
  const area = document.getElementById('content-area');
  if(!area) return;
  if(currentMode === 'learn') renderLearn(area);
  else if(currentMode === 'cards') renderCards(area);
  else if(currentMode === 'quiz') renderQuiz(area);
}

// ═══════════════════════════════════════════════
//  LEARN MODE
// ═══════════════════════════════════════════════
function renderLearn(area) {
  if(!learnItems.length) {
    area.innerHTML = '<p class="text-slate-400 text-center py-12 text-sm">Keine Lernfragen verfügbar.</p>';
    return;
  }

  // Group by type
  const tfs = learnItems.filter(i=>i.type==='tf');
  const fills = learnItems.filter(i=>i.type==='fill');
  const matches = learnItems.filter(i=>i.type==='match');
  const mcs = learnItems.filter(i=>i.type==='mc');

  let html = '';

  // ── True/False section ──
  if(tfs.length) {
    html += `<div class="flex items-center gap-2 mb-3 mt-1">
      <span class="badge badge-tf"><i class="fas fa-check-circle mr-1"></i>Richtig / Falsch</span>
      <div class="flex-1 h-px bg-slate-200"></div>
    </div>`;
    tfs.forEach(item => {
      const done = progress[item.id];
      html += `
      <div class="lc lc-tf" id="card-${item.id}">
        ${item.topic ? `<div class="text-xs text-slate-400 font-semibold mb-2">${item.topic}</div>` : ''}
        <p class="text-sm font-semibold text-slate-700 mb-3 leading-snug">${item.q}</p>
        <div class="flex gap-2 mb-2">
          <button class="tf-btn richtig" id="tf-r-${item.id}" onclick="checkTF('${item.id}',true,${item.correct})">✓ Richtig</button>
          <button class="tf-btn falsch" id="tf-f-${item.id}" onclick="checkTF('${item.id}',false,${item.correct})">✗ Falsch</button>
        </div>
        <div id="fb-${item.id}" class="hidden"></div>
        ${done ? '<div class="text-xs text-green-600 font-bold mt-1"><i class="fas fa-check mr-1"></i>Bereits gewusst</div>' : ''}
      </div>`;
    });
  }

  // ── Fill-in section ──
  if(fills.length) {
    html += `<div class="flex items-center gap-2 mb-3 mt-4">
      <span class="badge badge-fill"><i class="fas fa-pen mr-1"></i>Lückentext</span>
      <div class="flex-1 h-px bg-slate-200"></div>
    </div>`;
    fills.forEach(item => {
      const done = progress[item.id];
      html += `
      <div class="lc lc-fill" id="card-${item.id}">
        ${item.topic ? `<div class="text-xs text-slate-400 font-semibold mb-2">${item.topic}</div>` : ''}
        <p class="text-sm font-semibold text-slate-700 mb-3 leading-snug">${item.q}</p>
        <div class="flex gap-2">
          <input type="text" id="fill-${item.id}" class="fill-input" placeholder="Antwort eingeben…"
            onkeydown="if(event.key==='Enter')checkFill('${item.id}','${escapeStr(item.answer)}')">
          <button onclick="checkFill('${item.id}','${escapeStr(item.answer)}')"
            class="px-4 py-2 bg-amber-500 hover:bg-amber-400 text-white rounded-lg text-sm font-bold transition-all flex-shrink-0">OK</button>
        </div>
        <div id="fb-${item.id}" class="hidden"></div>
        ${done ? '<div class="text-xs text-green-600 font-bold mt-1"><i class="fas fa-check mr-1"></i>Bereits gewusst</div>' : ''}
      </div>`;
    });
  }

  // ── Match section ──
  if(matches.length) {
    html += `<div class="flex items-center gap-2 mb-3 mt-4">
      <span class="badge badge-match"><i class="fas fa-link mr-1"></i>Zuordnung</span>
      <div class="flex-1 h-px bg-slate-200"></div>
    </div>`;
    matches.forEach((item,mi) => {
      html += buildMatchHTML(item, mi);
    });
  }

  area.innerHTML = html;

  // Init drag/drop for match items
  matches.forEach((item,mi) => initMatchDrag(item, mi));
}

function buildMatchHTML(item, mi) {
  const done = progress[item.id];
  const shuffledRight = shuffle([...item.pairs]);
  let leftHTML = item.pairs.map((p,i) =>
    `<div class="match-chip" draggable="true" id="chip-${item.id}-${i}" data-idx="${i}" data-mid="${item.id}">${p.left}</div>`
  ).join('');

  let rightHTML = shuffledRight.map((p,i) => {
    const origIdx = item.pairs.findIndex(pp=>pp.right===p.right);
    return `<div class="flex items-center gap-2 mb-2">
      <div class="text-xs font-semibold text-slate-600 w-28 flex-shrink-0">${p.right}</div>
      <div class="drop-zone flex-1" id="drop-${item.id}-${origIdx}"
        ondragover="event.preventDefault();this.classList.add('drag-over')"
        ondragleave="this.classList.remove('drag-over')"
        ondrop="handleDrop(event,'${item.id}',${origIdx},'${escapeStr(item.pairs[origIdx].left)}')">Hierher ziehen…</div>
    </div>`;
  }).join('');

  return `
  <div class="lc lc-match" id="card-${item.id}">
    <p class="text-sm font-bold text-slate-700 mb-3">${item.q}</p>
    <div class="bg-slate-50 rounded-xl p-3 mb-3 flex flex-wrap gap-1" id="chips-${item.id}">${leftHTML}</div>
    <div>${rightHTML}</div>
    <div class="flex gap-2 mt-3">
      <button onclick="checkMatch('${item.id}')" class="px-4 py-2 bg-cyan-500 hover:bg-cyan-400 text-white rounded-lg text-sm font-bold transition-all">Prüfen</button>
      <button onclick="resetMatch('${item.id}')" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg text-sm font-bold transition-all">Reset</button>
    </div>
    <div id="fb-${item.id}" class="hidden"></div>
    ${done ? '<div class="text-xs text-green-600 font-bold mt-1"><i class="fas fa-check mr-1"></i>Bereits gewusst</div>' : ''}
  </div>`;
}

function initMatchDrag(item, mi) {
  item.pairs.forEach((p,i) => {
    const chip = document.getElementById(`chip-${item.id}-${i}`);
    if(!chip) return;
    chip.addEventListener('dragstart', e => {
      dragSource = {matchId: item.id, idx: i, left: p.left};
      e.dataTransfer.effectAllowed = 'move';
    });
  });
}

function handleDrop(e, matchId, targetIdx, expectedLeft) {
  e.preventDefault();
  const zone = e.currentTarget;
  zone.classList.remove('drag-over');
  if(!dragSource || dragSource.matchId !== matchId) return;

  zone.textContent = dragSource.left;
  zone.classList.add('filled');
  zone.dataset.placed = dragSource.idx;

  const chip = document.getElementById(`chip-${matchId}-${dragSource.idx}`);
  if(chip) chip.classList.add('placed');
  dragSource = null;
}

function checkMatch(matchId) {
  const item = learnItems.find(i=>i.id===matchId);
  if(!item) return;
  let correct = 0;
  item.pairs.forEach((p,i) => {
    const zone = document.getElementById(`drop-${matchId}-${i}`);
    if(!zone) return;
    const placed = parseInt(zone.dataset.placed);
    if(placed === i) {
      zone.classList.add('correct');
      correct++;
    } else if(zone.dataset.placed !== undefined && zone.dataset.placed !== '') {
      zone.classList.add('wrong');
    }
  });
  const fb = document.getElementById(`fb-${matchId}`);
  if(fb) {
    fb.classList.remove('hidden');
    if(correct === item.pairs.length) {
      fb.innerHTML = `<div class="fb fb-ok"><i class="fas fa-check-circle mr-1"></i>Alle richtig!</div>`;
      markDone(matchId);
    } else {
      fb.innerHTML = `<div class="fb fb-no"><i class="fas fa-times-circle mr-1"></i>${correct} von ${item.pairs.length} richtig. Versuche es nochmal!</div>`;
    }
  }
}

function resetMatch(matchId) {
  const item = learnItems.find(i=>i.id===matchId);
  if(!item) return;
  item.pairs.forEach((p,i) => {
    const zone = document.getElementById(`drop-${matchId}-${i}`);
    if(zone) {
      zone.textContent = 'Hierher ziehen…';
      zone.className = 'drop-zone flex-1';
      delete zone.dataset.placed;
    }
    const chip = document.getElementById(`chip-${matchId}-${i}`);
    if(chip) chip.classList.remove('placed');
  });
  const fb = document.getElementById(`fb-${matchId}`);
  if(fb) fb.classList.add('hidden');
}

// ── TF Check ──
function checkTF(id, answer, correct) {
  const rBtn = document.getElementById(`tf-r-${id}`);
  const fBtn = document.getElementById(`tf-f-${id}`);
  if(rBtn) { rBtn.disabled=true; rBtn.className = `tf-btn richtig ${answer?'selected-r':''}`; }
  if(fBtn) { fBtn.disabled=true; fBtn.className = `tf-btn falsch ${!answer?'selected-f':''}`; }
  const fb = document.getElementById(`fb-${id}`);
  if(!fb) return;
  fb.classList.remove('hidden');
  if(answer === correct) {
    fb.innerHTML = `<div class="fb fb-ok"><i class="fas fa-check-circle mr-1"></i>Richtig!</div>`;
    markDone(id);
  } else {
    fb.innerHTML = `<div class="fb fb-no"><i class="fas fa-times-circle mr-1"></i>Falsch. Die Aussage ist <strong>${correct?'RICHTIG':'FALSCH'}</strong>.</div>`;
  }
}

// ── Fill Check ──
function checkFill(id, answer) {
  const inp = document.getElementById(`fill-${id}`);
  const fb = document.getElementById(`fb-${id}`);
  if(!inp || !fb) return;
  inp.disabled = true;
  const user = inp.value.trim().toLowerCase();
  const ans = answer.toLowerCase();
  const isOk = user === ans || (user.length > 2 && ans.includes(user)) || (ans.length > 2 && user.includes(ans.split(' ')[0]));
  fb.classList.remove('hidden');
  if(isOk) {
    inp.classList.add('ok');
    fb.innerHTML = `<div class="fb fb-ok"><i class="fas fa-check-circle mr-1"></i>Richtig!</div>`;
    markDone(id);
  } else {
    inp.classList.add('nope');
    fb.innerHTML = `<div class="fb fb-no"><i class="fas fa-times-circle mr-1"></i>Falsch. Richtige Antwort: <strong>${answer}</strong></div>`;
  }
}

function escapeStr(s) {
  return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"');
}

// ═══════════════════════════════════════════════
//  FLASHCARD MODE
// ═══════════════════════════════════════════════
function renderCards(area) {
  // Build flashcards from bank directly
  const cards = bankData.slice(0, 30).map((q,i) => {
    const opts = getOptions(q);
    const correct = getCorrectOption(q, opts);
    return {
      id: `m${currentMod}_card_${i}`,
      front: shortenText(cleanText(q.question), 150),
      back: correct ? shortenText(cleanText(String(correct)), 150) : '–',
      topic: q.topic || q.thema || ''
    };
  }).filter(c => c.front && c.back !== '–');

  if(!cards.length) {
    area.innerHTML = '<p class="text-slate-400 text-center py-12 text-sm">Keine Karten verfügbar.</p>';
    return;
  }

  const total = cards.length;
  if(cardIdx >= total) cardIdx = 0;
  const card = cards[cardIdx];
  const done = progress[card.id];
  const doneCnt = cards.filter(c=>progress[c.id]).length;

  area.innerHTML = `
  <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 mb-5">
    <div class="flex items-center justify-between mb-3">
      <span class="text-xs font-bold text-slate-400">${cardIdx+1} / ${total}</span>
      <span class="text-xs font-bold text-indigo-500">${doneCnt} gewusst</span>
    </div>
    <div class="prog-bar mb-5"><div class="prog-fill" style="width:${((cardIdx+1)/total*100).toFixed(0)}%"></div></div>

    <div class="flip-card mb-5" id="fc" onclick="document.getElementById('fc').classList.toggle('flipped')">
      <div class="flip-inner">
        <div class="flip-front bg-gradient-to-br from-indigo-50 to-indigo-100 border-2 border-indigo-200">
          ${card.topic ? `<div class="text-xs font-bold text-indigo-400 mb-2 uppercase tracking-wide">${card.topic}</div>` : ''}
          <p class="text-base font-bold text-slate-800 leading-snug">${card.front}</p>
          <p class="text-xs text-indigo-400 mt-4 font-medium">Tippen zum Umdrehen ↺</p>
        </div>
        <div class="flip-back bg-gradient-to-br from-green-50 to-emerald-100 border-2 border-green-200">
          <i class="fas fa-lightbulb text-green-400 text-2xl mb-3"></i>
          <p class="text-sm font-bold text-slate-700 leading-snug">${card.back}</p>
        </div>
      </div>
    </div>

    <div class="flex gap-3 justify-center">
      <button onclick="cardNav(-1,${total})" ${cardIdx===0?'disabled':''} class="px-5 py-2.5 bg-white border-2 border-slate-200 hover:border-indigo-300 rounded-xl font-bold text-sm text-slate-600 transition-all disabled:opacity-40">
        <i class="fas fa-chevron-left mr-1"></i>Zurück
      </button>
      <button onclick="cardKnow('${card.id}',${total})" class="px-5 py-2.5 ${done?'bg-green-100 text-green-700 border-2 border-green-200':'bg-green-500 text-white'} rounded-xl font-bold text-sm transition-all">
        ${done?'✓ Gewusst':'Gewusst ✓'}
      </button>
      <button onclick="cardNav(1,${total})" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-bold text-sm transition-all">
        Weiter <i class="fas fa-chevron-right ml-1"></i>
      </button>
    </div>
  </div>

  <div class="grid grid-cols-3 gap-3 text-center">
    <div class="bg-white rounded-xl p-3 border border-slate-100">
      <div class="text-xl font-black text-indigo-600">${total}</div>
      <div class="text-xs text-slate-400 font-medium">Karten gesamt</div>
    </div>
    <div class="bg-white rounded-xl p-3 border border-slate-100">
      <div class="text-xl font-black text-green-600">${doneCnt}</div>
      <div class="text-xs text-slate-400 font-medium">Gewusst</div>
    </div>
    <div class="bg-white rounded-xl p-3 border border-slate-100">
      <div class="text-xl font-black text-amber-600">${total-doneCnt}</div>
      <div class="text-xs text-slate-400 font-medium">Noch offen</div>
    </div>
  </div>`;
}

function cardNav(dir, total) {
  cardIdx = Math.max(0, Math.min(total-1, cardIdx+dir));
  renderCards(document.getElementById('content-area'));
}

function cardKnow(id, total) {
  markDone(id);
  cardIdx = Math.min(total-1, cardIdx+1);
  renderCards(document.getElementById('content-area'));
}

// ═══════════════════════════════════════════════
//  QUIZ MODE
// ═══════════════════════════════════════════════
function renderQuiz(area) {
  // Build quiz from MC questions in bank
  const mcItems = bankData.filter(q => {
    const opts = getOptions(q);
    return opts.length >= 3 && getCorrectOption(q, opts);
  });

  if(mcItems.length < 4) {
    area.innerHTML = `<div class="bg-amber-50 border border-amber-200 rounded-2xl p-6 text-center">
      <i class="fas fa-info-circle text-amber-400 text-2xl mb-2"></i>
      <p class="text-amber-700 font-semibold text-sm">Nicht genug Multiple-Choice-Fragen für dieses Modul verfügbar.</p>
    </div>`;
    return;
  }

  const questions = shuffle(mcItems).slice(0,10).map((q,i) => {
    const opts = getOptions(q);
    const correct = getCorrectOption(q, opts);
    const correctText = shortenText(cleanText(String(correct)), 80);
    const wrongOpts = opts.filter(o=>cleanText(o)!==cleanText(String(correct))).map(o=>shortenText(cleanText(o),80));
    const allOpts = shuffle([correctText, ...shuffle(wrongOpts).slice(0,3)]).filter(Boolean);
    return {
      q: shortenText(cleanText(q.question), 150),
      opts: allOpts,
      correct: correctText,
      topic: q.topic || q.thema || ''
    };
  });

  quizState = { questions, current: 0, score: 0, answered: false };
  renderQuizQ(area);
}

function renderQuizQ(area) {
  if(!area) area = document.getElementById('content-area');
  const {questions, current, score, answered} = quizState;

  if(current >= questions.length) {
    const pct = Math.round(score/questions.length*100);
    const grade = pct >= 80 ? '🎉 Ausgezeichnet!' : pct >= 60 ? '👍 Gut gemacht!' : '💪 Weiter üben!';
    const color = pct >= 80 ? 'green' : pct >= 60 ? 'amber' : 'red';
    area.innerHTML = `
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-8 text-center">
      <div class="quiz-result-circle bg-${color}-100 text-${color}-600 mb-4">${pct}%</div>
      <h3 class="text-xl font-black text-slate-800 mb-1">Quiz beendet!</h3>
      <p class="text-sm text-slate-500 mb-1">${score} von ${questions.length} richtig</p>
      <p class="text-base font-bold text-${color}-600 mb-6">${grade}</p>
      <div class="flex gap-3 justify-center">
        <button onclick="renderQuiz(document.getElementById('content-area'))"
          class="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-bold text-sm transition-all">
          <i class="fas fa-redo mr-2"></i>Nochmal
        </button>
        <button onclick="setMode('learn')"
          class="px-6 py-3 bg-white border-2 border-slate-200 hover:border-indigo-300 text-slate-600 rounded-xl font-bold text-sm transition-all">
          <i class="fas fa-book mr-2"></i>Zurück zum Lernen
        </button>
      </div>
    </div>`;
    return;
  }

  const q = questions[current];
  area.innerHTML = `
  <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5">
    <div class="flex items-center justify-between mb-2">
      <span class="badge badge-mc"><i class="fas fa-question-circle mr-1"></i>Frage ${current+1}/${questions.length}</span>
      <span class="text-sm font-black text-indigo-600">${score} Pkt.</span>
    </div>
    <div class="prog-bar mb-4"><div class="prog-fill" style="width:${(current/questions.length*100).toFixed(0)}%"></div></div>
    ${q.topic ? `<div class="text-xs text-slate-400 font-semibold mb-2">${q.topic}</div>` : ''}
    <p class="text-base font-bold text-slate-800 mb-5 leading-snug">${q.q}</p>
    <div class="space-y-2" id="quiz-opts">
      ${q.opts.map((opt,i) => `
        <button class="ans-opt" onclick="selectQuizAns(this,'${escapeStr(opt)}','${escapeStr(q.correct)}')">
          <span class="inline-block w-6 h-6 bg-slate-100 text-slate-500 text-xs font-black rounded-lg text-center leading-6 mr-2">${'ABCD'[i]}</span>${opt}
        </button>`).join('')}
    </div>
    <div id="quiz-fb" class="hidden mt-4"></div>
    <button id="quiz-next" onclick="nextQuizQ()" class="hidden mt-4 w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-bold text-sm transition-all">
      ${current+1===questions.length ? 'Ergebnis anzeigen' : 'Nächste Frage'} <i class="fas fa-arrow-right ml-1"></i>
    </button>
  </div>`;
}

function selectQuizAns(btn, selected, correct) {
  if(quizState.answered) return;
  quizState.answered = true;
  document.querySelectorAll('.ans-opt').forEach(b => {
    b.disabled = true;
    const bText = b.textContent.trim().substring(2); // remove letter prefix
    if(b.textContent.includes(correct)) b.classList.add('correct');
    else if(b === btn) b.classList.add('wrong');
  });
  const fb = document.getElementById('quiz-fb');
  const next = document.getElementById('quiz-next');
  if(fb) {
    fb.classList.remove('hidden');
    if(selected === correct) {
      quizState.score++;
      fb.innerHTML = `<div class="fb fb-ok"><i class="fas fa-check-circle mr-1"></i>Richtig!</div>`;
    } else {
      fb.innerHTML = `<div class="fb fb-no"><i class="fas fa-times-circle mr-1"></i>Falsch. Richtig: <strong>${correct}</strong></div>`;
    }
  }
  if(next) next.classList.remove('hidden');
}

function nextQuizQ() {
  quizState.current++;
  quizState.answered = false;
  renderQuizQ(document.getElementById('content-area'));
}

function show(id) { const el=document.getElementById(id); if(el) el.classList.remove('hidden'); }
function hide(id) { const el=document.getElementById(id); if(el) el.classList.add('hidden'); }
