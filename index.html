<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLM System - Wartungsmodus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #060910;
            color: #f1f5f9;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin: 0;
        }

        .page-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: radial-gradient(circle at 20% 30%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(139, 92, 246, 0.05) 0%, transparent 50%);
        }

        .glass {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            z-index: 10;
        }

        .gradient-text {
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        .glow-icon {
            animation: pulse-glow 3s infinite ease-in-out;
            color: #6366f1;
        }
    </style>
</head>
<body>
    <div class="page-bg"></div>

    <div class="max-w-md w-full px-6">
        <div class="glass rounded-3xl p-8 sm:p-10 text-center shadow-2xl">
            <div class="w-20 h-20 bg-indigo-600/10 rounded-2xl flex items-center justify-center mx-auto mb-8 border border-indigo-500/20">
                <i class="fas fa-tools text-4xl glow-icon"></i>
            </div>

            <h1 class="text-3xl font-extrabold tracking-tight mb-4 text-white">
                System-Update
            </h1>

            <p class="text-slate-400 text-base leading-relaxed mb-8">
                Wir bereiten das SLM System auf den nächsten großen Schritt vor. Das Dashboard wird in Kürze inklusive der <span class="text-indigo-400 font-bold">Zwischenprüfung-Vorbereitung</span> wieder verfügbar sein.
            </p>

            <div class="inline-flex items-center gap-3 bg-white/5 border border-white/10 px-4 py-2 rounded-full mb-6">
                <span class="relative flex h-2 w-2">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-orange-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-orange-500"></span>
                </span>
                <span class="text-[10px] font-black uppercase tracking-widest text-slate-300">Wartungsarbeiten aktiv</span>
            </div>

            <div class="text-[11px] text-slate-500 font-bold uppercase tracking-[0.2em] pt-6 border-t border-white/5">
                Examenstraining 2026 • v9.1
            </div>
        </div>
    </div>
</body>
</html>
